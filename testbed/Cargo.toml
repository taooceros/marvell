[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dpdk-sys = { path = "crates/dpdk-sys" }
dpdk = { path = "crates/dpdk" }
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = true # keep symbols for perf
lto = "fat"
codegen-units = 1
