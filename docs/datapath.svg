<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-13 overview. The paths between host and card and the headline number of each:
       requests (host to card) by one-direction throughput, replies (card to host) by W=1 round-trip p50.
       Dashed = the receiver comes and reads it (fetch: card reads the host's ring; pull: host reads card memory).
       Numbers: docs/video/data/FACTS.md; 64 B, batch 1, host uncore pinned. Details live in the MRV-13 text. -->
  <defs>
    <marker id="head-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="530" fill="white"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">主机 ⇄ 卡：每条通路有多快</text>
  <text x="30" y="68" font-size="14" fill="#64748b">64 B，批大小 1，uncore 固定</text>

  <!-- lanes -->
  <g fill="#f1f5f9">
    <rect x="30" y="92" width="140" height="408" rx="12"/>
    <rect x="790" y="92" width="140" height="408" rx="12"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">
    <text x="100" y="302">主机</text>
    <text x="860" y="302">卡</text>
  </g>

  <!-- requests: host to card, throughput -->
  <text x="194" y="122" font-size="14" font-weight="bold" fill="#2563eb">去程 · 吞吐</text>
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#head-blue)">
    <line x1="170" y1="166" x2="788" y2="166"/>
    <line x1="170" y1="210" x2="788" y2="210"/>
    <line x1="170" y1="254" x2="788" y2="254" stroke-dasharray="7 5"/>
  </g>
  <g font-size="16" fill="#1e293b">
    <text x="194" y="156">SDP 门铃</text>
    <text x="194" y="200">MOVDIR64B</text>
    <text x="194" y="244">fetch</text>
  </g>
  <g font-size="20" font-weight="bold" fill="#0f172a" text-anchor="end">
    <text x="766" y="156">8.36 <tspan font-size="13" font-weight="normal" fill="#64748b">M/s</tspan></text>
    <text x="766" y="200">112 <tspan font-size="13" font-weight="normal" fill="#64748b">M/s</tspan></text>
    <text x="766" y="244">187–189 <tspan font-size="13" font-weight="normal" fill="#64748b">M/s</tspan></text>
  </g>

  <!-- replies: card to host, W=1 round trip -->
  <text x="194" y="304" font-size="14" font-weight="bold" fill="#dc2626">回程 · W=1 往返</text>
  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#head-red)">
    <line x1="790" y1="348" x2="172" y2="348"/>
    <line x1="790" y1="392" x2="172" y2="392"/>
    <line x1="790" y1="436" x2="172" y2="436"/>
    <line x1="790" y1="480" x2="172" y2="480" stroke-dasharray="7 5"/>
  </g>
  <g font-size="16" fill="#1e293b">
    <text x="194" y="338">SDP</text>
    <text x="194" y="382">DPI DMA</text>
    <text x="194" y="426">卡核直写</text>
    <text x="194" y="470">主机拉取</text>
  </g>
  <g font-size="20" font-weight="bold" fill="#0f172a" text-anchor="end">
    <text x="766" y="338">2.40 <tspan font-size="13" font-weight="normal" fill="#64748b">µs</tspan></text>
    <text x="766" y="382">1.33 <tspan font-size="13" font-weight="normal" fill="#64748b">µs</tspan></text>
    <text x="766" y="426">0.90 <tspan font-size="13" font-weight="normal" fill="#64748b">µs</tspan></text>
    <text x="766" y="470">0.84 <tspan font-size="13" font-weight="normal" fill="#64748b">µs</tspan></text>
  </g>
</svg>
