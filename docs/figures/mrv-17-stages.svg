<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="white"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">13 M/s 时，窗口里的消息停在哪一段</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#4b5563">闭环：W=128，写合并回复，卡 1 核，主机核 40，64 B，批大小 1；数字是主机每 5 万条采样一次、各次的中位数</text>

  <!-- column labels -->
  <text x="150" y="88" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="bold">主机</text>
  <text x="810" y="88" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="bold">卡（CN106）</text>

  <!-- request path (top row, left to right) -->
  <rect x="40" y="105" width="220" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="150" y="133" text-anchor="middle" font-size="13" fill="#1e3a8a">1 主机核用 MOVDIR64B</text>
  <text x="150" y="153" text-anchor="middle" font-size="13" fill="#1e3a8a">写请求格（BAR4 槽 15）</text>

  <rect x="370" y="105" width="220" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="480" y="133" text-anchor="middle" font-size="13" fill="#1e3a8a">2–3 主机 IIO → PCIe →</text>
  <text x="480" y="153" text-anchor="middle" font-size="13" fill="#1e3a8a">卡 PEM → 卡内存请求环</text>

  <rect x="700" y="105" width="220" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="810" y="133" text-anchor="middle" font-size="13" fill="#1e3a8a">4 卡核轮询请求环，</text>
  <text x="810" y="153" text-anchor="middle" font-size="13" fill="#1e3a8a">找到请求</text>

  <line x1="260" y1="140" x2="368" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="140" x2="698" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="205" text-anchor="middle" font-size="13" fill="#1d4ed8">主机已发、卡还没发出回复：约 2 条（请求方向不排队）</text>


  <!-- the wait: stages 5-7 -->
  <rect x="290" y="232" width="650" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="306" y="256" font-size="14" font-weight="bold" fill="#b91c1c">卡已发出回复的写、主机内存里还没有：约 108 条</text>
  <text x="306" y="276" font-size="12" fill="#b91c1c">等待在第 5–7 级这一段；在哪一处、为什么只在闭环里慢，还没定位</text>

  <!-- turn at the card (drawn over the highlighted area) -->
  <line x1="810" y1="175" x2="810" y2="283" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="700" y="285" width="220" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="810" y="313" text-anchor="middle" font-size="13" fill="#9a3412">5 卡核写回复</text>
  <text x="810" y="333" text-anchor="middle" font-size="13" fill="#9a3412">（写合并，经 PEM 出窗口）</text>

  <rect x="370" y="285" width="220" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="480" y="313" text-anchor="middle" font-size="13" fill="#9a3412">6–7 卡 PEM → PCIe →</text>
  <text x="480" y="333" text-anchor="middle" font-size="13" fill="#9a3412">主机 IIO → 主机内存回复环</text>

  <line x1="700" y1="320" x2="592" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="285" width="220" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="150" y="313" text-anchor="middle" font-size="13" fill="#14532d">8 主机核轮询回复环，</text>
  <text x="150" y="333" text-anchor="middle" font-size="13" fill="#14532d">取到回复后再发下一条</text>
  <line x1="370" y1="320" x2="262" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="285" x2="150" y2="177" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="150" y="380" text-anchor="middle" font-size="12" fill="#15803d">回复已到主机内存、主机还没取：0 条</text>
  <text x="150" y="398" text-anchor="middle" font-size="12" fill="#15803d">（主机多半在等最老的那一格）</text>

  <!-- fast state -->
  <rect x="40" y="445" width="880" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="480" y="470" text-anchor="middle" font-size="13" fill="#111827">对照：W=1024 的快状态（约 50 M/s）时，没取的 992 条全都已在主机内存里，</text>
  <text x="480" y="490" text-anchor="middle" font-size="13" fill="#111827">卡不落后、也没有在路上的：这时是主机核来不及取（第 8 级）。</text>

  <text x="40" y="532" font-size="11" fill="#4b5563">排除过的：主机每次最多收 32 条（改成 8 / 64，拐点不动）；CHA 里请求、回复的停留不随 W 变长（102 / 52 ns）；</text>
  <text x="40" y="550" font-size="11" fill="#4b5563">单向卡→主机流里，主机边到边读刚到的行、卡一格一格写，都没有把速度压到 13 M/s（到 24 M/s 都跟得上）。</text>
  <text x="40" y="568" font-size="11" fill="#4b5563">这个位置是近似的：采样本身会让 W=128 的吞吐变一点（13.6 / 14.6 对不采样的 13.1 / 13.1 Mmsg/s）。</text>
</svg>
