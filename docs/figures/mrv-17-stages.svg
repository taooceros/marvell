<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-44 / MRV-46. Where the in-flight messages of the closed loop sit.
       Left: W=128 (~13 M/s), ~108 between the card's reply write and host memory.
       Right: W=1024 (~50 M/s), ~992 already in host memory, waiting for the host core.
       Numbers: docs/figures/mrv-17-where-wait.py (logs/mrv17-2026-11-17). Explanations live in the issue text. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="404" fill="white"/>

  <!-- headers -->
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">13 M/s 时，消息停在哪</text>
  <text x="30" y="68" font-size="14" fill="#64748b">W=128，写合并，卡 1 核</text>
  <text x="700" y="42" font-size="16" font-weight="bold" fill="#0f172a">对照：W=1024</text>
  <text x="700" y="68" font-size="14" fill="#64748b">50 M/s</text>

  <!-- lanes -->
  <g fill="#f1f5f9">
    <rect x="30" y="92" width="650" height="120" rx="12"/>
    <rect x="30" y="252" width="650" height="120" rx="12"/>
    <rect x="700" y="92" width="230" height="120" rx="12"/>
    <rect x="700" y="252" width="230" height="120" rx="12"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#64748b">
    <text x="52" y="158">主机</text>
    <text x="52" y="318">卡</text>
  </g>
  <text x="52" y="237" font-size="13" fill="#94a3b8">PCIe</text>

  <!-- W=128: stages -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="128" y="126" width="124" height="52" rx="10"/>
    <rect x="304" y="126" width="124" height="52" rx="10"/>
    <rect x="128" y="286" width="124" height="52" rx="10"/>
    <rect x="480" y="286" width="124" height="52" rx="10"/>
  </g>
  <g font-size="16" fill="#1e293b" text-anchor="middle">
    <text x="190" y="158">写请求</text>
    <text x="366" y="158">轮询回复</text>
    <text x="190" y="318">轮询请求</text>
    <text x="542" y="318">写回复</text>
    <text x="542" y="127">主机内存</text>
  </g>
  <!-- host memory: reply ring slots, empty -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="484" y="138" width="16" height="28" rx="3"/>
    <rect x="504" y="138" width="16" height="28" rx="3"/>
    <rect x="524" y="138" width="16" height="28" rx="3"/>
    <rect x="544" y="138" width="16" height="28" rx="3"/>
    <rect x="564" y="138" width="16" height="28" rx="3"/>
    <rect x="584" y="138" width="16" height="28" rx="3"/>
  </g>

  <!-- W=128: flow -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#head)">
    <line x1="190" y1="178" x2="190" y2="284"/>
    <line x1="252" y1="312" x2="478" y2="312"/>
    <line x1="484" y1="152" x2="430" y2="152"/>
    <line x1="304" y1="152" x2="254" y2="152"/>
  </g>
  <text x="202" y="237" font-size="13" fill="#94a3b8">MOVDIR64B</text>

  <!-- W=128: the wait, between the card's write and host memory -->
  <line x1="542" y1="286" x2="542" y2="171" stroke="#dc2626" stroke-width="2" marker-end="url(#head-red)"/>
  <g fill="#dc2626">
    <rect x="525" y="191" width="34" height="8" rx="2"/>
    <rect x="525" y="203" width="34" height="8" rx="2"/>
    <rect x="525" y="215" width="34" height="8" rx="2"/>
    <rect x="525" y="227" width="34" height="8" rx="2"/>
    <rect x="525" y="239" width="34" height="8" rx="2"/>
    <rect x="525" y="251" width="34" height="8" rx="2"/>
    <rect x="525" y="263" width="34" height="8" rx="2"/>
  </g>
  <text x="574" y="240" font-size="24" font-weight="bold" fill="#dc2626">~108</text>

  <!-- W=1024: the same loop, small -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="720" y="140" width="50" height="24" rx="6"/>
    <rect x="790" y="140" width="50" height="24" rx="6"/>
    <rect x="720" y="300" width="50" height="24" rx="6"/>
    <rect x="860" y="300" width="50" height="24" rx="6"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#head)">
    <line x1="745" y1="164" x2="745" y2="298"/>
    <line x1="770" y1="312" x2="858" y2="312"/>
    <line x1="885" y1="300" x2="885" y2="168"/>
    <line x1="856" y1="152" x2="842" y2="152"/>
    <line x1="790" y1="152" x2="772" y2="152"/>
  </g>
  <!-- host memory: reply ring slots, full -->
  <g fill="#dc2626">
    <rect x="856" y="140" width="8" height="24" rx="2"/>
    <rect x="866" y="140" width="8" height="24" rx="2"/>
    <rect x="876" y="140" width="8" height="24" rx="2"/>
    <rect x="886" y="140" width="8" height="24" rx="2"/>
    <rect x="896" y="140" width="8" height="24" rx="2"/>
    <rect x="906" y="140" width="8" height="24" rx="2"/>
  </g>
  <text x="885" y="128" font-size="24" font-weight="bold" fill="#dc2626" text-anchor="middle">~992</text>
</svg>
