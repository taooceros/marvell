<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 416" width="1060" height="416" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean white background -->
  <rect x="0" y="0" width="1060" height="416" fill="#FFFFFF"/>

  <!-- Zone containers -->
  <rect x="20" y="42" width="548" height="350" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="36" y="28" font-size="13.5" font-weight="700" fill="#334155">单变量切换：卡 ⇄ 主机接口（PCIe Gen5 x4 · 零 DSA）</text>

  <rect x="592" y="42" width="448" height="350" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="608" y="28" font-size="13.5" font-weight="700" fill="#334155">完全固定：CN106 NIX0+LBK0 硬件回环</text>

  <!-- Host Core (cpu40) -->
  <rect x="36" y="72" width="114" height="298" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="93" y="184" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0F172A">主机核</text>
  <text x="93" y="208" text-anchor="middle" font-size="11.5" fill="#475569">1H · cpu40</text>
  <text x="93" y="228" text-anchor="middle" font-size="11" fill="#64748B">3.90 GHz</text>
  <text x="93" y="250" text-anchor="middle" font-size="10.5" fill="#64748B">128 MiB TX 池</text>
  <text x="93" y="268" text-anchor="middle" font-size="10" fill="#94A3B8">2 MiB 大页 · N1</text>

  <!-- Card Core (core 3) -->
  <rect x="450" y="72" width="102" height="298" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="501" y="186" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0F172A">卡核</text>
  <text x="501" y="210" text-anchor="middle" font-size="11.5" fill="#475569">1C · core 3</text>
  <text x="501" y="230" text-anchor="middle" font-size="11" fill="#64748B">2.00 GHz</text>
  <text x="501" y="252" text-anchor="middle" font-size="10.5" fill="#64748B">1RxQ / 1TxQ</text>

  <!-- TOP LANE: Traditional SDP (Grey) -->
  <rect x="192" y="72" width="216" height="96" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">传统 SDP</text>
  <text x="300" y="124" text-anchor="middle" font-size="11" fill="#64748B">描述符环 · MMIO 门铃</text>
  <text x="300" y="144" text-anchor="middle" font-size="11" fill="#64748B">全尺寸 DMA · MTU 9000</text>

  <!-- Straight horizontal arrows for SDP -->
  <line x1="150" y1="106" x2="188" y2="106" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="192" y1="136" x2="154" y2="136" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="408" y1="106" x2="446" y2="106" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="450" y1="136" x2="412" y2="136" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>

  <!-- "vs" badge between SDP and DirectPush -->
  <circle cx="300" cy="197" r="14" fill="#E2E8F0"/>
  <text x="300" y="201" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">vs</text>

  <!-- BOTTOM LANE: DirectPush + Native DPI DMA (Single Accent Teal) -->
  <rect x="192" y="226" width="216" height="144" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="300" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F766E">DirectPush + DPI DMA</text>
  <line x1="208" y1="264" x2="392" y2="264" stroke="#99F6E4" stroke-width="1"/>
  <text x="300" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#115E59">≤ 256 B：MOVDIR64B → BAR4</text>
  <text x="300" y="303" text-anchor="middle" font-size="11" fill="#115E59">PEM0 WC → 主机 DDIO</text>
  <line x1="224" y1="315" x2="376" y2="315" stroke="#CCFBF1" stroke-width="1"/>
  <text x="300" y="335" text-anchor="middle" font-size="11" font-weight="600" fill="#115E59">≥ 1 KiB：2× DPI VF 双向零拷贝</text>
  <text x="300" y="354" text-anchor="middle" font-size="10.2" fill="#0F766E">06:00.1 (H2C) · 06:00.2 (C2H)</text>

  <!-- Straight horizontal arrows for DirectPush -->
  <line x1="150" y1="280" x2="188" y2="280" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>
  <line x1="192" y1="314" x2="154" y2="314" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>
  <line x1="408" y1="280" x2="446" y2="280" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>
  <line x1="450" y1="314" x2="412" y2="314" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>

  <!-- RIGHT ZONE: Real CN106 NIX0 + LBK0 Hardware Loopback (PF2 0002:03:00.0) -->
  <!-- Straight horizontal Card Core -> NIX0 TX -->
  <line x1="552" y1="118" x2="616" y2="118" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>
  <text x="584" y="106" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">tx_burst</text>

  <!-- NIX0 TX block -->
  <rect x="620" y="82" width="152" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="696" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">NIX0 TX 引擎</text>
  <text x="696" y="134" text-anchor="middle" font-size="10.5" fill="#64748B">SQ · TM · NPC TX MCAM</text>

  <!-- Hardware LBK0 block -->
  <rect x="802" y="166" width="118" height="96" rx="8" fill="#E2E8F0" stroke="#334155" stroke-width="1.8"/>
  <text x="861" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">硬件 LBK0</text>
  <text x="861" y="218" text-anchor="middle" font-size="11" fill="#475569">ch 63 硬件环回</text>
  <text x="861" y="236" text-anchor="middle" font-size="10" fill="#64748B">PF2 0002:03:00.0</text>
  <text x="861" y="252" text-anchor="middle" font-size="9.8" font-weight="600" fill="#334155">NIX0 · NPC · NPA</text>

  <!-- Bypassed RPM PHY block (clearly shows LBK0 architectural boundary) -->
  <line x1="920" y1="214" x2="942" y2="214" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="931" y="207" text-anchor="middle" font-size="10" font-weight="700" fill="#94A3B8">✕</text>
  <rect x="944" y="166" width="80" height="96" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="984" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">RPM</text>
  <text x="984" y="213" text-anchor="middle" font-size="9.5" fill="#94A3B8">MAC · PCS</text>
  <text x="984" y="229" text-anchor="middle" font-size="9.5" fill="#94A3B8">FEC·SerDes</text>
  <text x="984" y="249" text-anchor="middle" font-size="9.5" font-weight="600" fill="#64748B">（旁路）</text>

  <!-- NIX0 RX block -->
  <rect x="620" y="274" width="152" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="696" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">NIX0 RX 引擎</text>
  <text x="696" y="326" text-anchor="middle" font-size="10.5" fill="#64748B">NPC RX · NPA · RQ/CQ</text>

  <!-- NIX0 TX -> LBK0 -> NIX0 RX orthogonal hardware loop -->
  <path d="M 772 118 L 861 118 L 861 162" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>
  <path d="M 861 262 L 861 310 L 776 310" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>

  <!-- Straight horizontal NIX0 RX -> Card Core -->
  <line x1="620" y1="310" x2="556" y2="310" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>
  <text x="584" y="329" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">rx_burst</text>

  <!-- Hardware measurement callout badge inside right box -->
  <rect x="620" y="182" width="152" height="64" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="696" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">NIX 硬件实测验真</text>
  <text x="696" y="221" text-anchor="middle" font-size="10.2" fill="#64748B">xstats + CNTVCT 计时</text>
  <text x="696" y="237" text-anchor="middle" font-size="9.8" fill="#64748B">过 NIX0·NPC·NPA，无 RPM</text>
</svg>
