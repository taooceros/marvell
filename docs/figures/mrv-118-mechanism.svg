<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean white background -->
  <rect x="0" y="0" width="980" height="400" fill="#FFFFFF"/>

  <!-- Zone containers -->
  <rect x="20" y="42" width="540" height="332" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="36" y="28" font-size="13.5" font-weight="700" fill="#334155">单变量切换：卡 ⇄ 主机接口（PCIe Gen5 x4）</text>

  <rect x="588" y="42" width="372" height="332" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="604" y="28" font-size="13.5" font-weight="700" fill="#334155">完全固定：CN106 NIX0 硬件回环</text>

  <!-- Host Core (cpu40) -->
  <rect x="38" y="76" width="110" height="274" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="93" y="182" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0F172A">主机核</text>
  <text x="93" y="206" text-anchor="middle" font-size="11.5" fill="#475569">1H · cpu40</text>
  <text x="93" y="226" text-anchor="middle" font-size="11" fill="#64748B">3.90 GHz</text>
  <text x="93" y="248" text-anchor="middle" font-size="10.5" fill="#64748B">128 MiB TX 池</text>

  <!-- Card Core (core 3) -->
  <rect x="446" y="76" width="98" height="274" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="495" y="190" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0F172A">卡核</text>
  <text x="495" y="214" text-anchor="middle" font-size="11.5" fill="#475569">1C · core 3</text>
  <text x="495" y="234" text-anchor="middle" font-size="11" fill="#64748B">2.00 GHz</text>

  <!-- TOP LANE: Traditional SDP (Grey) -->
  <rect x="192" y="76" width="210" height="96" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="297" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">传统 SDP</text>
  <text x="297" y="128" text-anchor="middle" font-size="11" fill="#64748B">描述符环 · MMIO 门铃</text>
  <text x="297" y="148" text-anchor="middle" font-size="11" fill="#64748B">全尺寸 DMA · MTU 9000</text>

  <!-- Straight horizontal arrows for SDP -->
  <line x1="148" y1="110" x2="188" y2="110" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="192" y1="138" x2="152" y2="138" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="402" y1="110" x2="442" y2="110" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="446" y1="138" x2="406" y2="138" stroke="#64748B" stroke-width="2" marker-end="url(#arr-grey)"/>

  <!-- "vs" badge between SDP and DirectPush -->
  <circle cx="297" cy="204" r="14" fill="#E2E8F0"/>
  <text x="297" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">vs</text>

  <!-- BOTTOM LANE: DirectPush + Native DPI DMA (Single Accent Teal) -->
  <rect x="192" y="236" width="210" height="114" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="297" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F766E">DirectPush + DPI DMA</text>
  <line x1="208" y1="274" x2="386" y2="274" stroke="#99F6E4" stroke-width="1"/>
  <text x="297" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#115E59">≤ 256 B：MOVDIR64B → BAR4</text>
  <text x="297" y="313" text-anchor="middle" font-size="11" fill="#115E59">PEM0 WC → 主机 DDIO</text>
  <text x="297" y="335" text-anchor="middle" font-size="11" font-weight="600" fill="#115E59">≥ 1 KiB：原生 DPI 双向 DMA</text>

  <!-- Straight horizontal arrows for DirectPush -->
  <line x1="148" y1="278" x2="188" y2="278" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>
  <line x1="192" y1="308" x2="152" y2="308" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>
  <line x1="402" y1="278" x2="442" y2="278" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>
  <line x1="446" y1="308" x2="406" y2="308" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-accent)"/>

  <!-- RIGHT ZONE: Real CN106 NIX0 + LBK0 Hardware Loopback (PF2 0002:03:00.0) -->
  <!-- Straight horizontal Card Core -> NIX0 TX -->
  <line x1="544" y1="120" x2="616" y2="120" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>
  <text x="580" y="109" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">tx_burst</text>

  <!-- NIX0 TX block -->
  <rect x="620" y="84" width="152" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="696" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">NIX0 TX 引擎</text>
  <text x="696" y="136" text-anchor="middle" font-size="10.5" fill="#64748B">SQ · TM · NPC TX MCAM</text>

  <!-- Hardware LBK0 block -->
  <rect x="812" y="164" width="126" height="88" rx="8" fill="#E2E8F0" stroke="#334155" stroke-width="1.8"/>
  <text x="875" y="198" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">硬件 LBK0</text>
  <text x="875" y="220" text-anchor="middle" font-size="11" fill="#475569">ch 63 硬件环回</text>
  <text x="875" y="238" text-anchor="middle" font-size="10.5" fill="#64748B">0002:03:00.0</text>

  <!-- NIX0 RX block -->
  <rect x="620" y="260" width="152" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="696" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">NIX0 RX 引擎</text>
  <text x="696" y="312" text-anchor="middle" font-size="10.5" fill="#64748B">NPC RX · NPA · RQ/CQ</text>

  <!-- NIX0 TX -> LBK0 -> NIX0 RX orthogonal hardware loop -->
  <path d="M 772 120 L 875 120 L 875 160" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>
  <path d="M 875 252 L 875 296 L 776 296" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>

  <!-- Straight horizontal NIX0 RX -> Card Core -->
  <line x1="620" y1="296" x2="548" y2="296" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark)"/>
  <text x="580" y="315" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">rx_burst</text>

  <!-- Hardware measurement callout badge inside right box -->
  <rect x="620" y="182" width="152" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="696" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">NIX 硬件实测验真</text>
  <text x="696" y="222" text-anchor="middle" font-size="10.5" fill="#64748B">xstats + CNTVCT 计时</text>
</svg>
