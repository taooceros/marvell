<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480">
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; fill: #1e293b; }
      .sec { font-size: 16px; font-weight: 700; }
      .sec-accent { font-size: 16px; font-weight: 700; fill: #0f766e; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-sub { font-size: 12.5px; fill: #475569; }
      .box-sub-sm { font-size: 12px; fill: #475569; }
      .kpi-bad { font-size: 20px; font-weight: 700; fill: #334155; }
      .kpi-good { font-size: 20px; font-weight: 700; fill: #0f766e; }
      .lbl { font-size: 12.5px; fill: #475569; }
      .lbl-accent { font-size: 13px; font-weight: 700; fill: #0f766e; }
    </style>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1040" height="480" fill="#ffffff"/>

  <!-- ================= ROW A: PASSIVE 128 MiB HOST RING ================= -->
  <rect x="24" y="18" width="992" height="198" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="47" class="sec">方案 A：128 MiB 突发灌进主机大环</text>

  <!-- Card box A -->
  <rect x="44" y="68" width="180" height="126" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="102" text-anchor="middle" class="box-title">CN106 网卡</text>
  <text x="134" y="128" text-anchor="middle" class="box-sub">64 B 突发到达</text>
  <text x="134" y="150" text-anchor="middle" class="box-sub">100 M 条/s</text>
  <text x="134" y="176" text-anchor="middle" class="box-sub">直接外推，不蓄水</text>

  <!-- Arrow Card -> Host Ring A (wide 128 px gap) -->
  <line x1="224" y1="131" x2="342" y2="131" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-grey)"/>
  <text x="283" y="118" text-anchor="middle" class="lbl">WC 直推</text>
  <text x="283" y="152" text-anchor="middle" class="lbl">整批灌入主机</text>

  <!-- Host Ring A (DDIO sliver + big DRAM spill) -->
  <rect x="352" y="68" width="398" height="126" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <!-- Small DDIO bar -->
  <rect x="364" y="80" width="108" height="102" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="418" y="115" text-anchor="middle" class="box-title">DDIO</text>
  <text x="418" y="138" text-anchor="middle" class="box-sub">8 MiB</text>
  <text x="418" y="164" text-anchor="middle" class="box-sub">命中 16.3%</text>

  <!-- DRAM spill area -->
  <rect x="484" y="80" width="254" height="102" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
  <text x="611" y="105" text-anchor="middle" class="box-title">溢出主机 DDR5 主存</text>
  <text x="611" y="138" text-anchor="middle" class="kpi-bad">91.4% LLC 缺失</text>
  <text x="611" y="166" text-anchor="middle" class="box-sub">主存读写 1.90 行/包</text>

  <!-- Arrow Host Ring A -> CPU A -->
  <line x1="750" y1="131" x2="826" y2="131" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-grey)"/>
  <text x="788" y="118" text-anchor="middle" class="lbl">读 DRAM</text>

  <!-- Host CPU A -->
  <rect x="836" y="68" width="160" height="126" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="916" y="106" text-anchor="middle" class="box-title">主机核 cpu40</text>
  <text x="916" y="142" text-anchor="middle" class="kpi-bad">6.21 ns/包</text>
  <text x="916" y="170" text-anchor="middle" class="box-sub">比热缓存慢 2.0×</text>

  <!-- ================= ROW B: ACTIVE NIC + 256 KiB HOST HOT RING ================= -->
  <rect x="24" y="236" width="992" height="224" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="44" y="266" class="sec-accent">方案 B：128 MiB 突发留主动网卡（主机只留 256 KiB 热环）</text>

  <!-- Active Card box B (wide sub-boxes for crisp padding) -->
  <rect x="44" y="284" width="272" height="116" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="180" y="310" text-anchor="middle" class="box-title">CN106 主动网卡</text>
  <rect x="56" y="322" width="118" height="64" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <text x="115" y="348" text-anchor="middle" class="lbl-accent">卡 L3 48 MiB</text>
  <text x="115" y="371" text-anchor="middle" class="box-sub-sm">≤32 MiB 零 DDR</text>
  <rect x="186" y="322" width="118" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="245" y="348" text-anchor="middle" class="box-sub">卡 DDR5 48 GB</text>
  <text x="245" y="371" text-anchor="middle" class="box-sub-sm">175.4 M/s 排空</text>

  <!-- Arrow Card B -> Host Hot Ring B -->
  <line x1="316" y1="342" x2="416" y2="342" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="366" y="328" text-anchor="middle" class="lbl-accent">按额 WC 直推</text>
  <text x="366" y="362" text-anchor="middle" class="box-sub">同一条快路径</text>

  <!-- Host Hot Ring B (inside DDIO) -->
  <rect x="426" y="284" width="324" height="116" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="588" y="311" text-anchor="middle" class="box-title">主机 256 KiB 热环（常驻 DDIO）</text>
  <text x="588" y="348" text-anchor="middle" class="kpi-good">0.0% LLC 缺失 · 100% DDIO</text>
  <text x="588" y="379" text-anchor="middle" class="box-sub">主机主存读写 0.02 行/包（−98.9%）</text>

  <!-- Arrow Host Hot Ring B -> CPU B -->
  <line x1="750" y1="342" x2="826" y2="342" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="788" y="328" text-anchor="middle" class="lbl-accent">读热缓存</text>

  <!-- Host CPU B -->
  <rect x="836" y="284" width="160" height="116" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="916" y="318" text-anchor="middle" class="box-title">主机核 cpu40</text>
  <text x="916" y="354" text-anchor="middle" class="kpi-good">5.69 ns/包</text>
  <text x="916" y="381" text-anchor="middle" class="box-sub">大突发反超 −8.4%</text>

  <!-- Credit return feedback arrow -->
  <path d="M 916 400 L 916 434 L 180 434 L 180 407" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-teal)"/>
  <rect x="396" y="419" width="304" height="28" rx="6" fill="#f0fdfa"/>
  <text x="548" y="438" text-anchor="middle" class="lbl-accent">退回额度（BAR4）→ 0.905 µs 单跳补推</text>
</svg>
