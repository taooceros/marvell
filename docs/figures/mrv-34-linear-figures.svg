<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-34. How a figure gets into a Linear report: draw the SVG, keep the source in the repo,
       `linear-app figure` renders and uploads it, and the comment shows the figure before the text.
       When a figure is required is in AGENTS.md ("Figures in Linear reports"). -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="white"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">Linear 报告怎么带图</text>

  <!-- steps -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="30" y="124" width="140" height="52" rx="10"/>
    <rect x="226" y="124" width="140" height="52" rx="10"/>
    <rect x="422" y="124" width="180" height="52" rx="10"/>
  </g>
  <g font-size="16" fill="#1e293b" text-anchor="middle">
    <text x="100" y="156">画 SVG</text>
    <text x="296" y="156">进仓库</text>
    <text x="512" y="156">linear-app figure</text>
  </g>
  <g font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="296" y="198">docs/figures/</text>
    <text x="512" y="198">白底 PNG</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#head)">
    <line x1="170" y1="150" x2="224" y2="150"/>
    <line x1="366" y1="150" x2="420" y2="150"/>
    <line x1="602" y1="150" x2="656" y2="150"/>
  </g>

  <!-- the comment: figure first, text after -->
  <rect x="658" y="84" width="170" height="132" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="672" y="98" width="142" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <polyline points="684,146 710,124 736,136 766,112 802,128" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#cbd5e1">
    <rect x="672" y="172" width="142" height="6" rx="3"/>
    <rect x="672" y="185" width="142" height="6" rx="3"/>
    <rect x="672" y="198" width="88" height="6" rx="3"/>
  </g>
  <text x="743" y="242" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">图在前，字在后</text>
</svg>
