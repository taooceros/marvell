<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" font-family="Noto Sans CJK SC, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="230" fill="#fff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">以后每份 Linear 报告怎么带图</text>
  <g stroke-width="2" fill="none">
    <rect x="20" y="60" width="190" height="80" rx="8" stroke="#2563eb" fill="#eff6ff"/>
    <rect x="250" y="60" width="190" height="80" rx="8" stroke="#7c3aed" fill="#f5f3ff"/>
    <rect x="480" y="60" width="190" height="80" rx="8" stroke="#059669" fill="#ecfdf5"/>
    <rect x="710" y="60" width="170" height="80" rx="8" stroke="#ea580c" fill="#fff7ed"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="115" y="92" font-weight="bold">agent 画 SVG</text>
    <text x="115" y="116" font-size="13" fill="#555">结论、时间线、通路、对比</text>
    <text x="345" y="92" font-weight="bold">源文件进仓库</text>
    <text x="345" y="116" font-size="13" fill="#555">docs/figures/mrv-N-*.svg</text>
    <text x="575" y="92" font-weight="bold">linear-app figure</text>
    <text x="575" y="116" font-size="13" fill="#555">转 PNG（白底）并上传</text>
    <text x="795" y="92" font-weight="bold">贴进评论</text>
    <text x="795" y="116" font-size="13" fill="#555">图在前，文字解释在后</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="210" y1="100" x2="248" y2="100"/>
    <line x1="440" y1="100" x2="478" y2="100"/>
    <line x1="670" y1="100" x2="708" y2="100"/>
  </g>
  <text x="20" y="180" font-size="14" fill="#333">什么时候必须有图：结论、实验结果、原因解释（排查到哪一级、时间线、谁在等谁）。</text>
  <text x="20" y="205" font-size="14" fill="#333">可以不画：一两句的回答、排队/进度通知、只有一个数的回复。</text>
</svg>
