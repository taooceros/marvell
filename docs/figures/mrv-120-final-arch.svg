<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 368" width="1060" height="368">
  <defs>
    <style>
      .t-sans { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-hd { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box-sub { font-size: 12px; fill: #64748b; }
      .lane-blue { font-size: 14px; font-weight: 700; fill: #1d4ed8; }
      .lane-slate { font-size: 14px; font-weight: 700; fill: #334155; }
      .big-blue { font-size: 22px; font-weight: 800; fill: #1d4ed8; }
      .big-slate { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .tag { font-size: 12px; font-weight: 600; fill: #475569; }
      .tag-blue { font-size: 12px; font-weight: 600; fill: #1e40af; }
      .pill { font-size: 11.5px; font-weight: 700; fill: #334155; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1f6feb"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Pure white background -->
  <rect width="1060" height="368" fill="#ffffff"/>

  <!-- Top concise header -->
  <text x="530" y="34" text-anchor="middle" class="t-sans title">DirectPush：纯商用 PCIe 网卡双通道架构（零缓存一致性 · 零 Intel DSA · 真实 100GbE）</text>

  <!-- Left Node: mercury 100GbE peer -->
  <rect x="28" y="76" width="166" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="111" y="114" text-anchor="middle" class="t-sans box-hd">mercury</text>
  <text x="111" y="135" text-anchor="middle" class="t-sans box-sub">真实 100GbE 对端</text>
  <rect x="48" y="164" width="126" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="111" y="189" text-anchor="middle" class="t-sans pill">ConnectX-5</text>
  <text x="111" y="208" text-anchor="middle" class="t-sans box-sub">4-QP IBV_UD</text>
  <text x="111" y="274" text-anchor="middle" class="t-sans big-blue">−4.25 µs</text>
  <text x="111" y="294" text-anchor="middle" class="t-sans tag">64 B 实测净省</text>
  <text x="111" y="324" text-anchor="middle" class="t-sans tag-blue">1.61–3.24× 省核</text>

  <!-- 100GbE Wire between mercury and CN106 -->
  <line x1="202" y1="193" x2="294" y2="193" stroke="#475569" stroke-width="2.6" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/>
  <text x="248" y="177" text-anchor="middle" class="t-sans pill">100GbE DAC</text>
  <text x="248" y="214" text-anchor="middle" class="t-sans box-sub">3 m 物理线</text>

  <!-- Middle Node: CN106 NIC/DPU -->
  <rect x="302" y="76" width="206" height="270" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="405" y="110" text-anchor="middle" class="t-sans box-hd">Marvell CN106</text>
  <text x="405" y="130" text-anchor="middle" class="t-sans box-sub">RPM0 + NIX0 · 4C RSS</text>

  <!-- CN106 upper block: BAR4 + Card L3 (Accent Blue) -->
  <rect x="320" y="150" width="170" height="76" rx="8" fill="#eff6ff" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="405" y="175" text-anchor="middle" class="t-sans lane-blue">BAR4 ⇄ 卡 L3 (TAD)</text>
  <text x="405" y="196" text-anchor="middle" class="t-sans tag-blue">命中 99.94%</text>
  <text x="405" y="215" text-anchor="middle" class="t-sans tag-blue">C_line 行信用整形</text>

  <!-- CN106 lower block: Native DPI DMA (Neutral Slate) -->
  <rect x="320" y="246" width="170" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="405" y="271" text-anchor="middle" class="t-sans lane-slate">板载原生 DPI DMA</text>
  <text x="405" y="292" text-anchor="middle" class="t-sans tag">2 VFs (From/ToHost)</text>
  <text x="405" y="311" text-anchor="middle" class="t-sans tag">同通道保序 · 零晚尾</text>

  <!-- Right Node: saturn Host -->
  <rect x="812" y="76" width="220" height="270" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="922" y="110" text-anchor="middle" class="t-sans box-hd">saturn 主机</text>
  <text x="922" y="130" text-anchor="middle" class="t-sans box-sub">Xeon SPR · IOMMU + VFIO</text>

  <!-- saturn upper block: L1D / DDIO LLC (Accent Blue) -->
  <rect x="830" y="150" width="184" height="76" rx="8" fill="#eff6ff" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="922" y="175" text-anchor="middle" class="t-sans lane-blue">L1D 源 / DDIO LLC</text>
  <text x="922" y="196" text-anchor="middle" class="t-sans tag-blue">RX DDIO 99.9999%</text>
  <text x="922" y="215" text-anchor="middle" class="t-sans tag-blue">零一致性 TX 留存税</text>

  <!-- saturn lower block: 128 MiB TX Pool (Neutral Slate) -->
  <rect x="830" y="246" width="184" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="922" y="271" text-anchor="middle" class="t-sans lane-slate">128 MiB 留存池</text>
  <text x="922" y="292" text-anchor="middle" class="t-sans tag">零主机 memcpy</text>
  <text x="922" y="311" text-anchor="middle" class="t-sans tag">0.00 LLC 读缺失</text>

  <!-- PCIe Gen5 x4 Top Lane: Small Msg DirectPush (Accent Blue) -->
  <text x="660" y="104" text-anchor="middle" class="t-sans lane-blue">小包直推（≤ 256 B）</text>
  <text x="660" y="134" text-anchor="middle" class="t-sans big-blue">897 ns · 175.2 M/s</text>

  <!-- Host -> Card arrow (top) -->
  <line x1="802" y1="168" x2="516" y2="168" stroke="#1f6feb" stroke-width="2.8" marker-end="url(#arr-blue)"/>
  <text x="660" y="160" text-anchor="middle" class="t-sans tag-blue">无栅栏 MOVDIR64B (batch=1)</text>

  <!-- Card -> Host arrow (top) -->
  <line x1="516" y1="204" x2="802" y2="204" stroke="#1f6feb" stroke-width="2.8" marker-end="url(#arr-blue)"/>
  <text x="660" y="222" text-anchor="middle" class="t-sans tag-blue">卡 WC 写合并 → DDIO</text>

  <!-- PCIe Gen5 x4 Bottom Lane: Bulk Native NIC DPI DMA (Neutral Slate) -->
  <text x="660" y="264" text-anchor="middle" class="t-sans lane-slate">大载荷原生 DMA（≥ 512 B / 1 KiB）</text>
  <line x1="516" y1="286" x2="802" y2="286" stroke="#475569" stroke-width="2.6" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/>
  <text x="660" y="314" text-anchor="middle" class="t-sans big-slate">201.6 M/s · 97% 线速</text>
  <text x="660" y="334" text-anchor="middle" class="t-sans tag">1 格描述符 · 双信用窗 14,701× 隔离</text>
</svg>

