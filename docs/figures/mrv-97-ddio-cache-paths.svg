<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" font-family="DejaVu Sans, Noto Sans CJK SC, Droid Sans Fallback, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="488" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="208" y="30" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">主机 · Xeon 6438M</text>
  <text x="480" y="30" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">PCIe Gen5 ×4</text>
  <text x="752" y="30" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">卡端 · CN106</text>

  <!-- ==================== TOP LANE: HOST -> CARD BAR4 ==================== -->
  <rect x="20" y="46" width="154" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="97" y="62.5" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">去程  Host → BAR4</text>

  <!-- Host container (top) -->
  <rect x="20" y="80" width="376" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>

  <!-- Host L1D source -->
  <rect x="40" y="96" width="110" height="62" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="122" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">L1D 源</text>
  <text x="95" y="143" font-size="11.5" fill="#475569" text-anchor="middle">从 cache 读源</text>

  <!-- Arrow L1D -> MOVDIR64B -->
  <line x1="150" y1="127" x2="177" y2="127" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- Host MOVDIR64B -->
  <rect x="180" y="96" width="178" height="62" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="269" y="122" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">MOVDIR64B</text>
  <text x="269" y="143" font-size="11.5" fill="#475569" text-anchor="middle">64 B 直发 · 绕过主机 LLC</text>

  <!-- Host LLC bypassed (top) -->
  <rect x="180" y="176" width="178" height="50" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="269" y="198" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">主机 LLC · 无 DDIO</text>
  <text x="269" y="216" font-size="11" fill="#94a3b8" text-anchor="middle">BAR4 MMIO 不可 WB 缓存</text>

  <!-- PCIe top arrow (Host -> Card) -->
  <line x1="358" y1="127" x2="599" y2="127" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arr-blue)"/>
  <text x="480" y="114" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">64 B MWr → BAR4</text>
  <text x="480" y="147" font-size="12" fill="#64748b" text-anchor="middle">~458 ns (W=1)</text>

  <!-- Card container (top) -->
  <rect x="564" y="80" width="376" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <!-- Re-draw PCIe arrow segment entering card container so it sits above border -->
  <line x1="562" y1="127" x2="599" y2="127" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arr-blue)"/>
  <circle cx="576" cy="127" r="3" fill="#1d4ed8"/>

  <!-- Card L3 (TAD) active hit box -->
  <rect x="602" y="92" width="178" height="72" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="691" y="112" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">卡 L3 (TAD) · 已命中</text>
  <text x="691" y="140" font-size="24" font-weight="700" fill="#1d4ed8" text-anchor="middle">99.97%</text>
  <text x="691" y="156" font-size="11" fill="#475569" text-anchor="middle">tad_hit_any (4 MiB 环)</text>

  <!-- Arrow Card L3 -> Card Core -->
  <line x1="780" y1="127" x2="807" y2="127" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- Card Core (top) -->
  <rect x="810" y="96" width="110" height="62" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="865" y="122" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">卡核</text>
  <text x="865" y="143" font-size="11.5" fill="#475569" text-anchor="middle">轮询命中 L3</text>

  <!-- Bypass branch to Card DRAM -->
  <path d="M 576 130 L 576 201 L 599 201" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-grey)"/>
  <rect x="602" y="176" width="178" height="50" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="691" y="198" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">卡 DRAM</text>
  <text x="691" y="216" font-size="11" fill="#64748b" text-anchor="middle">冷行 / 驱逐（待测 Δt）</text>

  <!-- ==================== DIVIDER ==================== -->
  <line x1="20" y1="258" x2="940" y2="258" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="6,5"/>

  <!-- ==================== BOTTOM LANE: CARD -> HOST RAM ==================== -->
  <rect x="20" y="272" width="184" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="112" y="288.5" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">回程  Card → Host RAM</text>

  <!-- Host container (bottom) -->
  <rect x="20" y="306" width="376" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>

  <!-- Card container (bottom) -->
  <rect x="564" y="306" width="376" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>

  <!-- Card Core (bottom) -->
  <rect x="810" y="322" width="110" height="62" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="865" y="348" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">卡核</text>
  <text x="865" y="369" font-size="11.5" fill="#475569" text-anchor="middle">4×16 B STP</text>

  <!-- Arrow Card Core -> PEM0 WC -->
  <line x1="810" y1="353" x2="783" y2="353" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- Card PEM0 WC -->
  <rect x="602" y="322" width="178" height="62" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="691" y="348" font-size="14.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">PEM0 写合并 (WC)</text>
  <text x="691" y="369" font-size="11.5" fill="#475569" text-anchor="middle">合成 64 B 整行写</text>

  <!-- Card software latency pill -->
  <text x="752" y="428" font-size="12" fill="#64748b" text-anchor="middle">卡上处理 ~40 ns · 整行写 99.99%</text>

  <!-- PCIe bottom arrow (Card -> Host) -->
  <line x1="602" y1="353" x2="361" y2="353" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arr-blue)"/>
  <circle cx="384" cy="353" r="3" fill="#1d4ed8"/>
  <text x="480" y="340" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">64 B MWr → Host RAM</text>
  <text x="480" y="373" font-size="12" fill="#64748b" text-anchor="middle">~422 ns (W=1)</text>

  <!-- Host LLC (DDIO ON) active box -->
  <rect x="180" y="318" width="178" height="72" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="269" y="338" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">主机 LLC · DDIO 已开</text>
  <text x="269" y="366" font-size="24" font-weight="700" fill="#1d4ed8" text-anchor="middle">1.000</text>
  <text x="269" y="382" font-size="11" fill="#475569" text-anchor="middle">io_itom / 条 (256 KiB 环)</text>

  <!-- Arrow Host LLC -> Host Core 40 -->
  <line x1="180" y1="353" x2="153" y2="353" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- Host Core 40 (bottom) -->
  <rect x="40" y="322" width="110" height="62" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="95" y="348" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">主机核 40</text>
  <text x="95" y="369" font-size="11.5" fill="#475569" text-anchor="middle">轮询命中 LLC</text>

  <!-- Bypass branch to Host DRAM -->
  <path d="M 384 356 L 384 427 L 361 427" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-grey)"/>
  <rect x="180" y="402" width="178" height="50" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="269" y="424" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">主机 DRAM</text>
  <text x="269" y="442" font-size="11" fill="#64748b" text-anchor="middle">DDIO 关 WbMtoI（待测 Δt）</text>
</svg>
