<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 476" width="980" height="476">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4B5563"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
      .sec { font-size: 13px; font-weight: 700; fill: #374151; }
      .sec-red { font-size: 13px; font-weight: 700; fill: #B91C1C; }
      .box-lbl { font-size: 12.5px; font-weight: 600; fill: #1F2937; }
      .sub { font-size: 11px; fill: #4B5563; }
      .sub-muted { font-size: 10.5px; fill: #6B7280; }
      .sub-red { font-size: 11px; font-weight: 600; fill: #B91C1C; }
      .bignum-ok { font-size: 26px; font-weight: 800; fill: #1F2937; }
      .bignum-red { font-size: 26px; font-weight: 800; fill: #DC2626; }
      .tag { font-size: 11px; font-weight: 700; fill: #374151; }
      .tag-red { font-size: 11px; font-weight: 700; fill: #DC2626; }
    </style>
  </defs>

  <rect width="980" height="476" fill="#FFFFFF"/>

  <!-- Top lane: B1 / S1 (passive L2 prefetch invalidation, no active read-vs-write collision) -->
  <rect x="24" y="20" width="932" height="196" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="44" y="47" class="sec">1. 被动 L2 预取作废不串行（B1 单核 · S1 影子守私有行）</text>

  <!-- Host -->
  <rect x="44" y="76" width="124" height="74" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
  <text x="106" y="106" text-anchor="middle" class="box-lbl">主机 cpu40</text>
  <text x="106" y="126" text-anchor="middle" class="sub">MOVDIR64B (W=64)</text>

  <!-- PEM0/IOBN -->
  <rect x="216" y="76" width="142" height="74" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
  <text x="287" y="106" text-anchor="middle" class="box-lbl">PEM0 / IOBN</text>
  <text x="287" y="126" text-anchor="middle" class="sub">入向写顺畅流水</text>

  <!-- TAD -->
  <rect x="406" y="74" width="146" height="78" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
  <text x="479" y="100" text-anchor="middle" class="box-lbl">L3 TAD 目录</text>
  <text x="479" y="119" text-anchor="middle" class="sub">在途 1.05 条</text>
  <text x="479" y="137" text-anchor="middle" class="sub">嗅探 1.10 次/条</text>

  <!-- Ring core (B1 passive L2 prefetch) -->
  <rect x="628" y="64" width="166" height="60" rx="7" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
  <text x="711" y="84" text-anchor="middle" class="box-lbl">环核 3（批量滞后）</text>
  <text x="711" y="100" text-anchor="middle" class="sub">f = 0.9% · L1D 补载 0.17</text>
  <text x="711" y="115" text-anchor="middle" class="tag">L2 预取作废 0x58 = 0.99</text>

  <!-- Shadow private -->
  <rect x="628" y="134" width="166" height="44" rx="7" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="711" y="153" text-anchor="middle" class="sub">S1 影子核 4 · 私有行</text>
  <text x="711" y="169" text-anchor="middle" class="sub-muted">0x58 = 0.05（无碰撞）</text>

  <!-- Arrows top -->
  <line x1="168" y1="113" x2="210" y2="113" stroke="#4B5563" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="358" y1="113" x2="400" y2="113" stroke="#4B5563" stroke-width="2" marker-end="url(#arr-grey)"/>
  <!-- Passive prefetch snoop arrow -->
  <line x1="552" y1="94" x2="622" y2="94" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-muted)"/>
  <text x="587" y="86" text-anchor="middle" class="sub-muted">单次预取作废</text>

  <!-- Key number top -->
  <text x="876" y="104" text-anchor="middle" class="bignum-ok">35.1 M/s</text>
  <text x="876" y="128" text-anchor="middle" class="tag">不串行（28.5 ns/条）</text>
  <text x="876" y="148" text-anchor="middle" class="sub">S1: 35.3 M/s</text>
  <text x="876" y="165" text-anchor="middle" class="sub-muted">0x58 已有 0.99</text>

  <!-- Bottom lane: Active polling catches up to unlanded cells -> active read-vs-write collision -->
  <rect x="24" y="232" width="932" height="224" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4"/>
  <text x="44" y="260" class="sec-red">2. 活跃轮询追平未落地格 → 入向写与活跃读正面碰撞（WC2 · WC4 · S2/S3）</text>

  <!-- Host -->
  <rect x="44" y="286" width="124" height="84" rx="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
  <text x="106" y="320" text-anchor="middle" class="box-lbl">主机 cpu40</text>
  <text x="106" y="340" text-anchor="middle" class="sub">CHA 1.3 条（空闲）</text>

  <!-- PEM0/IOBN blocked -->
  <rect x="216" y="282" width="144" height="92" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="288" y="309" text-anchor="middle" class="sec-red">PEM0 / IOBN 串行</text>
  <text x="288" y="330" text-anchor="middle" class="sub-red">按序排队 ~76–81 ns/条</text>
  <text x="288" y="350" text-anchor="middle" class="sub">h2c = 3.7–4.0 µs</text>

  <!-- TAD snooping -->
  <rect x="406" y="284" width="146" height="88" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
  <text x="479" y="311" text-anchor="middle" class="box-lbl">L3 TAD 目录</text>
  <text x="479" y="331" text-anchor="middle" class="sub-red">在途跌至 0.11–0.27</text>
  <text x="479" y="351" text-anchor="middle" class="sub-red">嗅探 2.69–4.14 次/条</text>
  <text x="479" y="366" text-anchor="middle" class="sub-muted">WC4 对照 4.18</text>

  <!-- Active-polling core -->
  <rect x="628" y="282" width="166" height="92" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.0"/>
  <text x="711" y="305" text-anchor="middle" class="sec-red">活跃轮询核 L1D/L2</text>
  <text x="711" y="324" text-anchor="middle" class="sub">ldar / ldr / wfe / civac</text>
  <text x="711" y="343" text-anchor="middle" class="sub-red">0x58 作废 1.44–3.09</text>
  <text x="711" y="361" text-anchor="middle" class="sub">S2/S3 影子占 1.30–1.41</text>

  <!-- Arrows bottom -->
  <line x1="168" y1="328" x2="210" y2="328" stroke="#4B5563" stroke-width="2" marker-end="url(#arr-grey)"/>
  <line x1="360" y1="328" x2="400" y2="328" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <!-- Snoop <-> Active read collision loop -->
  <line x1="552" y1="312" x2="622" y2="312" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="587" y="303" text-anchor="middle" class="tag-red">写前嗅探</text>
  <line x1="622" y1="344" x2="558" y2="344" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="587" y="362" text-anchor="middle" class="tag-red">活跃读碰撞</text>

  <!-- Key number bottom -->
  <text x="876" y="314" text-anchor="middle" class="bignum-red">12.5–13.1</text>
  <text x="876" y="335" text-anchor="middle" class="tag-red">M/s（−64%）</text>
  <text x="876" y="357" text-anchor="middle" class="sub">A1 13.1 · A3 12.4</text>
  <text x="876" y="374" text-anchor="middle" class="sub">A4 11.5 · S2 12.7</text>

  <!-- Compact MRV-46 result pills (no sentences) -->
  <rect x="44" y="396" width="118" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="103" y="418" text-anchor="middle" class="tag">A1 去next · 13.1</text>
  <rect x="172" y="396" width="114" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="229" y="418" text-anchor="middle" class="tag">A2 ldr · 13.1</text>
  <rect x="296" y="396" width="118" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="355" y="418" text-anchor="middle" class="tag">A3 WFE · 12.4</text>
  <rect x="424" y="396" width="122" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="485" y="418" text-anchor="middle" class="tag">A4 CIVAC · 11.5</text>
  <rect x="556" y="396" width="116" height="36" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.1"/>
  <text x="614" y="418" text-anchor="middle" class="tag-red">S2 front · 12.7</text>
  <rect x="682" y="396" width="112" height="36" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.1"/>
  <text x="738" y="418" text-anchor="middle" class="tag-red">S3 +4格 · 12.5</text>
</svg>
