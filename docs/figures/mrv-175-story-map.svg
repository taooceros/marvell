<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700">
  <defs>
    <style>
      .t-title { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .t-sub   { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 13.5px; font-weight: 500; fill: #64748B; }
      .t-sec   { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .t-box-h { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 15.5px; font-weight: 700; fill: #0F172A; }
      .t-box-s { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12.5px; fill: #475569; }
      .t-chip  { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
      .t-chip-a{ font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: 700; fill: #0F766E; }
      .t-arrow { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12.5px; font-weight: 700; fill: #0F766E; }
      .t-arrow-g{ font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .t-step-n{ font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .t-step-h{ font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 14.5px; font-weight: 700; fill: #0F172A; }
      .t-big   { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 21px; font-weight: 800; fill: #0F766E; }
      .t-mid   { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .t-tiny  { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 11.5px; fill: #64748B; }
    </style>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#475569"/>
    </marker>
    <marker id="arr-light" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Clean white background -->
  <rect width="1280" height="700" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="40" y="44" class="t-title">CC-NIC does not need Cache Coherence</text>
  <text x="40" y="68" class="t-sub">商用 PCIe Gen5×4（IOMMU 开启 · 零 Intel DSA · 真实双机 100GbE）全局数据面架构与六步实证主线</text>
  <line x1="40" y1="84" x2="1240" y2="84" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ==================== UPPER HALF: UNIFIED ARCHITECTURE ==================== -->
  <text x="40" y="108" class="t-sec">DirectPush 双通道数据面与主动网卡架构</text>

  <!-- Box 1: Host saturn -->
  <rect x="40" y="122" width="290" height="222" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="58" y="148" class="t-box-h">主机 saturn（仅 1 核）</text>
  <text x="58" y="167" class="t-box-s">Xeon SPR 3.9 GHz · 60 MiB LLC</text>

  <rect x="58" y="182" width="254" height="44" rx="7" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.4"/>
  <text x="72" y="201" class="t-chip-a">256 KiB 热环（常驻 DDIO / L3）</text>
  <text x="72" y="218" class="t-tiny">小包直推原地复用 · 接收零 DRAM 污染</text>

  <rect x="58" y="236" width="254" height="44" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="72" y="255" class="t-chip">128 MiB 应用留存池（2 MiB 大页）</text>
  <text x="72" y="272" class="t-tiny">本地自留存 · 零跨链路一致性作废</text>

  <rect x="58" y="290" width="254" height="40" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="72" y="308" class="t-chip">在途行信用 C_line + 双信用窗</text>
  <text x="72" y="323" class="t-tiny">防入向桥串行 · 大小包 HoL 隔离</text>

  <!-- PCIe Bus Band -->
  <rect x="348" y="122" width="268" height="222" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="482" y="144" text-anchor="middle" class="t-chip">非一致 PCIe Gen5×4</text>
  <text x="482" y="161" text-anchor="middle" class="t-tiny">无损链路 · 硬件 IOMMU 全程开启</text>

  <!-- Arrow 1: Host -> Card MOVDIR64B -->
  <line x1="334" y1="196" x2="626" y2="196" stroke="#0F766E" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="482" y="188" text-anchor="middle" class="t-arrow">≤ 256 B  MOVDIR64B → 卡 L3</text>
  <text x="482" y="213" text-anchor="middle" class="t-tiny">无逐笔 SFENCE · 175.2 M/s</text>

  <!-- Arrow 2: Card -> Host PEM0 WC -->
  <line x1="630" y1="248" x2="338" y2="248" stroke="#0F766E" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="482" y="240" text-anchor="middle" class="t-arrow">PEM0 WC → 主机 DDIO</text>
  <text x="482" y="265" text-anchor="middle" class="t-tiny">单机 897 ns · 单向 177.5 M/s</text>

  <!-- Arrow 3: Bidirectional DPI DMA -->
  <line x1="338" y1="306" x2="626" y2="306" stroke="#475569" stroke-width="2.2" marker-start="url(#arr-grey)" marker-end="url(#arr-grey)"/>
  <text x="482" y="297" text-anchor="middle" class="t-arrow-g">≥ 512 B  网卡原生 DPI DMA</text>
  <text x="482" y="324" text-anchor="middle" class="t-tiny">收 105.5 Gbps（写）· 发 88.7 Gbps（读）</text>

  <!-- Box 2: Active NIC CN106 -->
  <rect x="634" y="122" width="320" height="222" rx="12" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
  <text x="652" y="148" class="t-box-h">主动网卡 Marvell CN106</text>
  <text x="652" y="167" class="t-box-s">ARM 2.0 GHz · 48 MiB L3 · 6 通道 DDR5</text>

  <rect x="652" y="182" width="284" height="44" rx="7" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.3"/>
  <text x="666" y="201" class="t-chip-a">主动突发蓄水（48M L3 → DDR5）</text>
  <text x="666" y="218" class="t-tiny">按主机额度 0.905 µs 原位补推</text>

  <rect x="652" y="236" width="284" height="44" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="666" y="255" class="t-chip">CQE 缓存窥探（ldar 4.89 ns）</text>
  <text x="666" y="272" class="t-tiny">替代 578.5 ns 同步 LDADDA（快 118×）</text>

  <rect x="652" y="290" width="284" height="40" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="666" y="308" class="t-chip">NIX0 / RPM0 硬件收发引擎</text>
  <text x="666" y="323" class="t-tiny">独立 SMQ 发 100.0M · 收 111.1M</text>

  <!-- 100GbE Wire Arrow -->
  <line x1="958" y1="232" x2="1050" y2="232" stroke="#0F766E" stroke-width="3" marker-start="url(#arr-teal)" marker-end="url(#arr-teal)"/>
  <text x="1004" y="215" text-anchor="middle" class="t-arrow">100GbE</text>
  <text x="1004" y="251" text-anchor="middle" class="t-tiny">3 m DAC</text>

  <!-- Box 3: Peer mercury -->
  <rect x="1056" y="156" width="184" height="154" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="1148" y="186" text-anchor="middle" class="t-box-h">对端 mercury</text>
  <text x="1148" y="206" text-anchor="middle" class="t-box-s">ConnectX-5</text>
  <line x1="1076" y1="220" x2="1220" y2="220" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="1148" y="246" text-anchor="middle" class="t-big">5.29 µs</text>
  <text x="1148" y="264" text-anchor="middle" class="t-tiny">64 B 实网往返</text>
  <text x="1148" y="290" text-anchor="middle" class="t-mid" style="font-size: 12px;">1 核 RX 满 · TX 94–100G</text>

  <!-- Divider -->
  <line x1="40" y1="366" x2="1240" y2="366" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="40" y="392" class="t-sec">六步论文论证主线（22 项核心实测 · 3,990 轮归档日志）</text>

  <!-- ==================== LOWER HALF: 6 ARGUMENT CARDS ==================== -->
  <!-- Card width = 184, gap = 19, total = 6*184 + 5*19 = 1104 + 95 = 1199 -> x starts at 40 -->

  <!-- Step 1 -->
  <rect x="40" y="408" width="184" height="260" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="64" cy="432" r="13" fill="#0F766E"/>
  <text x="64" y="437" text-anchor="middle" class="t-step-n">1</text>
  <text x="86" y="437" class="t-step-h">破前提与保序</text>
  <line x1="54" y1="454" x2="210" y2="454" stroke="#E2E8F0" stroke-width="1"/>
  <text x="56" y="488" class="t-big">175.2 M/s</text>
  <text x="56" y="508" class="t-tiny">去逐笔 SFENCE（21.6×）</text>
  <text x="56" y="544" class="t-big">897 ns</text>
  <text x="56" y="564" class="t-tiny">胜 CXL-NIC 与 SDP 5.2×</text>
  <line x1="54" y1="582" x2="210" y2="582" stroke="#E2E8F0" stroke-width="1"/>
  <text x="56" y="604" class="t-mid">头尾双序号保序</text>
  <text x="56" y="623" class="t-tiny">三段缓存默认生效</text>
  <text x="56" y="652" class="t-tiny">MRV-89 / 97 / 148</text>

  <line x1="226" y1="538" x2="240" y2="538" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-light)"/>

  <!-- Step 2 -->
  <rect x="243" y="408" width="184" height="260" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="267" cy="432" r="13" fill="#0F766E"/>
  <text x="267" y="437" text-anchor="middle" class="t-step-n">2</text>
  <text x="289" y="437" class="t-step-h">零一致性税</text>
  <line x1="257" y1="454" x2="413" y2="454" stroke="#E2E8F0" stroke-width="1"/>
  <text x="259" y="488" class="t-big">−0.9%</text>
  <text x="259" y="508" class="t-tiny">128 MiB 留存 vs −20%</text>
  <text x="259" y="544" class="t-big">99.9999%</text>
  <text x="259" y="564" class="t-tiny">8.16 亿次 DDIO 命中</text>
  <line x1="257" y1="582" x2="413" y2="582" stroke="#E2E8F0" stroke-width="1"/>
  <text x="259" y="604" class="t-mid">单核原地复用 174.8M</text>
  <text x="259" y="623" class="t-tiny">2112 B 破缓存组别名</text>
  <text x="259" y="652" class="t-tiny">MRV-116 / 125 / 149</text>

  <line x1="429" y1="538" x2="443" y2="538" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-light)"/>

  <!-- Step 3 -->
  <rect x="446" y="408" width="184" height="260" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="470" cy="432" r="13" fill="#0F766E"/>
  <text x="470" y="437" text-anchor="middle" class="t-step-n">3</text>
  <text x="492" y="437" class="t-step-h">拥塞与流控</text>
  <line x1="460" y1="454" x2="616" y2="454" stroke="#E2E8F0" stroke-width="1"/>
  <text x="462" y="488" class="t-big">↓ 6–64×</text>
  <text x="462" y="508" class="t-tiny">20 M/s p99 至 7.01 µs</text>
  <text x="462" y="544" class="t-big">48.2 M/s</text>
  <text x="462" y="564" class="t-tiny">4 核独占子环（行/s）</text>
  <line x1="460" y1="582" x2="616" y2="582" stroke="#E2E8F0" stroke-width="1"/>
  <text x="462" y="604" class="t-mid">定位单写单读前沿撞车</text>
  <text x="462" y="623" class="t-tiny">读端滑移 + 写端控窗</text>
  <text x="462" y="652" class="t-tiny">MRV-75/112/115/123/173</text>

  <line x1="632" y1="538" x2="646" y2="538" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-light)"/>

  <!-- Step 4 -->
  <rect x="649" y="408" width="184" height="260" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="673" cy="432" r="13" fill="#0F766E"/>
  <text x="673" y="437" text-anchor="middle" class="t-step-n">4</text>
  <text x="695" y="437" class="t-step-h">分工与公平核账</text>
  <line x1="663" y1="454" x2="819" y2="454" stroke="#E2E8F0" stroke-width="1"/>
  <text x="665" y="488" class="t-big">1.54–2.07×</text>
  <text x="665" y="508" class="t-tiny">公平异步 SDP 省核总倍率</text>
  <text x="665" y="544" class="t-big">14,701×</text>
  <text x="665" y="564" class="t-tiny">双信用窗大包 HoL 隔离</text>
  <line x1="663" y1="582" x2="819" y2="582" stroke="#E2E8F0" stroke-width="1"/>
  <text x="665" y="604" class="t-mid">原生 DPI 省 2.86× 核</text>
  <text x="665" y="623" class="t-tiny">区分栈税 vs 64 B 硬件优</text>
  <text x="665" y="652" class="t-tiny">MRV-117 / 127 / 166</text>

  <line x1="835" y1="538" x2="849" y2="538" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-light)"/>

  <!-- Step 5 -->
  <rect x="852" y="408" width="184" height="260" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8"/>
  <circle cx="876" cy="432" r="13" fill="#0F766E"/>
  <text x="876" y="437" text-anchor="middle" class="t-step-n">5</text>
  <text x="898" y="437" class="t-step-h">双机 100GbE 实网</text>
  <line x1="866" y1="454" x2="1022" y2="454" stroke="#99F6E4" stroke-width="1.2"/>
  <text x="868" y="488" class="t-big">0.935 µs</text>
  <text x="868" y="508" class="t-tiny">实网主机增量（5.29 µs）</text>
  <text x="868" y="544" class="t-big">100 Gbps</text>
  <text x="868" y="564" class="t-tiny">1 核 RX 满 · TX 94–100G</text>
  <line x1="866" y1="582" x2="1022" y2="582" stroke="#99F6E4" stroke-width="1.2"/>
  <text x="868" y="604" class="t-mid">DPI 写 105.5G 超读</text>
  <text x="868" y="623" class="t-tiny">TX 100M / RX 111.1M 顶</text>
  <text x="868" y="652" class="t-tiny" style="font-size: 9.8px;">MRV-133/154/155 · 161/163/172</text>

  <line x1="1038" y1="538" x2="1052" y2="538" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-light)"/>

  <!-- Step 6 -->
  <rect x="1055" y="408" width="185" height="260" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="1079" cy="432" r="13" fill="#0F766E"/>
  <text x="1079" y="437" text-anchor="middle" class="t-step-n">6</text>
  <text x="1101" y="437" class="t-step-h">主动网卡蓄水</text>
  <line x1="1069" y1="454" x2="1226" y2="454" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1071" y="488" class="t-big">−98.9%</text>
  <text x="1071" y="508" class="t-tiny">128M 突发主机主存流量</text>
  <text x="1071" y="544" class="t-big">0.01%</text>
  <text x="1071" y="564" class="t-tiny">主机 LLC 读缺失（91.4%→）</text>
  <line x1="1069" y1="582" x2="1226" y2="582" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1071" y="604" class="t-mid">零积压仅 +6 ns</text>
  <text x="1071" y="623" class="t-tiny">还额单跳恒定 0.905 µs</text>
  <text x="1071" y="652" class="t-tiny">MRV-153 / 158</text>
</svg>
