<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1180" height="520" fill="#ffffff"/>

  <!-- Zone 1: CN106 Card -->
  <rect x="28" y="32" width="308" height="456" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="68" font-size="17" font-weight="700" fill="#0f172a">CN106 板卡</text>
  <text x="312" y="68" text-anchor="end" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748b">VF0 99:02.0</text>

  <!-- Card Core -->
  <rect x="52" y="100" width="120" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">卡核</text>
  <text x="112" y="164" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#2563eb">STP × 4 (WC)</text>

  <!-- DPI Engine -->
  <rect x="52" y="248" width="120" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="112" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">DPI 引擎</text>
  <text x="112" y="309" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">06:00.1</text>

  <!-- PEM0 Outbound Window -->
  <rect x="208" y="100" width="104" height="232" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">PEM0</text>
  <text x="260" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">出向窗 [255]</text>
  <text x="260" y="224" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">/dev/pem_wc</text>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#64748b">2 GiB 窗口</text>

  <!-- Card internal arrows -->
  <line x1="172" y1="146" x2="204" y2="146" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-accent)"/>
  <line x1="112" y1="192" x2="112" y2="244" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arr-muted)"/>
  <line x1="172" y1="290" x2="204" y2="290" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arr-muted)"/>
  <text x="100" y="224" text-anchor="end" font-size="13" font-weight="600" fill="#64748b">(b) DPI</text>

  <!-- Big 64 B callout at bottom-left of card -->
  <rect x="52" y="372" width="260" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="110" y="428" text-anchor="middle" font-size="34" font-weight="800" font-family="'JetBrains Mono', monospace" fill="#2563eb">64 B</text>
  <line x1="168" y1="390" x2="168" y2="442" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="184" y="411" font-size="14" font-weight="700" fill="#1e3a8a">整行 Posted MWr</text>
  <text x="184" y="435" font-size="12" fill="#475569">DWQ 唯一接收粒度</text>

  <!-- Zone 2: Host Socket 1 (NUMA 1) -->
  <rect x="444" y="32" width="708" height="456" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="468" y="68" font-size="17" font-weight="700" fill="#0f172a">主机 Socket 1 (NUMA 1)</text>
  <text x="1124" y="68" text-anchor="end" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748b">Xeon 6438M · Mesh 2.2 GHz</text>

  <!-- PCIe Link corridor between Zone 1 (x=336) and Zone 2 (x=444) -->
  <text x="390" y="124" text-anchor="middle" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#64748b">PCIe Gen5 x4</text>

  <!-- dmar0 Box -->
  <rect x="468" y="100" width="188" height="232" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.75"/>
  <text x="562" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">IIO 98:01.0 · dmar0</text>
  <text x="562" y="152" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">VF0 IOMMU (group 286)</text>

  <!-- dmar0 mapping slot 1: Portal P2P -->
  <rect x="484" y="170" width="156" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.75"/>
  <text x="562" y="194" text-anchor="middle" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#1e3a8a">portal_iova (4K)</text>
  <text x="562" y="216" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">→ 0x237ffff21000</text>

  <!-- dmar0 mapping slot 2: Host Ring -->
  <rect x="484" y="250" width="156" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="562" y="274" text-anchor="middle" font-size="12" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#334155">ring_iova (2M)</text>
  <text x="562" y="296" text-anchor="middle" font-size="12" fill="#64748b">→ 主机大页 HPA</text>

  <!-- Arrows across PCIe corridor (x=312 to x=480) -->
  <!-- Path (a) primary -->
  <line x1="312" y1="201" x2="478" y2="201" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arr-accent)"/>
  <rect x="344" y="160" width="92" height="28" rx="6" fill="#2563eb"/>
  <text x="390" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(a) WC 直写</text>

  <!-- Path (c) to ring_iova -->
  <line x1="312" y1="281" x2="478" y2="281" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>
  <text x="390" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">(c) 写主机环</text>

  <!-- Host Core Fallback Box (Path c) -->
  <rect x="688" y="250" width="136" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="756" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">主机核转发 (c)</text>
  <text x="756" y="297" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">MOVDIR64B</text>

  <!-- dsa2 Box -->
  <rect x="860" y="100" width="264" height="232" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="992" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Intel DSA (dsa2 · f2:01.0)</text>
  <text x="992" y="152" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">IIO f2 · dmar6 (group 18)</text>

  <!-- dsa2 BAR2 Portal -->
  <rect x="880" y="170" width="224" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="992" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">BAR2 · wq2.0 专用门户</text>
  <text x="992" y="216" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">DWQ · +0x1000 (4 KiB)</text>

  <!-- dsa2 Engine + WQCFG.PASID -->
  <rect x="880" y="250" width="224" height="62" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="992" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">engine2.0 执行引擎</text>
  <text x="992" y="296" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#475569">WQCFG.PASID → 主机 VA</text>

  <!-- Arrow inside dsa2: Portal -> Engine -->
  <line x1="992" y1="232" x2="992" y2="246" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-accent)"/>

  <!-- Path (a) P2P Arrow: dmar0 -> dsa2 BAR2 -->
  <line x1="640" y1="201" x2="874" y2="201" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arr-accent)"/>
  <rect x="680" y="160" width="152" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="756" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">同 Socket P2P [推断]</text>

  <!-- Path (c) Arrow: Host Core -> dsa2 BAR2 -->
  <path d="M 824 281 L 844 281 L 844 216 L 874 216" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>

  <!-- Host Hugepage Memzone (bottom of Socket 1) -->
  <rect x="468" y="372" width="656" height="88" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.75"/>
  <text x="492" y="410" font-size="16" font-weight="700" fill="#0f172a">主机大页内存 (Memzone)</text>
  <text x="492" y="436" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748b">2 MiB 锁页 · VA = IOVA</text>

  <!-- Buffers inside Memzone -->
  <rect x="756" y="387" width="160" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="836" y="411" text-anchor="middle" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#334155">src → dst</text>
  <text x="836" y="433" text-anchor="middle" font-size="12" fill="#64748b">memmove 缓冲</text>

  <rect x="936" y="387" width="164" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.75"/>
  <text x="1018" y="411" text-anchor="middle" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#1e3a8a">comp (32 B)</text>
  <text x="1018" y="433" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">status = 0x01</text>

  <!-- Arrows between dmar0 / Host Core / dsa2 Engine and Memzone -->
  <line x1="562" y1="312" x2="562" y2="368" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>
  <line x1="756" y1="372" x2="756" y2="316" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>

  <!-- dsa2 Engine <-> src/dst & comp -->
  <line x1="916" y1="312" x2="856" y2="383" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="1018" y1="312" x2="1018" y2="383" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-accent)"/>
</svg>
