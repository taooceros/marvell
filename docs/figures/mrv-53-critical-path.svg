<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="DejaVu Sans, Noto Sans CJK SC, Droid Sans Fallback, sans-serif">
  <!-- MRV-53: how injecting +delta per message distinguishes a stage on the critical path (slope ~ 1),
       a stage hidden inside pipeline slack (slope ~ 0), and a rhythm-induced state jump. -->
  <rect width="960" height="360" fill="#ffffff"/>

  <!-- Column headers -->
  <g font-size="14" fill="#64748b" font-weight="bold">
    <text x="200" y="38">每条消息间隔（1 / 吞吐）</text>
    <text x="780" y="38" text-anchor="middle">斜率 Δ ÷ δ</text>
  </g>

  <!-- Row 1: Critical path (slope ~ 1) -->
  <text x="36" y="102" font-size="20" font-weight="bold" fill="#0f172a">在关键路径</text>
  <rect x="200" y="74" width="240" height="38" rx="5" fill="#94a3b8"/>
  <text x="320" y="99" font-size="15" fill="#ffffff" text-anchor="middle">原耗时</text>
  <rect x="444" y="74" width="120" height="38" rx="5" fill="#dc2626"/>
  <text x="504" y="99" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+δ</text>
  <line x1="444" y1="124" x2="564" y2="124" stroke="#dc2626" stroke-width="2.5"/>
  <text x="504" y="144" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">间隔 +δ</text>
  <text x="780" y="105" font-size="32" font-weight="bold" fill="#dc2626" text-anchor="middle">≈ 1</text>

  <line x1="36" y1="164" x2="924" y2="164" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Row 2: Hidden in slack (slope ~ 0) -->
  <text x="36" y="218" font-size="20" font-weight="bold" fill="#0f172a">被流水线盖住</text>
  <rect x="200" y="190" width="460" height="38" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="200" y="190" width="160" height="38" rx="5" fill="#94a3b8"/>
  <text x="280" y="215" font-size="15" fill="#ffffff" text-anchor="middle">原耗时</text>
  <rect x="364" y="190" width="120" height="38" rx="5" fill="#dc2626"/>
  <text x="424" y="215" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+δ</text>
  <text x="572" y="215" font-size="14" fill="#64748b" text-anchor="middle">空转余量</text>
  <text x="780" y="221" font-size="32" font-weight="bold" fill="#475569" text-anchor="middle">≈ 0</text>

  <line x1="36" y1="256" x2="924" y2="256" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Row 3: State jump -->
  <text x="36" y="312" font-size="20" font-weight="bold" fill="#0f172a">换状态</text>
  <rect x="200" y="284" width="460" height="38" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="605" y="309" font-size="14" fill="#94a3b8" text-anchor="middle">原慢间隔</text>
  <rect x="200" y="284" width="160" height="38" rx="5" fill="#94a3b8"/>
  <text x="280" y="309" font-size="15" fill="#ffffff" text-anchor="middle">原耗时</text>
  <rect x="364" y="284" width="76" height="38" rx="5" fill="#dc2626"/>
  <text x="402" y="309" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+δ</text>
  <line x1="540" y1="303" x2="452" y2="303" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="452,303 462,297 462,309" fill="#dc2626"/>
  <text x="780" y="315" font-size="30" font-weight="bold" fill="#dc2626" text-anchor="middle">跳变</text>
</svg>
