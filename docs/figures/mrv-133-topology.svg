<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1120" height="340" fill="#ffffff"/>

  <!-- Left box: mercury (Client) -->
  <rect x="28" y="36" width="230" height="268" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="143" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">mercury (客户端)</text>
  <text x="143" y="90" text-anchor="middle" font-size="12" fill="#64748b">Xeon 6438M · cpu0</text>

  <rect x="48" y="114" width="190" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="143" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">IBV_QPT_UD</text>
  <text x="143" y="164" text-anchor="middle" font-size="12" fill="#64748b">RoCEv2 硬件旁路 · 零 sudo</text>

  <rect x="48" y="204" width="190" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="143" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">ConnectX-5</text>
  <text x="143" y="253" text-anchor="middle" font-size="12" fill="#64748b">mlx5_2 · 100GbE</text>
  <text x="143" y="270" text-anchor="middle" font-size="11" fill="#94a3b8">10.10.100.1</text>

  <!-- Wire arrow: mercury <-> CN106 -->
  <line x1="258" y1="170" x2="352" y2="170" stroke="#64748b" stroke-width="3" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>
  <text x="305" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">100GbE DAC</text>
  <text x="305" y="194" text-anchor="middle" font-size="11.5" fill="#64748b">3m 无源铜缆</text>
  <text x="305" y="211" text-anchor="middle" font-size="11" fill="#94a3b8">0 CRC 错</text>

  <!-- Middle box: CN106 SmartNIC -->
  <rect x="356" y="36" width="318" height="268" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="515" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">CN106 SmartNIC</text>
  <text x="515" y="90" text-anchor="middle" font-size="12" fill="#64748b">1 卡核 core 3 @ 2.0 GHz</text>

  <!-- Fixed physical NIC pipeline -->
  <rect x="376" y="110" width="124" height="172" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="438" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">eth0 (固定)</text>
  <text x="438" y="159" text-anchor="middle" font-size="11.5" fill="#64748b">0002:02:00.0</text>
  <line x1="392" y1="172" x2="484" y2="172" stroke="#e2e8f0" stroke-width="1"/>
  <text x="438" y="195" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">RPM0 MAC/PCS</text>
  <text x="438" y="217" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">NIX0 + NPA</text>
  <text x="438" y="244" text-anchor="middle" font-size="11" fill="#64748b">硬件 CRC32 ICRC</text>
  <text x="438" y="264" text-anchor="middle" font-size="11" fill="#94a3b8">1 RxQ / 1 TxQ</text>

  <!-- Single variable switch inside CN106 -->
  <rect x="518" y="110" width="138" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="587" y="137" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">传统 SDP</text>
  <text x="587" y="157" text-anchor="middle" font-size="11.5" fill="#64748b">sdp1-1 · MTU 9000</text>
  <text x="587" y="175" text-anchor="middle" font-size="11" fill="#94a3b8">默认 / rpm+zc</text>

  <rect x="518" y="202" width="138" height="80" rx="8" fill="#eff6ff" stroke="#1f6feb" stroke-width="2.2"/>
  <text x="587" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6feb">DirectPush</text>
  <text x="587" y="248" text-anchor="middle" font-size="11.5" fill="#1e40af">≤256B: WC / BAR4</text>
  <text x="587" y="268" text-anchor="middle" font-size="11.5" fill="#1e40af">≥1KiB: 2×DPI VF</text>

  <!-- PCIe Gen5 x4 arrows: CN106 <-> saturn (SINGLE VARIABLE) -->
  <line x1="674" y1="148" x2="808" y2="148" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="6,4" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>
  <line x1="674" y1="242" x2="808" y2="242" stroke="#1f6feb" stroke-width="3.2" marker-start="url(#arr-b)" marker-end="url(#arr-b)"/>

  <rect x="692" y="168" width="98" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="741" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">唯一切换变量</text>
  <text x="741" y="205" text-anchor="middle" font-size="11" fill="#64748b">PCIe Gen5 ×4</text>

  <!-- Right box: saturn (Server) -->
  <rect x="812" y="36" width="280" height="268" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="952" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">saturn (服务端)</text>
  <text x="952" y="90" text-anchor="middle" font-size="12" fill="#64748b">1 核 cpu40 @ 3.9 GHz · Uncore 2.2 GHz</text>

  <rect x="832" y="110" width="240" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="952" y="137" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">VF0 / BAR4 + DDIO</text>
  <text x="952" y="158" text-anchor="middle" font-size="11.5" fill="#64748b">intel_iommu=on,sm_on · 零 DSA</text>
  <text x="952" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">MOVDIR64B + 100% PMU</text>

  <rect x="832" y="202" width="240" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="952" y="230" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">128 MiB 留存 TX 池</text>
  <text x="952" y="251" text-anchor="middle" font-size="11.5" fill="#64748b">Socket-1 2 MiB 大页 (N0=0)</text>
  <text x="952" y="270" text-anchor="middle" font-size="11" fill="#94a3b8">RPC 验真 + --app-work</text>
</svg>
