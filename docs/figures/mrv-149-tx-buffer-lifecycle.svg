<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', 'Droid Sans Fallback', sans-serif; }
    </style>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.8 5 L 0 8.8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.8 5 L 0 8.8 z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1120" height="480" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="290" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">主机发送缓冲</text>
  <text x="512" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">跨互连传递</text>
  <text x="731" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">网卡侧</text>
  <text x="960" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">发送缓冲结果</text>

  <!-- Row 1: Traditional Passive DMA NIC -->
  <rect x="28" y="52" width="1064" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="114" y="106" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">传统被动 DMA</text>
  <text x="114" y="130" text-anchor="middle" font-size="12" fill="#64748b">DPDK / 常规网卡</text>

  <rect x="200" y="73" width="180" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="107" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">主机 TX 缓冲池</text>
  <text x="290" y="131" text-anchor="middle" font-size="12" fill="#64748b">仅提交指针</text>

  <!-- Arrows Row 1 -->
  <line x1="388" y1="96" x2="630" y2="96" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <text x="512" y="87" text-anchor="middle" font-size="11.5" fill="#64748b">描述符指针</text>
  <line x1="634" y1="130" x2="392" y2="130" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>
  <text x="512" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">异步 DMA 回读</text>

  <rect x="642" y="73" width="178" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="731" y="107" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">被动网卡</text>
  <text x="731" y="131" text-anchor="middle" font-size="12" fill="#64748b">发完回 TX 通知</text>

  <rect x="846" y="73" width="228" height="80" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="960" y="110" text-anchor="middle" font-size="22" font-weight="700" fill="#475569">不能复用</text>
  <text x="960" y="135" text-anchor="middle" font-size="12" fill="#64748b">等 TX 完成再释放</text>

  <!-- Row 2: CC-NIC -->
  <rect x="28" y="192" width="1064" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="114" y="246" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">CC-NIC</text>
  <text x="114" y="270" text-anchor="middle" font-size="12" fill="#64748b">硬件缓存一致性</text>

  <rect x="200" y="213" width="180" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="247" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">主机共享池</text>
  <text x="290" y="271" text-anchor="middle" font-size="12" fill="#64748b">含上层留存缓冲</text>

  <!-- Arrows Row 2 -->
  <line x1="634" y1="236" x2="392" y2="236" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-grey)"/>
  <text x="512" y="227" text-anchor="middle" font-size="12" fill="#475569">一致性读 (S 态)</text>
  <line x1="388" y1="270" x2="630" y2="270" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>
  <text x="512" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">重用触发 RFO 作废</text>

  <rect x="642" y="213" width="178" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="731" y="247" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">主动网卡</text>
  <text x="731" y="271" text-anchor="middle" font-size="12" fill="#64748b">NIC 管池 · 留旧行</text>

  <rect x="846" y="213" width="228" height="80" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="960" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">-20%</text>
  <text x="960" y="275" text-anchor="middle" font-size="12" fill="#64748b">留存跨互连作废</text>

  <!-- Row 3: DirectPush over Lossless PCIe (ACCENT) -->
  <rect x="28" y="332" width="1064" height="126" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="114" y="388" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">本文直推</text>
  <text x="114" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">无损 PCIe</text>

  <rect x="200" y="353" width="180" height="84" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
  <text x="290" y="388" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">64 B 栈 / 留存池</text>
  <text x="290" y="413" text-anchor="middle" font-size="12" fill="#0f766e">纯主机本地</text>

  <!-- Arrow Row 3: Bold one-way push -->
  <line x1="388" y1="395" x2="628" y2="395" stroke="#0f766e" stroke-width="3.2" marker-end="url(#arr-teal)"/>
  <text x="512" y="381" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e">MOVDIR64B → PCIe</text>
  <text x="512" y="418" text-anchor="middle" font-size="12" fill="#115e59">按值直推 · 不丢包 · 永不回读</text>

  <rect x="642" y="353" width="178" height="84" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
  <text x="731" y="388" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">BAR4 独立副本</text>
  <text x="731" y="413" text-anchor="middle" font-size="12" fill="#0f766e">无目录 · 无 Snoop</text>

  <rect x="846" y="353" width="228" height="84" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.7"/>
  <text x="960" y="391" text-anchor="middle" font-size="24" font-weight="700" fill="#0f766e">立刻复用</text>
  <text x="960" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">0 回收等待 · 0 网卡税</text>
</svg>
