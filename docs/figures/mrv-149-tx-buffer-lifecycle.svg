<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 476" width="1120" height="476">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', 'Droid Sans Fallback', sans-serif; }
    </style>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.8 5 L 0 8.8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.8 5 L 0 8.8 z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1120" height="476" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="290" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">主机内存</text>
  <text x="513" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">发包时怎么传给网卡</text>
  <text x="735" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">网卡侧</text>
  <text x="965" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">发完后的主机缓冲</text>

  <!-- Row 1: Traditional DMA NIC -->
  <rect x="26" y="50" width="1068" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="110" y="105" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">传统 DMA</text>
  <text x="110" y="129" text-anchor="middle" font-size="12" fill="#64748b">普通 PCIe 网卡</text>

  <rect x="196" y="71" width="188" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="105" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">发送缓冲池</text>
  <text x="290" y="129" text-anchor="middle" font-size="12" fill="#64748b">只交出内存地址</text>

  <line x1="392" y1="94" x2="632" y2="94" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arr-grey)"/>
  <text x="513" y="84" text-anchor="middle" font-size="12" fill="#64748b">提交地址指针</text>
  <line x1="636" y1="128" x2="396" y2="128" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>
  <text x="513" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">网卡稍后回头读走</text>

  <rect x="644" y="71" width="182" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="735" y="105" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">被动网卡</text>
  <text x="735" y="129" text-anchor="middle" font-size="12" fill="#64748b">读完再回传通知</text>

  <rect x="848" y="71" width="234" height="80" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="965" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#475569">不能马上复用</text>
  <text x="965" y="133" text-anchor="middle" font-size="12" fill="#64748b">必须等网卡发完通知</text>

  <!-- Row 2: CC-NIC -->
  <rect x="26" y="188" width="1068" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="110" y="243" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">CC-NIC</text>
  <text x="110" y="267" text-anchor="middle" font-size="12" fill="#64748b">硬件缓存一致性</text>

  <rect x="196" y="209" width="188" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="243" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">共享缓冲池</text>
  <text x="290" y="267" text-anchor="middle" font-size="12" fill="#64748b">主机与网卡共享</text>

  <line x1="636" y1="232" x2="396" y2="232" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-grey)"/>
  <text x="513" y="222" text-anchor="middle" font-size="12" fill="#475569">网卡一致性读入</text>
  <line x1="392" y1="266" x2="632" y2="266" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>
  <text x="513" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">主机再改写时通知作废</text>

  <rect x="644" y="209" width="182" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="735" y="243" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">网卡缓存</text>
  <text x="735" y="267" text-anchor="middle" font-size="12" fill="#64748b">留有旧缓存副本</text>

  <rect x="848" y="209" width="234" height="80" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="965" y="246" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">跨链路作废</text>
  <text x="965" y="271" text-anchor="middle" font-size="12" fill="#64748b">留存池复用吞吐掉 20%</text>

  <!-- Row 3: Lossless PCIe DirectPush (Accent) -->
  <rect x="26" y="326" width="1068" height="130" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="110" y="384" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f766e">无损 PCIe 直推</text>
  <text x="110" y="408" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">本文方案</text>

  <rect x="196" y="347" width="188" height="88" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
  <text x="290" y="384" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">主机本地缓冲</text>
  <text x="290" y="409" text-anchor="middle" font-size="12" fill="#0f766e">单格复用 或 TCP 留存池</text>

  <line x1="392" y1="391" x2="630" y2="391" stroke="#0f766e" stroke-width="3.2" marker-end="url(#arr-teal)"/>
  <text x="513" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">直接推送数据 (MOVDIR64B)</text>
  <text x="513" y="414" text-anchor="middle" font-size="12" fill="#115e59">PCIe 不丢包 · 网卡永不回读</text>

  <rect x="644" y="347" width="182" height="88" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
  <text x="735" y="384" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">网卡独立副本</text>
  <text x="735" y="409" text-anchor="middle" font-size="12" fill="#0f766e">与主机内存彻底脱钩</text>

  <rect x="848" y="347" width="234" height="88" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.7"/>
  <text x="965" y="379" text-anchor="middle" font-size="21" font-weight="700" fill="#0f766e">立刻复用</text>
  <text x="965" y="403" text-anchor="middle" font-size="11.5" font-weight="700" fill="#115e59">无重传：推完直接覆写</text>
  <text x="965" y="422" text-anchor="middle" font-size="11.5" fill="#115e59">TCP 留存：零跨链路作废</text>
</svg>
