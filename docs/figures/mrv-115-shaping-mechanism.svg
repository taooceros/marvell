<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="960" height="416" fill="#ffffff"/>

  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">无整形反压 vs 主机在途信用整形机制（20 M/s 直通路径）</text>

  <!-- ==================== ROW 1: UNSHAPED ==================== -->
  <rect x="24" y="56" width="912" height="162" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="24" y="56" width="10" height="162" rx="4" fill="#dc2626"/>
  <text x="48" y="82" font-size="14" font-weight="700" fill="#991b1b">无整形（W_cap = 4032）</text>
  <text x="916" y="82" text-anchor="end" font-size="14" font-weight="700" fill="#dc2626">端到端 p99 = 46–688 µs · 线端 46–117 µs</text>

  <rect x="48" y="102" width="132" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="114" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">主机 cpu40</text>
  <text x="114" y="154" text-anchor="middle" font-size="12" fill="#475569">MOVDIR64B</text>

  <line x1="180" y1="139" x2="218" y2="139" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <rect x="224" y="102" width="150" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="299" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">主机 CHA / IRP1</text>
  <text x="299" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">48–155 条</text>
  <text x="299" y="168" text-anchor="middle" font-size="11" fill="#991b1b">PCIe 流控倒灌</text>

  <line x1="374" y1="139" x2="412" y2="139" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="418" y1="192" x2="374" y2="192" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="396" y="207" text-anchor="middle" font-size="11" fill="#dc2626">反压</text>

  <rect x="418" y="102" width="212" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  <text x="524" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">卡 PEM0 / IOBN 入向桥</text>
  <text x="524" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">76.4 ns/条 串行积压</text>
  <text x="524" y="168" text-anchor="middle" font-size="11" fill="#991b1b">在途飙升至 340–4032 条</text>

  <line x1="630" y1="139" x2="668" y2="139" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="674" y="102" width="108" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="728" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">卡 TAD</text>
  <text x="728" y="153" text-anchor="middle" font-size="12" fill="#475569">在途跌至 0.18</text>

  <line x1="782" y1="139" x2="814" y2="139" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="820" y="102" width="96" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="868" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">卡核 WC</text>
  <text x="868" y="153" text-anchor="middle" font-size="12" fill="#475569">紧追前沿</text>

  <!-- ==================== ROW 2: HOST CREDIT SHAPING ==================== -->
  <rect x="24" y="236" width="912" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="236" width="10" height="162" rx="4" fill="#1d4ed8"/>
  <text x="48" y="262" font-size="14" font-weight="700" fill="#1e3a8a">主机在途信用整形（W_credit = 24 / 32 / 64）</text>
  <text x="916" y="262" text-anchor="end" font-size="14" font-weight="700" fill="#1d4ed8">线端 p99 = 1.85–2.69 µs · 零 CHA 反压</text>

  <rect x="48" y="282" width="100" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="98" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">软件队列</text>
  <text x="98" y="333" text-anchor="middle" font-size="12" fill="#475569">吸收突发</text>

  <line x1="148" y1="319" x2="174" y2="319" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <rect x="180" y="282" width="116" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="238" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">信用闸门</text>
  <text x="238" y="333" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">W_credit</text>
  <text x="238" y="349" text-anchor="middle" font-size="11" fill="#1e3a8a">24 / 32 / 64</text>

  <line x1="296" y1="319" x2="326" y2="319" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <rect x="332" y="282" width="126" height="74" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="395" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">主机 CHA</text>
  <text x="395" y="333" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">2.04 条</text>
  <text x="395" y="349" text-anchor="middle" font-size="11" fill="#475569">102.5 ns 无拥塞</text>

  <line x1="458" y1="319" x2="488" y2="319" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <rect x="494" y="282" width="176" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="582" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">PEM0 / IOBN 桥</text>
  <text x="582" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">队列 ≤ W_credit</text>
  <text x="582" y="348" text-anchor="middle" font-size="11" fill="#1e3a8a">排空上界 = W × 76.4 ns</text>

  <line x1="670" y1="319" x2="700" y2="319" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="706" y="282" width="96" height="74" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="754" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">卡 TAD</text>
  <text x="754" y="333" text-anchor="middle" font-size="12" fill="#1d4ed8">0.96–1.6 条</text>

  <line x1="802" y1="319" x2="824" y2="319" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="830" y="282" width="86" height="74" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="873" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">卡核 WC</text>
  <text x="873" y="333" text-anchor="middle" font-size="12" fill="#475569">回复返信用</text>

  <path d="M 873 356 L 873 382 L 238 382 L 238 360" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <text x="556" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">双边约束：R · RTT_fast ≈ 25  ≤  W_credit  ≤  2.0 µs / 76.4 ns ≈ 26</text>
</svg>
