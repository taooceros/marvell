<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="960" height="448" fill="#ffffff"/>

  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">主机在途信用整形机制与双边约束（WC1 20 M/s 等距）</text>

  <!-- ==================== ROW 1: UNSHAPED (Neutral Greys) ==================== -->
  <rect x="24" y="50" width="912" height="136" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="50" width="8" height="136" rx="4" fill="#475569"/>
  <text x="46" y="74" font-size="13.5" font-weight="700" fill="#334155">无整形（W_cap = 4032）</text>
  <text x="916" y="74" text-anchor="end" font-size="13.5" font-weight="700" fill="#334155">tot p99 = 46.3 µs · wire 46.0 µs</text>

  <rect x="46" y="92" width="128" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">cpu40</text>
  <text x="110" y="141" text-anchor="middle" font-size="12" fill="#64748b">MOVDIR64B</text>

  <line x1="174" y1="125" x2="212" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>

  <rect x="218" y="92" width="154" height="66" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="295" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">主机 CHA</text>
  <text x="295" y="143" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">48.5 条</text>

  <line x1="372" y1="118" x2="416" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="416" y1="138" x2="376" y2="138" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-dark)"/>
  <text x="394" y="156" text-anchor="middle" font-size="11" fill="#475569">反压</text>

  <rect x="422" y="92" width="206" height="66" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="525" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">PEM0 / IOBN 桥</text>
  <text x="525" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">340–4032 条</text>

  <line x1="628" y1="125" x2="664" y2="125" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <rect x="670" y="92" width="112" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="726" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">卡 TAD</text>
  <text x="726" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">0.65 条</text>

  <line x1="782" y1="125" x2="814" y2="125" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <rect x="820" y="92" width="96" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="868" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">卡核 WC</text>
  <text x="868" y="141" text-anchor="middle" font-size="12" fill="#64748b">回写 DDIO</text>

  <!-- ==================== ROW 2: HOST CREDIT SHAPING (Single Accent Blue) ==================== -->
  <rect x="24" y="200" width="912" height="154" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="200" width="8" height="154" rx="4" fill="#1d4ed8"/>
  <text x="46" y="224" font-size="13.5" font-weight="700" fill="#1e3a8a">主机信用整形（W_credit = 32）</text>
  <text x="916" y="224" text-anchor="end" font-size="13.5" font-weight="700" fill="#1d4ed8">tot p99 = 7.91 µs · wire 2.69 µs</text>

  <rect x="46" y="242" width="124" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="108" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">主机排队</text>
  <text x="108" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">q99 6.38 µs</text>

  <line x1="170" y1="275" x2="196" y2="275" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="202" y="242" width="122" height="66" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="263" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">信用闸门</text>
  <text x="263" y="293" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">W = 32</text>

  <line x1="324" y1="275" x2="352" y2="275" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="358" y="242" width="126" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="421" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">主机 CHA</text>
  <text x="421" y="293" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">2.04 条</text>

  <line x1="484" y1="275" x2="512" y2="275" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <rect x="518" y="242" width="154" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="595" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">PEM0 / IOBN</text>
  <text x="595" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">≤ 32 条</text>

  <line x1="672" y1="275" x2="698" y2="275" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <rect x="704" y="242" width="102" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="755" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">卡 TAD</text>
  <text x="755" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">0.96 条</text>

  <line x1="806" y1="275" x2="826" y2="275" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <rect x="832" y="242" width="84" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="874" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">卡核 WC</text>
  <text x="874" y="290" text-anchor="middle" font-size="12" fill="#64748b">返信用</text>

  <!-- Credit return path -->
  <path d="M 874 308 L 874 334 L 263 334 L 263 312" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <text x="568" y="328" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">退 1 补 1 信用返回（零 CHA 反压）</text>

  <!-- ==================== ROW 3: INFEASIBLE GAP NUMBER LINE ==================== -->
  <rect x="24" y="368" width="912" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="405" font-size="13" font-weight="700" fill="#0f172a">20 M/s 约束缺口</text>

  <!-- Axis from W=0 (x=185) to W=64 (x=905): scale = 11.25 px per unit -->
  <!-- W=0..18.5: x=185..393 | Gap 18.5..25: x=393..466 | W=25..64: x=466..905 -->
  <rect x="185" y="388" width="208" height="24" rx="4" fill="#e2e8f0"/>
  <rect x="393" y="388" width="73" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <rect x="466" y="388" width="439" height="24" rx="4" fill="#e2e8f0"/>

  <text x="289" y="404" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">W ≤ 18（满窗慢态 ≤ 2 µs）</text>
  <text x="429.5" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">[18, 25]</text>
  <text x="685" y="404" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">W ≥ 25（20 M/s 利特尔下限）</text>

  <!-- Tick marks -->
  <text x="393" y="383" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">18.5</text>
  <text x="466" y="383" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">25</text>
  <text x="545" y="383" text-anchor="middle" font-size="10.5" fill="#64748b">32</text>
  <text x="725" y="383" text-anchor="middle" font-size="10.5" fill="#64748b">48</text>
  <text x="905" y="383" text-anchor="middle" font-size="10.5" fill="#64748b">64</text>
</svg>
