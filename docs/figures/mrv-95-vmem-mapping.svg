<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="568" fill="#ffffff"/>

  <!-- ==================== LANE 1: Portal Write Mapping ==================== -->
  <rect x="24" y="20" width="1152" height="196" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Lane 1 header badge -->
  <rect x="44" y="36" width="76" height="28" rx="6" fill="#2563eb"/>
  <text x="82" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">映射 1</text>
  <text x="132" y="55" font-size="16" font-weight="700" fill="#0f172a">写门户（无主机转发）</text>
  <text x="1152" y="55" text-anchor="end" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748b">CN106 → PCIe Gen5 x4 → Socket 1</text>

  <!-- Vertical PCIe boundary inside Lane 1 (clean gap around text) -->
  <text x="478" y="88" text-anchor="middle" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#94a3b8">PCIe</text>
  <line x1="478" y1="94" x2="478" y2="104" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="478" y1="172" x2="478" y2="204" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- L1 Box 1: Card Core -->
  <rect x="44" y="84" width="166" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="127" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">CN106 卡核</text>
  <text x="127" y="140" text-anchor="middle" font-size="13" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2563eb">card_va (WC)</text>
  <text x="127" y="162" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#475569">/dev/pem_wc</text>
  <text x="127" y="182" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">STP × 4</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="140" x2="246" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-accent)"/>

  <!-- L1 Box 2: PEM0 Outbound -->
  <rect x="252" y="84" width="176" height="112" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PEM0 出向窗 [255]</text>
  <text x="340" y="140" text-anchor="middle" font-size="13" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2563eb">→ portal_iova</text>
  <text x="340" y="162" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#475569">2 GiB · VF0</text>
  <text x="340" y="182" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">99:02.0</text>

  <!-- Arrow 2->3 across PCIe with big 64 B callout -->
  <line x1="428" y1="140" x2="526" y2="140" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arr-accent)"/>
  <text x="478" y="128" text-anchor="middle" font-size="22" font-weight="800" font-family="'JetBrains Mono', monospace" fill="#2563eb">64 B</text>
  <text x="478" y="162" text-anchor="middle" font-size="12" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#1e3a8a">Posted MWr</text>

  <!-- L1 Box 3: Host VF0 IOMMU (dmar0) -->
  <rect x="532" y="84" width="270" height="112" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="667" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">VF0 IOMMU (dmar0)</text>
  <text x="667" y="136" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#475569">VFIO_IOMMU_MAP_DMA</text>
  <rect x="548" y="148" width="238" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="667" y="171" text-anchor="middle" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#1e3a8a">portal_iova → BAR2 +0x1000</text>

  <!-- Arrow 3->4 with P2P [推断] -->
  <line x1="802" y1="140" x2="900" y2="140" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arr-accent)"/>
  <rect x="808" y="99" width="84" height="24" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="850" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">P2P [推断]</text>

  <!-- L1 Box 4: dsa2 Portal -->
  <rect x="906" y="84" width="246" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="1029" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">dsa2 门户 (wq2.0)</text>
  <text x="1029" y="140" text-anchor="middle" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#2563eb">HPA 0x237ffff21000</text>
  <text x="1029" y="162" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#475569">f2:01.0 · DWQ · 4 KiB</text>
  <text x="1029" y="182" text-anchor="middle" font-size="12" fill="#64748b">零主机 CPU 转发</text>

  <!-- ==================== LANE 2: DSA vmem Translation ==================== -->
  <rect x="24" y="236" width="1152" height="216" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Lane 2 header badge -->
  <rect x="44" y="252" width="76" height="28" rx="6" fill="#334155"/>
  <text x="82" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">映射 2</text>
  <text x="132" y="271" font-size="16" font-weight="700" fill="#0f172a">译 vmem（方案 A · SVA / PASID）</text>
  <text x="1152" y="271" text-anchor="end" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748b">dsa2 · dmar6 (group 18) → 主机内存</text>

  <!-- L2 Box 1: 64 B Descriptor Payload -->
  <rect x="44" y="298" width="212" height="134" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.75"/>
  <text x="150" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">64 B MEMMOVE 描述符</text>
  <text x="64" y="350" font-size="12" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#334155">src_addr  = src_va</text>
  <text x="64" y="370" font-size="12" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#334155">dst_addr  = dst_va</text>
  <text x="64" y="390" font-size="12" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#334155">comp_addr = comp_va</text>
  <text x="64" y="414" font-size="12" font-family="'JetBrains Mono', monospace" fill="#94a3b8">PASID 字段：DWQ 忽略</text>

  <!-- Arrow L2 1->2 -->
  <line x1="256" y1="335" x2="294" y2="335" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-slate)"/>

  <!-- L2 Box 2: dsa2 Engine + WQCFG.PASID -->
  <rect x="300" y="298" width="224" height="74" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="412" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">dsa2 引擎 (engine2.0)</text>
  <rect x="320" y="336" width="184" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="412" y="354" text-anchor="middle" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#1e3a8a">自动附带 WQCFG.PASID</text>

  <!-- One-time Host Init Process pill below dsa2 Engine -->
  <rect x="300" y="386" width="224" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="412" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">初始化进程（休眠 · 零转发）</text>
  <text x="412" y="423" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748b">open(/dev/dsa/wq2.0) 绑 PASID</text>
  <line x1="412" y1="386" x2="412" y2="376" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-muted)"/>

  <!-- Arrow L2 2->3 -->
  <line x1="524" y1="335" x2="564" y2="335" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-slate)"/>

  <!-- L2 Box 3: dmar6 SVA Translation -->
  <rect x="570" y="298" width="218" height="134" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="679" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DSA IOMMU (dmar6)</text>
  <text x="679" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">按 PASID 查进程页表</text>
  <text x="679" y="378" text-anchor="middle" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#2563eb">VA → 主机 HPA</text>
  <text x="679" y="408" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">sm_on · sva=Y</text>

  <!-- Arrow L2 3->4 -->
  <line x1="788" y1="365" x2="828" y2="365" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-slate)"/>

  <!-- L2 Box 4: Host Hugepage Memzone -->
  <rect x="834" y="298" width="318" height="134" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="993" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">主机锁页大页 Memzone</text>
  <text x="993" y="344" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">2 MiB 预触不缺页 · VA = IOVA</text>

  <!-- src -> dst inside Memzone -->
  <rect x="852" y="356" width="142" height="62" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="923" y="381" text-anchor="middle" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#0f172a">src_va → dst_va</text>
  <text x="923" y="403" text-anchor="middle" font-size="12" fill="#475569">DSA 搬运数据</text>

  <!-- comp inside Memzone -->
  <rect x="1006" y="356" width="130" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.75"/>
  <text x="1071" y="381" text-anchor="middle" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#1e3a8a">comp_va (32 B)</text>
  <text x="1071" y="403" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">status = 0x01</text>

  <!-- ==================== BOTTOM STRIP: Option A vs Option B ==================== -->
  <!-- Option A (Recommended) -->
  <rect x="24" y="470" width="564" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="42" y="486" width="96" height="24" rx="5" fill="#2563eb"/>
  <text x="90" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">方案 A · 首测</text>
  <text x="150" y="503" font-size="15" font-weight="700" fill="#1e3a8a">SVA / WQCFG.PASID（复用 idxd）</text>
  <text x="42" y="531" font-size="13" fill="#334155">open(/dev/dsa/wq2.0) 绑页表 · 免写 BAR0 · 零转发</text>

  <!-- Option B (Alternative) -->
  <rect x="612" y="470" width="564" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="630" y="486" width="96" height="24" rx="5" fill="#64748b"/>
  <text x="678" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">方案 B · 对比</text>
  <text x="738" y="503" font-size="15" font-weight="700" fill="#334155">无 PASID / IOVA（改绑 vfio-pci）</text>
  <text x="630" y="531" font-size="13" fill="#64748b">dmar6 查 IOVA · 需重写 BAR0 驱动 · 首测不选</text>
</svg>
