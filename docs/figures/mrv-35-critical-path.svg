<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>

  <!-- W = 1: one message, everything in series -->
  <text x="40" y="78" font-size="22" fill="#111827">W = 1</text>
  <g fill="#dc2626">
    <rect x="160" y="56" width="18" height="30"/>
    <rect x="181" y="56" width="240" height="30"/>
    <rect x="424" y="56" width="22" height="30"/>
    <rect x="449" y="56" width="236" height="30"/>
    <rect x="688" y="56" width="12" height="30"/>
  </g>
  <g font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="169" y="106">主机</text>
    <text x="301" y="106">去程</text>
    <text x="435" y="106">卡</text>
    <text x="567" y="106">回程</text>
    <text x="694" y="106">主机</text>
  </g>
  <text x="740" y="82" font-size="30" font-weight="bold" fill="#dc2626">0.90 µs</text>

  <line x1="40" y1="150" x2="960" y2="150" stroke="#e5e7eb"/>

  <!-- W = 64: round trips overlap, one stage sets the pace -->
  <text x="40" y="206" font-size="22" fill="#111827">W = 64</text>
  <g fill="#d1d5db">
    <rect x="160" y="180" width="540" height="12" rx="3"/>
    <rect x="205" y="198" width="540" height="12" rx="3"/>
    <rect x="250" y="216" width="540" height="12" rx="3"/>
    <rect x="295" y="234" width="540" height="12" rx="3"/>
    <rect x="340" y="252" width="540" height="12" rx="3"/>
  </g>
  <text x="900" y="226" font-size="15" fill="#6b7280">往返</text>

  <g fill="#dc2626">
    <rect x="160" y="290" width="43" height="30"/>
    <rect x="205" y="290" width="43" height="30"/>
    <rect x="250" y="290" width="43" height="30"/>
    <rect x="295" y="290" width="43" height="30"/>
    <rect x="340" y="290" width="43" height="30"/>
    <rect x="385" y="290" width="43" height="30"/>
    <rect x="430" y="290" width="43" height="30"/>
    <rect x="475" y="290" width="43" height="30"/>
    <rect x="520" y="290" width="43" height="30"/>
    <rect x="565" y="290" width="43" height="30"/>
    <rect x="610" y="290" width="43" height="30"/>
    <rect x="655" y="290" width="43" height="30"/>
    <rect x="700" y="290" width="43" height="30"/>
    <rect x="745" y="290" width="43" height="30"/>
    <rect x="790" y="290" width="43" height="30"/>
    <rect x="835" y="290" width="43" height="30"/>
  </g>
  <text x="900" y="312" font-size="15" fill="#dc2626">瓶颈</text>
  <text x="160" y="370" font-size="30" font-weight="bold" fill="#dc2626">75 ns</text>
  <text x="275" y="370" font-size="18" fill="#6b7280">/ 条</text>
</svg>
