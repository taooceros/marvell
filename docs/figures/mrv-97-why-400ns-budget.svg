<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" font-family="DejaVu Sans, Noto Sans CJK SC, Droid Sans Fallback, sans-serif">
  <rect width="960" height="392" fill="#ffffff"/>

  <!-- Header -->
  <text x="24" y="34" font-size="15.5" font-weight="700" fill="#0f172a">3 个同机实测 RTT 锚点：为什么单程是 ~429 ns 而非 200 ns</text>
  <text x="936" y="34" font-size="11.5" fill="#64748b" text-anchor="end">saturn · Xeon 6438M ⇄ CN106 · PCIe Gen5 ×4 (0 Switch)</text>

  <!-- Chart area: x=220 (0 ns) to x=820 (1000 ns) => 0.60 px/ns -->
  <!-- Gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="220" y1="54" x2="220" y2="306"/>
    <line x1="340" y1="54" x2="340" y2="306" stroke-dasharray="4,4"/>
    <line x1="460" y1="54" x2="460" y2="306" stroke-dasharray="4,4"/>
    <line x1="580" y1="54" x2="580" y2="306" stroke-dasharray="4,4"/>
    <line x1="700" y1="54" x2="700" y2="306" stroke-dasharray="4,4"/>
    <line x1="820" y1="54" x2="820" y2="306" stroke-dasharray="4,4"/>
  </g>

  <!-- X-axis ticks -->
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="220" y="324">0 ns</text>
    <text x="340" y="324">200</text>
    <text x="460" y="324">400</text>
    <text x="580" y="324">600</text>
    <text x="700" y="324">800</text>
    <text x="820" y="324">1000 ns</text>
  </g>

  <!-- Reference dashed marker for "理论 200 ns 单程 = 400 ns RTT" -->
  <line x1="460" y1="54" x2="460" y2="306" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>

  <!-- ==================== ROW 1: On-die DSA2 (402.7 ns) ==================== -->
  <text x="206" y="92" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="end">① 片内 DSA2 (NOP)</text>
  <text x="206" y="110" font-size="11" fill="#64748b" text-anchor="end">0 条 PCIe · 纯 Xeon 片内</text>

  <!-- 402.7 * 0.60 = 241.6 px -> x=220..461.6 -->
  <rect x="220" y="72" width="241.6" height="48" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.3"/>
  <text x="341" y="94" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Xeon 片内往返</text>
  <text x="341" y="111" font-size="10.5" fill="#475569" text-anchor="middle">核 ↔ Mesh/CHA ↔ IIO ↔ LLC</text>

  <text x="476" y="95" font-size="20" font-weight="700" fill="#334155">403 ns</text>
  <text x="476" y="113" font-size="11" fill="#64748b">实测 RTT（单程 ~201 ns）</text>

  <!-- ==================== ROW 2: BAR4 UC Read (645.5 ns) ==================== -->
  <text x="206" y="176" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="end">② BAR4 硬件读</text>
  <text x="206" y="194" font-size="11" fill="#64748b" text-anchor="end">跨 Gen5 ×4 · 不经卡核</text>

  <!-- 0..402.7 = 241.6 px -->
  <rect x="220" y="156" width="241.6" height="48" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="341" y="184" font-size="11.5" fill="#475569" text-anchor="middle">Xeon 片内基底 (~403 ns)</text>

  <!-- 402.7..645.5 = 242.8 ns * 0.60 = 145.7 px -> x=461.6..607.3 -->
  <rect x="461.6" y="156" width="145.7" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="534.5" y="178" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">+243 ns</text>
  <text x="534.5" y="195" font-size="10.2" fill="#dbeafe" text-anchor="middle">Gen5×4 + PEM0 [推断]</text>

  <text x="622" y="179" font-size="20" font-weight="700" fill="#1d4ed8">646 ns</text>
  <text x="622" y="197" font-size="11" fill="#64748b">实测 RTT（单程 ~323 ns）</text>

  <!-- ==================== ROW 3: Host <-> Card W=1 (897.3 ns) ==================== -->
  <text x="206" y="260" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">③ 主机⇄卡核 W=1</text>
  <text x="206" y="278" font-size="11" fill="#64748b" text-anchor="end">MOVDIR64B + 1 卡核 WC</text>

  <!-- 0..402.7 = 241.6 px -->
  <rect x="220" y="240" width="241.6" height="48" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="341" y="268" font-size="11.5" fill="#475569" text-anchor="middle">Xeon 片内</text>

  <!-- 402.7..645.5 = 145.7 px -->
  <rect x="461.6" y="240" width="145.7" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="534.5" y="268" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe Gen5 + PEM0</text>

  <!-- 645.5..857.3 = 211.8 ns * 0.60 = 127.1 px -> x=607.3..734.4 -->
  <rect x="607.3" y="240" width="127.1" height="48" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.2"/>
  <text x="670.8" y="261" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">+212 ns</text>
  <text x="670.8" y="278" font-size="10" fill="#1e3a8a" text-anchor="middle">核/缓存/IOMMU [推断]</text>
  <text x="746.4" y="233" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">卡核 40 ns</text>
  <!-- 857.3..897.3 = 40.0 ns * 0.60 = 24.0 px -> x=734.4..758.4 -->
  <rect x="734.4" y="240" width="24.0" height="48" rx="3" fill="#475569" stroke="#334155" stroke-width="1.1"/>

  <text x="774" y="263" font-size="21" font-weight="700" fill="#0f172a">897 ns</text>
  <text x="774" y="281" font-size="11" fill="#64748b">实测 RTT（单程 ~429 ns）</text>

  <!-- Bottom one-way budget pill -->
  <rect x="24" y="342" width="912" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="480" y="365" font-size="12.5" fill="#1e293b" text-anchor="middle">
    <tspan font-weight="700">单程 ~429 ns 拆解：</tspan>
    <tspan fill="#475569">Xeon 片内 ~200 ns</tspan>
    <tspan fill="#94a3b8">  +  </tspan>
    <tspan fill="#1d4ed8" font-weight="700">PCIe Gen5 ×4 链路 ~115 ns [推断]</tspan>
    <tspan fill="#94a3b8">  +  </tspan>
    <tspan fill="#334155">卡端核与缓存交接 ~115 ns [推断]</tspan>
  </text>
</svg>
