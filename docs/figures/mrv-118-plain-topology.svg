<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="340" fill="#ffffff"/>

  <!-- Left zone: Single variable switched -->
  <text x="275" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">只切换这一段：主机 ⇄ 网卡接口</text>
  <rect x="18" y="42" width="514" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="6,4"/>

  <!-- Host box -->
  <rect x="34" y="66" width="112" height="232" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="90" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">主机 CPU</text>
  <text x="90" y="185" text-anchor="middle" font-size="12" fill="#475569">1 核 · 3.9 GHz</text>
  <text x="90" y="206" text-anchor="middle" font-size="11.5" fill="#64748b">零 Intel DSA</text>

  <!-- Traditional SDP -->
  <rect x="182" y="68" width="194" height="84" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="279" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">传统接口 SDP</text>
  <text x="279" y="128" text-anchor="middle" font-size="11.5" fill="#64748b">描述符环 · 门铃 · 全 DMA</text>

  <!-- vs badge -->
  <rect x="261" y="168" width="36" height="22" rx="11" fill="#e2e8f0"/>
  <text x="279" y="183" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">vs</text>

  <!-- DirectPush (accent) -->
  <rect x="182" y="206" width="194" height="90" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.1"/>
  <text x="279" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">新接口 DirectPush</text>
  <text x="279" y="260" text-anchor="middle" font-size="11.5" fill="#115e59">小包（≤256 B）直推缓存</text>
  <text x="279" y="280" text-anchor="middle" font-size="11.5" fill="#115e59">大包（≥1 KiB）自带 DMA</text>

  <!-- Card core box -->
  <rect x="412" y="66" width="104" height="232" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="464" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">网卡核</text>
  <text x="464" y="189" text-anchor="middle" font-size="12" fill="#475569">1 核 · 2.0 GHz</text>
  <text x="464" y="210" text-anchor="middle" font-size="11.5" fill="#64748b">双向转发</text>

  <!-- Arrows left zone: Host <-> SDP <-> Card -->
  <line x1="146" y1="98" x2="178" y2="98" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <line x1="182" y1="122" x2="150" y2="122" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <line x1="376" y1="98" x2="408" y2="98" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <line x1="412" y1="122" x2="380" y2="122" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <!-- Arrows left zone: Host <-> DirectPush <-> Card -->
  <line x1="146" y1="238" x2="178" y2="238" stroke="#0f766e" stroke-width="2.1" marker-end="url(#arr-teal)"/>
  <line x1="182" y1="264" x2="150" y2="264" stroke="#0f766e" stroke-width="2.1" marker-end="url(#arr-teal)"/>
  <line x1="376" y1="238" x2="408" y2="238" stroke="#0f766e" stroke-width="2.1" marker-end="url(#arr-teal)"/>
  <line x1="412" y1="264" x2="380" y2="264" stroke="#0f766e" stroke-width="2.1" marker-end="url(#arr-teal)"/>

  <!-- Right zone: Fixed NIC hardware loopback -->
  <text x="760" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">完全固定：CN106 真实网卡硬件回环</text>
  <rect x="556" y="42" width="406" height="280" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- NIX TX -->
  <rect x="588" y="68" width="186" height="58" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="681" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">硬件发包引擎（NIX TX）</text>
  <text x="681" y="114" text-anchor="middle" font-size="11.5" fill="#64748b">真实以太网帧发送队列</text>

  <!-- LBK Loopback -->
  <rect x="606" y="154" width="150" height="58" rx="9" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
  <text x="681" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">片上硬件回环</text>
  <text x="681" y="200" text-anchor="middle" font-size="11.5" fill="#334155">LBK · 免插网线</text>

  <!-- NIX RX -->
  <rect x="588" y="240" width="186" height="58" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="681" y="266" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">硬件收包引擎（NIX RX）</text>
  <text x="681" y="286" text-anchor="middle" font-size="11.5" fill="#64748b">真实以太网帧接收队列</text>

  <!-- Bypassed physical cable / RPM -->
  <rect x="814" y="144" width="128" height="78" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="878" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">物理网口 / 网线</text>
  <text x="878" y="192" text-anchor="middle" font-size="11" fill="#94a3b8">本次未经过</text>
  <text x="878" y="209" text-anchor="middle" font-size="10.5" fill="#94a3b8">（100GbE 已补测）</text>

  <!-- Dashed bypass link -->
  <line x1="756" y1="183" x2="812" y2="183" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="784" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">×</text>

  <!-- Flow arrows between Card Core and NIX -->
  <line x1="516" y1="97" x2="584" y2="97" stroke="#334155" stroke-width="1.9" marker-end="url(#arr-dark)"/>
  <text x="550" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">发包</text>
  <line x1="588" y1="269" x2="520" y2="269" stroke="#334155" stroke-width="1.9" marker-end="url(#arr-dark)"/>
  <text x="550" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">收包</text>

  <!-- Internal loopback arrows -->
  <line x1="681" y1="126" x2="681" y2="150" stroke="#334155" stroke-width="1.9" marker-end="url(#arr-dark)"/>
  <line x1="681" y1="212" x2="681" y2="236" stroke="#334155" stroke-width="1.9" marker-end="url(#arr-dark)"/>

  <!-- Fixed cost note -->
  <text x="878" y="274" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">固定增量 ~3–4 µs</text>
  <text x="878" y="292" text-anchor="middle" font-size="11" fill="#64748b">两种接口完全相同</text>
</svg>
