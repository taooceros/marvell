<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" width="1120" height="310" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D93829"/>
    </marker>
    <pattern id="write-band-hatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#FAD1CC" stroke-width="5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1120" height="310" fill="#FFFFFF"/>

  <text x="36" y="40" font-size="20" font-weight="700" fill="#0F172A">变量 3 空间位置图：队头 next 是「已落盘区」与「~3 µs 在途写带」的分界线</text>
  <line x1="36" y1="56" x2="1084" y2="56" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left Banner: Behind `next` -->
  <rect x="36" y="74" width="584" height="32" rx="6" fill="#EFF6FF"/>
  <text x="328" y="95" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">队头 next 后方：PCIe 写入已 100% 完成，读哪里都保持 160–162 M/s</text>

  <!-- Right Banner: Ahead of `next` -->
  <rect x="652" y="74" width="432" height="32" rx="6" fill="#FEF2F2"/>
  <text x="868" y="95" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">队头 next 前方：主机 ~440 格正在乱序落盘 [推断]</text>

  <!-- Box 1: far-ring -->
  <rect x="36" y="120" width="190" height="126" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
  <text x="131" y="148" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">③ far-ring</text>
  <text x="131" y="170" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">next - 32768 .. -16384</text>
  <text x="131" y="194" font-size="12" fill="#64748B" text-anchor="middle">半圈前（~200 µs 前落盘）</text>
  <text x="131" y="226" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">162.0 M/s</text>

  <!-- Box 2: near-ring -->
  <rect x="242" y="120" width="190" height="126" rx="8" fill="#F8FAFC" stroke="#4F46E5" stroke-width="2"/>
  <text x="337" y="148" font-size="15" font-weight="700" fill="#312E81" text-anchor="middle">④a near-ring</text>
  <text x="337" y="170" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">next - 384 .. next - 64</text>
  <text x="337" y="194" font-size="12" fill="#64748B" text-anchor="middle">刚消费完（已过 next 校验）</text>
  <text x="337" y="226" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">160.2 M/s</text>

  <!-- Box 3: next-1 -->
  <rect x="448" y="120" width="172" height="126" rx="8" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/>
  <text x="534" y="148" font-size="15" font-weight="700" fill="#312E81" text-anchor="middle">④b next - 1</text>
  <text x="534" y="170" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">队头前一格（邻核奇偶格）</text>
  <text x="534" y="194" font-size="12" fill="#64748B" text-anchor="middle">99.9% 驻留 L1D [推断]</text>
  <text x="534" y="226" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">159.8 M/s</text>

  <!-- Divider: `next` -->
  <line x1="636" y1="74" x2="636" y2="262" stroke="#D93829" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="594" y="264" width="84" height="28" rx="6" fill="#D93829"/>
  <text x="636" y="283" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">队头 next</text>

  <!-- Box 4: write-band -->
  <rect x="652" y="120" width="276" height="126" rx="8" fill="url(#write-band-hatch)" stroke="#D93829" stroke-width="2.5"/>
  <rect x="658" y="126" width="264" height="114" rx="5" fill="#FFF5F5" fill-opacity="0.92"/>
  <text x="790" y="148" font-size="15" font-weight="700" fill="#991B1B" text-anchor="middle">④c write-band（在途写带）</text>
  <text x="790" y="170" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">next .. next + 384（尚未落齐）</text>
  <text x="790" y="194" font-size="12" font-weight="700" fill="#D93829" text-anchor="middle">⚡ 同行嗅探 / 入站写队头阻塞 [推断]</text>
  <text x="790" y="226" font-size="20" font-weight="700" fill="#D93829" text-anchor="middle">113.4 M/s</text>

  <!-- Box 5: Host CHA / PEM0 -->
  <rect x="954" y="120" width="130" height="126" rx="8" fill="#FFF5F5" stroke="#D93829" stroke-width="2"/>
  <text x="1019" y="152" font-size="15" font-weight="700" fill="#991B1B" text-anchor="middle">主机 32 CHA</text>
  <text x="1019" y="178" font-size="13" font-weight="700" fill="#D93829" text-anchor="middle">~440 格在途</text>
  <text x="1019" y="202" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">PEM0 乱序写入</text>
  <line x1="954" y1="183" x2="934" y2="183" stroke="#D93829" stroke-width="3" marker-end="url(#arrow-red)"/>
</svg>
