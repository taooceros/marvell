<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 100 940 300" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>
  <rect y="100" width="940" height="300" fill="#ffffff"/>

  <!-- sides -->
  <text x="130" y="150" text-anchor="middle" font-size="22" fill="#5f6368">主机</text>
  <text x="580" y="150" text-anchor="middle" font-size="22" fill="#5f6368">卡</text>
  <line x1="265" y1="166" x2="265" y2="362" stroke="#bdc1c6" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="265" y="388" text-anchor="middle" font-size="15" fill="#9aa0a6">PCIe</text>

  <!-- main SDP path (accent) -->
  <rect x="40" y="180" width="180" height="66" rx="10" fill="#fff4ed" stroke="#d9480f" stroke-width="2.5"/>
  <text x="130" y="210" text-anchor="middle" font-size="20" fill="#202124">DPDK</text>
  <text x="130" y="234" text-anchor="middle" font-size="14" fill="#5f6368">VF0</text>

  <rect x="320" y="189" width="110" height="48" rx="8" fill="#ffffff" stroke="#5f6368" stroke-width="2"/>
  <text x="375" y="219" text-anchor="middle" font-size="20" fill="#202124">SDP</text>

  <rect x="500" y="189" width="110" height="48" rx="8" fill="#ffffff" stroke="#5f6368" stroke-width="2"/>
  <text x="555" y="219" text-anchor="middle" font-size="20" fill="#202124">NIX</text>

  <rect x="690" y="180" width="200" height="66" rx="10" fill="#fff4ed" stroke="#d9480f" stroke-width="2.5"/>
  <text x="790" y="210" text-anchor="middle" font-size="20" fill="#202124">卡上 DPDK</text>
  <text x="790" y="234" text-anchor="middle" font-size="14" fill="#5f6368">sdp1-1</text>

  <line x1="226" y1="213" x2="314" y2="213" stroke="#d9480f" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="436" y1="213" x2="494" y2="213" stroke="#d9480f" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="616" y1="213" x2="684" y2="213" stroke="#d9480f" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- card Ethernet ports, off to the side -->
  <rect x="690" y="300" width="200" height="48" rx="8" fill="#ffffff" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="790" y="330" text-anchor="middle" font-size="18" fill="#9aa0a6">以太网口</text>
  <line x1="790" y1="250" x2="790" y2="296" stroke="#bdc1c6" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="802" y="279" font-size="14" fill="#9aa0a6">转发</text>
</svg>
