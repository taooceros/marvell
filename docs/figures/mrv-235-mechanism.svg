<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="DejaVu Sans, Noto Sans CJK SC, Droid Sans Fallback, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#616E7C"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1D6FA5"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#9E2A2B"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1120" height="480" fill="#FFFFFF"/>

  <!-- Top title -->
  <text x="30" y="34" font-size="16.5" font-weight="bold" fill="#1F2933">MRV-235 机制：MT_NORMAL_NC (0x44) ≡ Inner-NC, Outer-WB (0xF4) 跳过私有 L1/L2、直读共享 L3 TAD</text>

  <!-- ==================== ROW 1: Normal-WB / Dual-VA WB ==================== -->
  <rect x="26" y="54" width="1068" height="186" rx="10" fill="#F8F9FA" stroke="#D9E2EC" stroke-width="1.5"/>
  <text x="46" y="80" font-size="13.5" font-weight="bold" fill="#52606D">Normal-WB (0xFF) 或 Dual-VA WB 别名（轮询 / WB 读拉入私有 L1D/L2）</text>

  <!-- Host box -->
  <rect x="46" y="106" width="136" height="68" rx="7" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="114" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">Host cpu40</text>
  <text x="114" y="155" text-anchor="middle" font-size="11.5" fill="#52606D">MOVDIR64B</text>

  <!-- Arrow Host -> PEM0 -->
  <line x1="182" y1="140" x2="218" y2="140" stroke="#616E7C" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- PEM0/IOBN serialized box -->
  <rect x="222" y="106" width="144" height="68" rx="7" fill="#FDECEC" stroke="#9E2A2B" stroke-width="2"/>
  <text x="294" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#9E2A2B">PEM0 / IOBN</text>
  <text x="294" y="155" text-anchor="middle" font-size="11.5" fill="#9E2A2B">入向桥串行等待</text>

  <!-- Arrow PEM0 -> TAD -->
  <line x1="366" y1="140" x2="402" y2="140" stroke="#616E7C" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- TAD L3 box -->
  <rect x="406" y="106" width="152" height="68" rx="7" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="482" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">TAD (48 MiB L3)</text>
  <text x="482" y="155" text-anchor="middle" font-size="11.5" fill="#52606D">DDR5 读 = 0.00</text>

  <!-- Snoop arrow TAD <-> L1/L2 -->
  <line x1="564" y1="140" x2="682" y2="140" stroke="#9E2A2B" stroke-width="2.2" marker-end="url(#arr-warn)" marker-start="url(#arr-warn)"/>
  <text x="623" y="125" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#9E2A2B">嗅探 ~75 ns [MRV-75]</text>
  <text x="623" y="160" text-anchor="middle" font-size="11" fill="#9E2A2B">L2作废 1.59–1.96</text>

  <!-- ARM Private L1/L2 + Core -->
  <rect x="688" y="106" width="174" height="68" rx="7" fill="#FDECEC" stroke="#9E2A2B" stroke-width="1.8"/>
  <text x="775" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">ARM 私有 L1D / L2</text>
  <text x="775" y="155" text-anchor="middle" font-size="11" fill="#52606D">轮询 / WB预取[推断]锁行</text>
  <line x1="884" y1="96" x2="884" y2="226" stroke="#D9E2EC" stroke-width="1.5"/>
  <text x="988" y="124" text-anchor="middle" font-size="21" font-weight="bold" fill="#9E2A2B">13.4 M/s</text>
  <text x="988" y="147" text-anchor="middle" font-size="12" fill="#52606D">K ≥ 2 卡核死锁</text>
  <text x="988" y="169" text-anchor="middle" font-size="12" fill="#52606D">单核 39.6–42.2 M/s</text>
  <text x="988" y="191" text-anchor="middle" font-size="12" fill="#52606D">K=2 RTT p50 = 4.61 µs</text>
  <text x="988" y="213" text-anchor="middle" font-size="12" fill="#52606D">Dual-VA 跌回 12.4 M/s</text>

  <!-- ==================== ROW 2: MT_NORMAL_NC (0x44) ≡ Inner-NC, Outer-WB (0xF4) ==================== -->
  <rect x="26" y="258" width="1068" height="198" rx="10" fill="#F0F7FC" stroke="#1D6FA5" stroke-width="1.8"/>
  <text x="46" y="286" font-size="13.5" font-weight="bold" fill="#1D6FA5">MT_NORMAL_NC (0x44，零改 MAIR)  ≡  Inner-NC, Outer-WB (0xF4)  +  1-pass 64B ldp</text>

  <!-- Host box -->
  <rect x="46" y="310" width="136" height="68" rx="7" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="114" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">Host cpu40</text>
  <text x="114" y="359" text-anchor="middle" font-size="11.5" fill="#52606D">MOVDIR64B</text>

  <!-- Arrow Host -> PEM0 -->
  <line x1="182" y1="344" x2="218" y2="344" stroke="#1D6FA5" stroke-width="2.2" marker-end="url(#arr-accent)"/>

  <!-- PEM0/IOBN free box -->
  <rect x="222" y="310" width="144" height="68" rx="7" fill="#FFFFFF" stroke="#1D6FA5" stroke-width="1.8"/>
  <text x="294" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D6FA5">PEM0 / IOBN</text>
  <text x="294" y="359" text-anchor="middle" font-size="11.5" fill="#52606D">无嗅探阻塞</text>

  <!-- Arrow PEM0 -> TAD -->
  <line x1="366" y1="344" x2="402" y2="344" stroke="#1D6FA5" stroke-width="2.2" marker-end="url(#arr-accent)"/>

  <!-- TAD L3 box -->
  <rect x="406" y="310" width="152" height="68" rx="7" fill="#E1F0FA" stroke="#1D6FA5" stroke-width="2.2"/>
  <text x="482" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D6FA5">TAD (48 MiB L3)</text>
  <text x="482" y="359" text-anchor="middle" font-size="11" fill="#1D6FA5">L3 命中 · DDR5 读 0.00</text>

  <!-- Direct read arrow TAD <-> ARM Core (bypassing L1/L2) -->
  <line x1="564" y1="344" x2="732" y2="344" stroke="#1D6FA5" stroke-width="2.6" marker-end="url(#arr-accent)" marker-start="url(#arr-accent)"/>
  <text x="648" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1D6FA5">直读 L3 · 1-pass 64B</text>
  <text x="648" y="364" text-anchor="middle" font-size="11" fill="#1D6FA5">无需预取 · 不碰 WB 别名</text>

  <!-- Bypassed L1D/L2 dashed box below -->
  <rect x="582" y="396" width="132" height="44" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="648" y="415" text-anchor="middle" font-size="11" fill="#52606D">私有 L1D / L2</text>
  <text x="648" y="432" text-anchor="middle" font-size="11" fill="#52606D">跳过 · 作废 = 0.00</text>

  <!-- ARM Core box -->
  <rect x="738" y="310" width="124" height="68" rx="7" fill="#FFFFFF" stroke="#1D6FA5" stroke-width="1.8"/>
  <text x="800" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">ARM 卡核</text>
  <text x="800" y="359" text-anchor="middle" font-size="11.5" fill="#52606D">多核扩展</text>

  <!-- Outcome badge Row 2 -->
  <line x1="884" y1="300" x2="884" y2="440" stroke="#BCCCDC" stroke-width="1.5"/>
  <text x="988" y="332" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D6FA5">37.3 / 44.8</text>
  <text x="988" y="355" text-anchor="middle" font-size="12" fill="#52606D">M/s（K = 2 / 4 卡核）</text>
  <text x="988" y="379" text-anchor="middle" font-size="12" fill="#52606D">单核 19.6 M/s（约 WB 一半）</text>
  <text x="988" y="403" text-anchor="middle" font-size="12" fill="#52606D">W = 1：901 ns (+12 ns)</text>
  <text x="988" y="427" text-anchor="middle" font-size="12" fill="#52606D">L1 / L2作废 / DDR5 皆 0.00</text>
</svg>
