<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="DejaVu Sans, Noto Sans CJK SC, Droid Sans Fallback, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#616E7C"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334E68"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1D6FA5"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1120" height="440" fill="#FFFFFF"/>

  <!-- Top title -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#1F2933">MRV-235 机制：MT_NORMAL_NC (0x44) 跳过私有 L1/L2，直读共享 L3 TAD</text>

  <!-- ==================== ROW 1: Normal-WB / Dual-VA WB (Greys only) ==================== -->
  <rect x="26" y="54" width="1068" height="162" rx="10" fill="#F8F9FA" stroke="#CBD2D9" stroke-width="1.5"/>
  <text x="44" y="80" font-size="13" font-weight="bold" fill="#52606D">Normal-WB (0xFF) / Dual-VA WB</text>

  <!-- Host box -->
  <rect x="44" y="102" width="132" height="66" rx="7" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.4"/>
  <text x="110" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">Host cpu40</text>
  <text x="110" y="150" text-anchor="middle" font-size="11.5" fill="#52606D">MOVDIR64B</text>

  <!-- Arrow Host -> PEM0 -->
  <line x1="176" y1="135" x2="212" y2="135" stroke="#616E7C" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- PEM0/IOBN serialized box -->
  <rect x="216" y="102" width="144" height="66" rx="7" fill="#E4E7EB" stroke="#334E68" stroke-width="2"/>
  <text x="288" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">PEM0 / IOBN</text>
  <text x="288" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334E68">入向串行</text>

  <!-- Arrow PEM0 -> TAD -->
  <line x1="360" y1="135" x2="396" y2="135" stroke="#616E7C" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- TAD L3 box -->
  <rect x="400" y="102" width="152" height="66" rx="7" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.4"/>
  <text x="476" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">TAD (48 MiB L3)</text>
  <text x="476" y="150" text-anchor="middle" font-size="11.5" fill="#52606D">共享 Home</text>

  <!-- Snoop arrow TAD <-> L1/L2 -->
  <line x1="558" y1="135" x2="678" y2="135" stroke="#334E68" stroke-width="2.2" marker-end="url(#arr-dark)" marker-start="url(#arr-dark)"/>
  <text x="618" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#334E68">嗅探 ~75 ns</text>
  <text x="618" y="154" text-anchor="middle" font-size="10.5" fill="#52606D">L2 作废 1.6–2.0</text>

  <!-- ARM Private L1/L2 -->
  <rect x="684" y="102" width="164" height="66" rx="7" fill="#E4E7EB" stroke="#486581" stroke-width="1.8"/>
  <text x="766" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">私有 L1D / L2</text>
  <text x="766" y="150" text-anchor="middle" font-size="11" fill="#486581">持行触发写嗅探</text>

  <!-- Outcome Row 1 -->
  <line x1="874" y1="88" x2="874" y2="200" stroke="#D9E2EC" stroke-width="1.5"/>
  <text x="984" y="124" text-anchor="middle" font-size="24" font-weight="bold" fill="#334E68">13.4 M/s</text>
  <text x="984" y="149" text-anchor="middle" font-size="12" fill="#52606D">K ≥ 2 串行封顶</text>
  <text x="984" y="172" text-anchor="middle" font-size="11.5" fill="#52606D">单核 39.6–42.2 M/s</text>
  <text x="984" y="194" text-anchor="middle" font-size="11.5" fill="#52606D">Dual-VA 12.4 M/s</text>

  <!-- ==================== ROW 2: MT_NORMAL_NC (0x44) ≡ Inner-NC, Outer-WB (0xF4) (Single Accent) ==================== -->
  <rect x="26" y="234" width="1068" height="186" rx="10" fill="#F2F8FC" stroke="#1D6FA5" stroke-width="1.8"/>
  <text x="44" y="260" font-size="13" font-weight="bold" fill="#1D6FA5">MT_NORMAL_NC (0x44，零改 MAIR)  ≡  Inner-NC, Outer-WB (0xF4)</text>

  <!-- Host box -->
  <rect x="44" y="282" width="132" height="66" rx="7" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.4"/>
  <text x="110" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">Host cpu40</text>
  <text x="110" y="330" text-anchor="middle" font-size="11.5" fill="#52606D">MOVDIR64B</text>

  <!-- Arrow Host -> PEM0 -->
  <line x1="176" y1="315" x2="212" y2="315" stroke="#1D6FA5" stroke-width="2.2" marker-end="url(#arr-accent)"/>

  <!-- PEM0/IOBN free box -->
  <rect x="216" y="282" width="144" height="66" rx="7" fill="#FFFFFF" stroke="#1D6FA5" stroke-width="1.8"/>
  <text x="288" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D6FA5">PEM0 / IOBN</text>
  <text x="288" y="330" text-anchor="middle" font-size="11.5" fill="#52606D">无嗅探等待</text>

  <!-- Arrow PEM0 -> TAD -->
  <line x1="360" y1="315" x2="396" y2="315" stroke="#1D6FA5" stroke-width="2.2" marker-end="url(#arr-accent)"/>

  <!-- TAD L3 box -->
  <rect x="400" y="282" width="152" height="66" rx="7" fill="#E1F0FA" stroke="#1D6FA5" stroke-width="2.2"/>
  <text x="476" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D6FA5">TAD (48 MiB L3)</text>
  <text x="476" y="330" text-anchor="middle" font-size="11" fill="#1D6FA5">L3 命中 · DDR5 = 0</text>

  <!-- Direct read arrow TAD <-> ARM Core (bypassing L1/L2) -->
  <line x1="558" y1="315" x2="720" y2="315" stroke="#1D6FA5" stroke-width="2.6" marker-end="url(#arr-accent)" marker-start="url(#arr-accent)"/>
  <text x="639" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1D6FA5">直读 L3 · 1-pass 64 B</text>

  <!-- Bypassed L1D/L2 dashed box below -->
  <rect x="576" y="362" width="126" height="42" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="639" y="380" text-anchor="middle" font-size="10.8" fill="#52606D">私有 L1D / L2</text>
  <text x="639" y="396" text-anchor="middle" font-size="10.8" fill="#52606D">跳过 · 作废 = 0</text>

  <!-- ARM Core box -->
  <rect x="726" y="282" width="122" height="66" rx="7" fill="#FFFFFF" stroke="#1D6FA5" stroke-width="1.8"/>
  <text x="787" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">ARM 卡核</text>
  <text x="787" y="330" text-anchor="middle" font-size="11.5" fill="#52606D">多核扩展</text>

  <!-- Outcome Row 2 -->
  <line x1="874" y1="268" x2="874" y2="404" stroke="#BCCCDC" stroke-width="1.5"/>
  <text x="984" y="308" text-anchor="middle" font-size="24" font-weight="bold" fill="#1D6FA5">37.3 / 44.8</text>
  <text x="984" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#1D6FA5">M/s（K = 2 / 4 卡核）</text>
  <text x="984" y="360" text-anchor="middle" font-size="12" fill="#52606D">单核 19.5 M/s</text>
  <text x="984" y="384" text-anchor="middle" font-size="12" fill="#52606D">W = 1：901 ns (+12 ns)</text>
</svg>
