<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 50 1100 410" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-63: which stage of the closed loop each open issue targets. Numbers are MRV issue
       numbers; the row under the 13 M/s concerns the whole loop. Explanation lives in the issue text. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#9ca3af"/>
    </marker>
    <g id="stop"><circle r="6.5" fill="white" stroke="#6b7280" stroke-width="2"/></g>
    <g id="link"><path d="M -4 -12 L -4 12 M 4 -12 L 4 12" stroke="#9ca3af" stroke-width="2"/></g>
  </defs>
  <rect x="0" y="50" width="1100" height="410" fill="white"/>

  <!-- the two ends -->
  <rect x="120" y="105" width="130" height="300" rx="16" fill="#f3f4f6"/>
  <rect x="850" y="105" width="130" height="300" rx="16" fill="#f3f4f6"/>
  <text x="185" y="263" font-size="22" text-anchor="middle" fill="#1f2937">主机核</text>
  <text x="915" y="263" font-size="22" text-anchor="middle" fill="#1f2937">卡核</text>

  <!-- lanes -->
  <path d="M 250 150 L 846 150" stroke="#9ca3af" stroke-width="2.5" fill="none" marker-end="url(#head)"/>
  <path d="M 850 360 L 254 360" stroke="#9ca3af" stroke-width="2.5" fill="none" marker-end="url(#head)"/>
  <text x="565" y="126" font-size="15" text-anchor="middle" fill="#6b7280">去程</text>
  <text x="565" y="394" font-size="15" text-anchor="middle" fill="#6b7280">回程</text>

  <!-- stops: forward lane -->
  <g font-size="15" text-anchor="middle" fill="#4b5563">
    <use href="#stop" x="320" y="150"/><text x="320" y="184">CHA</text>
    <use href="#stop" x="460" y="150"/><text x="460" y="184">IIO</text>
    <use href="#link" x="565" y="150"/><text x="565" y="184">PCIe</text>
    <use href="#stop" x="670" y="150"/><text x="670" y="184">PEM</text>
    <use href="#stop" x="770" y="150"/><text x="770" y="184">请求环</text>
    <!-- stops: return lane -->
    <use href="#stop" x="770" y="360"/><text x="770" y="338">DPI</text>
    <use href="#stop" x="670" y="360"/><text x="670" y="338">PEM</text>
    <use href="#link" x="565" y="360"/><text x="565" y="338">PCIe</text>
    <use href="#stop" x="460" y="360"/><text x="460" y="338">IIO</text>
    <use href="#stop" x="320" y="360"/><text x="320" y="338">回复环</text>
  </g>

  <!-- the unknown -->
  <text x="565" y="262" text-anchor="middle" fill="#111827"><tspan font-size="64" font-weight="bold">13</tspan><tspan font-size="26" dx="8">M/s</tspan></text>

  <!-- open issues (MRV numbers) -->
  <g font-size="14" text-anchor="middle" fill="#c2410c">
    <g fill="white" stroke="#c2410c" stroke-width="1.5">
      <!-- whole loop -->
      <rect x="430" y="278" width="40" height="24" rx="12"/><rect x="476" y="278" width="40" height="24" rx="12"/>
      <rect x="522" y="278" width="40" height="24" rx="12"/><rect x="568" y="278" width="40" height="24" rx="12"/>
      <rect x="614" y="278" width="40" height="24" rx="12"/><rect x="660" y="278" width="40" height="24" rx="12"/>
      <!-- forward lane -->
      <rect x="265" y="100" width="40" height="24" rx="12"/>
      <rect x="704" y="100" width="40" height="24" rx="12"/><rect x="750" y="100" width="40" height="24" rx="12"/>
      <rect x="796" y="100" width="40" height="24" rx="12"/>
      <!-- return lane -->
      <rect x="254" y="386" width="40" height="24" rx="12"/><rect x="300" y="386" width="40" height="24" rx="12"/>
      <rect x="346" y="386" width="40" height="24" rx="12"/>
      <rect x="440" y="386" width="40" height="24" rx="12"/>
      <rect x="750" y="386" width="40" height="24" rx="12"/>
      <!-- host core -->
      <rect x="56" y="198" width="40" height="24" rx="12"/><rect x="56" y="228" width="40" height="24" rx="12"/>
      <rect x="56" y="258" width="40" height="24" rx="12"/><rect x="56" y="288" width="40" height="24" rx="12"/>
      <!-- card core -->
      <rect x="1004" y="213" width="40" height="24" rx="12"/><rect x="1004" y="243" width="40" height="24" rx="12"/>
      <rect x="1004" y="273" width="40" height="24" rx="12"/>
    </g>
    <text x="450" y="295">51</text><text x="496" y="295">50</text><text x="542" y="295">53</text><text x="588" y="295">56</text><text x="634" y="295">36</text><text x="680" y="295">39</text>
    <text x="285" y="117">58</text>
    <text x="724" y="117">52</text><text x="770" y="117">61</text><text x="816" y="117">55</text>
    <text x="274" y="403">54</text><text x="320" y="403">38</text><text x="366" y="403">40</text>
    <text x="460" y="403">60</text>
    <text x="770" y="403">18</text>
    <text x="76" y="215">17</text><text x="76" y="245">62</text><text x="76" y="275">59</text><text x="76" y="305">27</text>
    <text x="1024" y="230">57</text><text x="1024" y="260">59</text><text x="1024" y="290">27</text>
  </g>
</svg>
