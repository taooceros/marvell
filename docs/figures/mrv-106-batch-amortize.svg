<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="920" height="360" fill="#ffffff"/>

  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#57606a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- Row 1: B = 1 (MRV-99 baseline) -->
  <text x="28" y="42" font-size="15" font-weight="bold" fill="#24292f">B = 1</text>
  <text x="28" y="62" font-size="12" fill="#57606a">逐笔 MEMMOVE</text>

  <!-- Card DPI box row 1 -->
  <rect x="135" y="28" width="110" height="54" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="190" y="51" font-size="13" font-weight="bold" fill="#24292f" text-anchor="middle">CN106 DPI</text>
  <text x="190" y="70" font-size="11" fill="#57606a" text-anchor="middle">64 B × 1</text>

  <line x1="245" y1="55" x2="292" y2="55" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr-grey)"/>

  <!-- Timeline row 1: 4K + BAR4 bubble repeated -->
  <rect x="300" y="28" width="95" height="54" rx="5" fill="#eaeef2" stroke="#8c959f" stroke-width="1.4"/>
  <text x="347" y="51" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">4 KiB 搬运</text>
  <text x="347" y="70" font-size="11" fill="#57606a" text-anchor="middle">~131 ns</text>

  <rect x="401" y="28" width="104" height="54" rx="5" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="4 2"/>
  <text x="453" y="51" font-size="12" font-weight="bold" fill="#57606a" text-anchor="middle">BAR4 32 B</text>
  <text x="453" y="70" font-size="11" fill="#57606a" text-anchor="middle">+137 ns 泡沫</text>

  <rect x="511" y="28" width="95" height="54" rx="5" fill="#eaeef2" stroke="#8c959f" stroke-width="1.4"/>
  <text x="558" y="51" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">4 KiB 搬运</text>
  <text x="558" y="70" font-size="11" fill="#57606a" text-anchor="middle">~131 ns</text>

  <rect x="612" y="28" width="104" height="54" rx="5" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="4 2"/>
  <text x="664" y="51" font-size="12" font-weight="bold" fill="#57606a" text-anchor="middle">BAR4 32 B</text>
  <text x="664" y="70" font-size="11" fill="#57606a" text-anchor="middle">+137 ns 泡沫</text>

  <!-- Result callout row 1 -->
  <text x="742" y="52" font-size="22" font-weight="bold" fill="#57606a">15.3 GB/s</text>
  <text x="742" y="74" font-size="13" fill="#57606a">268 ns / 4 KiB</text>

  <!-- Divider -->
  <line x1="28" y1="122" x2="892" y2="122" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Row 2: B = 4 / 16 (DSA Batch 0x01) -->
  <text x="28" y="182" font-size="15" font-weight="bold" fill="#1f6feb">B = 4 / 16</text>
  <text x="28" y="202" font-size="12" fill="#1f6feb">DSA Batch 0x01</text>

  <!-- Card DPI box row 2 -->
  <rect x="135" y="164" width="110" height="58" rx="6" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="190" y="189" font-size="13" font-weight="bold" fill="#1f6feb" text-anchor="middle">CN106 DPI</text>
  <text x="190" y="208" font-size="11" fill="#1f6feb" text-anchor="middle">1 × Batch 64 B</text>

  <line x1="245" y1="193" x2="292" y2="193" stroke="#1f6feb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Continuous 4 x 4 KiB sub-descriptors inside one Batch -->
  <rect x="300" y="156" width="320" height="74" rx="8" fill="#f0f7ff" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="460" y="176" font-size="11.5" font-weight="bold" fill="#1f6feb" text-anchor="middle">主机 Memzone 子描述符数组（RCR = 0）</text>

  <rect x="310" y="186" width="70" height="36" rx="4" fill="#ffffff" stroke="#1f6feb" stroke-width="1.3"/>
  <text x="345" y="209" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">4 KiB #1</text>

  <rect x="386" y="186" width="70" height="36" rx="4" fill="#ffffff" stroke="#1f6feb" stroke-width="1.3"/>
  <text x="421" y="209" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">4 KiB #2</text>

  <rect x="462" y="186" width="70" height="36" rx="4" fill="#ffffff" stroke="#1f6feb" stroke-width="1.3"/>
  <text x="497" y="209" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">4 KiB #3</text>

  <rect x="538" y="186" width="72" height="36" rx="4" fill="#ffffff" stroke="#1f6feb" stroke-width="1.3"/>
  <text x="574" y="209" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">4 KiB #B</text>

  <line x1="620" y1="193" x2="646" y2="193" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Single BAR4 completion at tail -->
  <rect x="652" y="164" width="64" height="58" rx="6" fill="#1f6feb" stroke="#1f6feb" stroke-width="1.6"/>
  <text x="684" y="189" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BAR4</text>
  <text x="684" y="207" font-size="11" fill="#ddf4ff" text-anchor="middle">1 × 32 B</text>

  <!-- Result callout row 2 -->
  <text x="742" y="191" font-size="24" font-weight="bold" fill="#1f6feb">31.3 GB/s</text>
  <text x="742" y="213" font-size="13" font-weight="bold" fill="#1f6feb">131 ns / 4 KiB · 2.05×</text>

  <!-- Bottom return arrow to Card BAR4 slot 15 -->
  <path d="M 684 222 L 684 282 L 190 282 L 190 228" fill="none" stroke="#1f6feb" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#arr-blue)"/>
  <rect x="348" y="266" width="184" height="30" rx="15" fill="#ffffff" stroke="#1f6feb" stroke-width="1.4"/>
  <text x="440" y="286" font-size="12" font-weight="bold" fill="#1f6feb" text-anchor="middle">反向 P2P 写回卡 BAR4 槽 15</text>

  <text x="190" y="330" font-size="12" fill="#57606a" text-anchor="middle">零 DPI 读回 · 零主机转发</text>
  <text x="460" y="330" font-size="12" fill="#57606a" text-anchor="middle">W = 64（512 KiB 热源）· dsa2/wq2.0 单引擎</text>
  <text x="742" y="330" font-size="12" fill="#57606a">B = 4 起即满带</text>
</svg>
