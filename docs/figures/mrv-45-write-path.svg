<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-45. Where a request is written: one MOVDIR64B = one 64 B cell of the request ring in card
       memory, reached through BAR4 slot 15. Below: the cell; head seq and tail seq_tail are what the
       card checks before it takes the cell. Addresses, the control words and the lease are in the
       MRV-45 description. -->
  <defs>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="white"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">一条请求写到哪里</text>
  <text x="30" y="68" font-size="14" fill="#64748b">一条 MOVDIR64B = 请求环里的一格</text>

  <!-- lanes -->
  <g fill="#f1f5f9">
    <rect x="30" y="92" width="900" height="80" rx="12"/>
    <rect x="30" y="212" width="900" height="92" rx="12"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#64748b">
    <text x="52" y="138">主机</text>
    <text x="52" y="272">卡</text>
  </g>
  <text x="52" y="197" font-size="13" fill="#94a3b8">BAR4 槽 15</text>

  <!-- host core -->
  <rect x="234" y="106" width="124" height="52" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="296" y="138" font-size="16" fill="#1e293b" text-anchor="middle">主机核</text>

  <!-- request ring in card memory: 65533 cells, then the control area -->
  <text x="128" y="238" font-size="16" fill="#1e293b">请求环 · 65533 格</text>
  <text x="920" y="238" font-size="16" fill="#64748b" text-anchor="end">控制区</text>
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="128" y="250" width="32" height="32" rx="4"/>
    <rect x="166" y="250" width="32" height="32" rx="4"/>
    <rect x="204" y="250" width="32" height="32" rx="4"/>
    <rect x="242" y="250" width="32" height="32" rx="4"/>
    <rect x="318" y="250" width="32" height="32" rx="4"/>
    <rect x="356" y="250" width="32" height="32" rx="4"/>
    <rect x="394" y="250" width="32" height="32" rx="4"/>
    <rect x="432" y="250" width="32" height="32" rx="4"/>
    <rect x="470" y="250" width="32" height="32" rx="4"/>
    <rect x="508" y="250" width="32" height="32" rx="4"/>
    <rect x="622" y="250" width="32" height="32" rx="4"/>
    <rect x="660" y="250" width="32" height="32" rx="4"/>
    <rect x="698" y="250" width="32" height="32" rx="4"/>
    <rect x="736" y="250" width="32" height="32" rx="4"/>
    <rect x="774" y="250" width="32" height="32" rx="4"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="562" cy="266" r="2.5"/>
    <circle cx="581" cy="266" r="2.5"/>
    <circle cx="600" cy="266" r="2.5"/>
  </g>
  <g fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5">
    <rect x="812" y="250" width="32" height="32" rx="4"/>
    <rect x="850" y="250" width="32" height="32" rx="4"/>
    <rect x="888" y="250" width="32" height="32" rx="4"/>
  </g>

  <!-- the write: one 64 B cell -->
  <rect x="280" y="250" width="32" height="32" rx="4" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="296" y1="158" x2="296" y2="247" stroke="#dc2626" stroke-width="2" marker-end="url(#head-red)"/>
  <text x="284" y="197" font-size="13" fill="#94a3b8" text-anchor="end">MOVDIR64B</text>
  <text x="310" y="200" font-size="24" font-weight="bold" fill="#dc2626">64 B</text>

  <!-- the cell -->
  <g stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3" opacity="0.6">
    <line x1="280" y1="283" x2="128" y2="336"/>
    <line x1="312" y1="283" x2="920" y2="336"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <rect x="128" y="336" width="99" height="48" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="227" y="336" width="99" height="48" fill="white"/>
    <rect x="326" y="336" width="99" height="48" fill="white"/>
    <rect x="425" y="336" width="396" height="48" fill="white"/>
    <rect x="821" y="336" width="99" height="48" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g font-size="16" fill="#1e293b" text-anchor="middle">
    <text x="177.500" y="366">seq</text>
    <text x="276.500" y="366">tsc</text>
    <text x="375.500" y="366">tag</text>
    <text x="623" y="366">payload</text>
    <text x="870.500" y="366">seq_tail</text>
  </g>
  <g font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="128" y="404">0</text>
    <text x="227" y="404">8</text>
    <text x="326" y="404">16</text>
    <text x="425" y="404">24</text>
    <text x="821" y="404">56</text>
    <text x="920" y="404">64 B</text>
  </g>
</svg>
