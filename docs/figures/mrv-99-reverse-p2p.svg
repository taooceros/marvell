<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", "DejaVu Sans", sans-serif; }
      .zone { font-size: 13px; font-weight: 700; fill: #4b5563; }
      .lane-lbl { font-size: 14px; font-weight: 700; }
      .box-title { font-size: 14px; font-weight: 700; fill: #1f2937; }
      .box-sub { font-size: 12px; fill: #6b7280; }
      .step { font-size: 12.5px; font-weight: 700; }
      .big-num { font-size: 28px; font-weight: 800; }
      .big-sub { font-size: 12.5px; font-weight: 600; }
    </style>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#374151"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#ffffff"/>

  <!-- Domain column backdrops -->
  <rect x="24" y="18" width="290" height="402" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="169" y="42" text-anchor="middle" class="zone">CN106 网卡侧</text>

  <rect x="446" y="18" width="322" height="402" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="607" y="42" text-anchor="middle" class="zone">主机侧（CPU 全程休眠）</text>

  <!-- PCIe boundary -->
  <line x1="380" y1="54" x2="380" y2="416" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="380" y="42" text-anchor="middle" class="zone">PCIe Gen5 x4</text>

  <!-- ================= TOP LANE: CONTROL ================= -->
  <text x="40" y="72" class="lane-lbl" fill="#6b7280">对照组（旧做法）：完成记录写主机内存</text>

  <rect x="44" y="88" width="250" height="92" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="169" y="122" text-anchor="middle" class="box-title">卡核 + 卡侧 DMA</text>
  <text x="169" y="146" text-anchor="middle" class="box-sub">发任务 → 跨 PCIe 读回完成记录 → 清零</text>

  <rect x="464" y="88" width="132" height="92" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="530" y="128" text-anchor="middle" class="box-title">主机 DSA</text>
  <text x="530" y="150" text-anchor="middle" class="box-sub">执行任务</text>

  <rect x="622" y="88" width="128" height="92" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="686" y="128" text-anchor="middle" class="box-title">主机内存</text>
  <text x="686" y="150" text-anchor="middle" class="box-sub">32 B 完成记录</text>

  <!-- Control arrows -->
  <line x1="294" y1="116" x2="456" y2="116" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-grey)"/>
  <rect x="328" y="94" width="104" height="18" rx="3" fill="#ffffff"/>
  <text x="380" y="108" text-anchor="middle" class="step" fill="#4b5563">64 B 任务描述符</text>

  <line x1="596" y1="134" x2="616" y2="134" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-grey)"/>

  <path d="M 686 180 L 686 204 L 169 204 L 169 188" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-grey)"/>
  <rect x="272" y="193" width="236" height="20" rx="4" fill="#ffffff"/>
  <text x="390" y="208" text-anchor="middle" class="step" fill="#6b7280">跨 PCIe 读回完成记录 (1.21 µs) + 清零</text>

  <!-- Control result -->
  <text x="866" y="122" text-anchor="middle" class="big-num" fill="#6b7280">1.96 µs</text>
  <text x="866" y="146" text-anchor="middle" class="big-sub" fill="#6b7280">NOP 单笔闭环</text>
  <text x="866" y="170" text-anchor="middle" class="big-sub" fill="#9ca3af">4 KiB 拷贝: 3.13 µs</text>

  <!-- Divider -->
  <line x1="36" y1="228" x2="936" y2="228" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ================= BOTTOM LANE: TREATMENT ================= -->
  <text x="40" y="256" class="lane-lbl" fill="#0f766e">实验组（新做法）：完成记录直写卡侧 BAR4 窗口</text>

  <rect x="44" y="294" width="114" height="104" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="101" y="336" text-anchor="middle" class="box-title">卡核</text>
  <text x="101" y="358" text-anchor="middle" class="box-sub">本地轮询确认</text>
  <text x="101" y="376" text-anchor="middle" class="box-sub">顺手清零 (~1 ns)</text>

  <rect x="176" y="294" width="118" height="104" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <text x="235" y="334" text-anchor="middle" class="box-title" fill="#0f766e">卡侧 L3 缓存</text>
  <text x="235" y="356" text-anchor="middle" class="box-sub" fill="#0f766e">BAR4 窗口</text>
  <text x="235" y="374" text-anchor="middle" class="box-sub" fill="#0f766e">32 B 完成记录</text>

  <!-- Local read arrow -->
  <line x1="176" y1="346" x2="165" y2="346" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-accent)"/>

  <rect x="464" y="294" width="132" height="104" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="530" y="338" text-anchor="middle" class="box-title">主机 DSA</text>
  <text x="530" y="360" text-anchor="middle" class="box-sub">执行并反向直写</text>

  <rect x="622" y="294" width="128" height="104" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="686" y="338" text-anchor="middle" class="box-title" fill="#6b7280">主机内存</text>
  <text x="686" y="360" text-anchor="middle" class="box-sub">仅存拷贝数据</text>

  <!-- Forward submit arrow -->
  <path d="M 101 294 L 101 278 L 530 278 L 530 288" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr-dark)"/>
  <rect x="328" y="266" width="104" height="20" rx="4" fill="#ffffff"/>
  <text x="380" y="281" text-anchor="middle" class="step" fill="#374151">64 B 任务描述符</text>

  <!-- Reverse P2P completion arrow -->
  <line x1="464" y1="358" x2="302" y2="358" stroke="#0f766e" stroke-width="3.2" marker-end="url(#arr-accent)"/>
  <rect x="306" y="332" width="148" height="19" rx="4" fill="#ffffff"/>
  <text x="380" y="346" text-anchor="middle" class="step" fill="#0f766e">32 B 完成记录直写卡侧</text>
  <rect x="324" y="366" width="112" height="16" rx="3" fill="#ffffff"/>
  <text x="380" y="378" text-anchor="middle" class="box-sub" fill="#0f766e">免跨 PCIe 读回</text>

  <!-- Treatment result -->
  <text x="866" y="334" text-anchor="middle" class="big-num" fill="#0f766e">1.27 µs</text>
  <text x="866" y="358" text-anchor="middle" class="big-sub" fill="#0f766e">快 35%（1.54×）</text>
  <text x="866" y="384" text-anchor="middle" class="big-sub" fill="#0f766e">4 KiB: 2.17 µs (−31%)</text>
</svg>
