<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <style>
      .lane-lbl { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: 700; }
      .box-title { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 13px; font-weight: 700; fill: #1f2937; }
      .box-sub { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #4b5563; }
      .step { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: 600; }
      .big-num { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 27px; font-weight: 700; }
      .big-sub { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: 600; }
      .zone { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: 0.4px; }
    </style>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#374151"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#ffffff"/>

  <!-- Domain column backdrops -->
  <rect x="24" y="18" width="290" height="422" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="169" y="42" text-anchor="middle" class="zone">CN106 卡侧 (ARM64 · 2.0 GHz)</text>

  <rect x="446" y="18" width="322" height="422" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="607" y="42" text-anchor="middle" class="zone">主机 Socket 1 (零主机 CPU 转发)</text>

  <!-- PCIe Gen5 x4 boundary -->
  <line x1="380" y1="54" x2="380" y2="436" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="380" y="42" text-anchor="middle" class="zone">PCIe Gen5 x4</text>

  <!-- ================= TOP LANE: CONTROL ================= -->
  <text x="40" y="72" class="lane-lbl" fill="#6b7280">对照组 · comp 在主机 Memzone</text>

  <!-- Card box (Control) -->
  <rect x="44" y="88" width="250" height="104" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="169" y="116" text-anchor="middle" class="box-title">DPI 写 06:00.2 + DPI 读 06:00.1</text>
  <text x="169" y="138" text-anchor="middle" class="box-sub">轮询主机 Memzone</text>
  <text x="169" y="158" text-anchor="middle" class="box-sub">每轮需 DPI 读回 + DPI 清零</text>

  <!-- Host boxes (Control) -->
  <rect x="464" y="88" width="136" height="104" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="532" y="126" text-anchor="middle" class="box-title">dsa2 / wq2.0</text>
  <text x="532" y="146" text-anchor="middle" class="box-sub">dmar0 只写门户</text>
  <text x="532" y="164" text-anchor="middle" class="box-sub">1 引擎 · CC=0</text>

  <rect x="626" y="88" width="124" height="104" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="688" y="132" text-anchor="middle" class="box-title">主机 Memzone</text>
  <text x="688" y="152" text-anchor="middle" class="box-sub">32 B comp</text>

  <!-- Arrows (Control) -->
  <line x1="294" y1="118" x2="456" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-grey)"/>
  <rect x="336" y="96" width="88" height="18" rx="3" fill="#ffffff"/>
  <text x="380" y="110" text-anchor="middle" class="step" fill="#4b5563">64 B 描述符</text>

  <line x1="600" y1="140" x2="620" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-grey)"/>

  <path d="M 688 192 L 688 214 L 169 214 L 169 200" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-grey)"/>
  <rect x="282" y="203" width="212" height="20" rx="4" fill="#ffffff"/>
  <text x="388" y="218" text-anchor="middle" class="step" fill="#6b7280">DPI 读回 comp（1.21 µs）+ 清零</text>

  <!-- Result callout (Control) -->
  <text x="866" y="128" text-anchor="middle" class="big-num" fill="#6b7280">1.96 µs</text>
  <text x="866" y="150" text-anchor="middle" class="big-sub" fill="#6b7280">NOP · 1/rate(W=1)</text>
  <text x="866" y="176" text-anchor="middle" class="big-sub" fill="#9ca3af">4 KiB: 3.13 µs</text>

  <!-- Divider -->
  <line x1="36" y1="238" x2="936" y2="238" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ================= BOTTOM LANE: TREATMENT ================= -->
  <text x="40" y="264" class="lane-lbl" fill="#0f766e">实验组 · 反向 P2P 写卡 PF BAR4 槽 15</text>

  <!-- Card boxes (Treatment) -->
  <rect x="44" y="302" width="118" height="114" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="103" y="340" text-anchor="middle" class="box-title">DPI 写 06:00.2</text>
  <text x="103" y="362" text-anchor="middle" class="box-sub">卡核本地轮询</text>
  <text x="103" y="380" text-anchor="middle" class="box-sub">LDARB + 1 ns 清零</text>

  <rect x="176" y="302" width="118" height="114" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <text x="235" y="340" text-anchor="middle" class="box-title" fill="#0f766e">卡本地 DRAM</text>
  <text x="235" y="362" text-anchor="middle" class="box-sub" fill="#0f766e">BAR4 槽 15</text>
  <text x="235" y="380" text-anchor="middle" class="box-sub" fill="#0f766e">32 B comp</text>

  <!-- Local poll arrow inside card -->
  <line x1="176" y1="359" x2="167" y2="359" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Host boxes (Treatment) -->
  <rect x="464" y="302" width="144" height="114" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="536" y="340" text-anchor="middle" class="box-title">dsa2 / wq2.0</text>
  <text x="536" y="362" text-anchor="middle" class="box-sub">dmar6 SVA 页表</text>
  <text x="536" y="380" text-anchor="middle" class="box-sub">VM_PFNMAP → BAR4</text>

  <rect x="626" y="302" width="124" height="114" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="688" y="348" text-anchor="middle" class="box-title">主机 Memzone</text>
  <text x="688" y="370" text-anchor="middle" class="box-sub">仅 src / dst</text>

  <!-- Forward submit arrow (Treatment) -->
  <path d="M 103 302 L 103 286 L 536 286 L 536 296" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr-dark)"/>
  <rect x="314" y="274" width="132" height="20" rx="4" fill="#ffffff"/>
  <text x="380" y="289" text-anchor="middle" class="step" fill="#374151">64 B 描述符 (正向 P2P)</text>

  <!-- Reverse P2P completion arrow (Treatment, ACCENT) -->
  <line x1="464" y1="370" x2="302" y2="370" stroke="#0f766e" stroke-width="3.2" marker-end="url(#arr-accent)"/>
  <rect x="314" y="344" width="132" height="19" rx="4" fill="#ffffff"/>
  <text x="380" y="358" text-anchor="middle" class="step" fill="#0f766e">32 B comp (反向 P2P)</text>
  <rect x="322" y="378" width="116" height="16" rx="3" fill="#ffffff"/>
  <text x="380" y="390" text-anchor="middle" class="box-sub" fill="#0f766e">零 DPI 读回 · 零主机转发</text>

  <!-- Result callout (Treatment, ACCENT) -->
  <text x="866" y="344" text-anchor="middle" class="big-num" fill="#0f766e">1.27 µs</text>
  <text x="866" y="368" text-anchor="middle" class="big-sub" fill="#0f766e">−35% · 1.54×</text>
  <text x="866" y="394" text-anchor="middle" class="big-sub" fill="#0f766e">4 KiB: 2.17 µs (−31%)</text>
</svg>
