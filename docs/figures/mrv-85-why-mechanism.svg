<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="DejaVu Sans, Noto Sans CJK SC, Droid Sans Fallback, sans-serif">
  <rect width="940" height="420" fill="#ffffff"/>

  <!-- Top: The Ring & ~3.2 us Out-of-order Landing Zone -->
  <text x="36" y="36" font-size="15" font-weight="bold" fill="#0f172a">卡侧 BAR4 请求环：最前沿 ~3.2 µs（约 447 格）的「乱序降落带」</text>

  <!-- Host CHA box -->
  <rect x="36" y="54" width="212" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="142" y="80" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">主机核 40 → 32 个 CHA</text>
  <text x="142" y="102" font-size="12.5" fill="#475569" text-anchor="middle">无栅栏 MOVDIR64B</text>
  <text x="142" y="122" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">~447 格在途 · 排空 ~3.2 µs</text>

  <!-- Arrow from Host CHA to Landing Zone -->
  <line x1="248" y1="96" x2="288" y2="96" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="296,96 284,90 284,102" fill="#dc2626"/>

  <!-- Ring bar: Left = Settled Cold Cells, Middle = ~3.2 us In-flight Landing Zone, Right = Empty -->
  <!-- Settled zone -->
  <rect x="300" y="54" width="216" height="84" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="408" y="82" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">已落齐的连续满格</text>
  <text x="408" y="104" font-size="12.5" fill="#475569" text-anchor="middle">序号连续 · 无空洞</text>
  <text x="408" y="124" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">卡核一口气满批连取</text>

  <!-- Active ~3.2 us landing zone (Red highlight) -->
  <rect x="522" y="54" width="268" height="84" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="656" y="79" font-size="13.5" font-weight="bold" fill="#991b1b" text-anchor="middle">最前沿：~3.2 µs 乱序降落带</text>
  <!-- Mini slots showing out-of-order holes -->
  <g transform="translate(546, 89)">
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#dc2626"/>
    <rect x="28" y="0" width="24" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="40" y="14" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">空</text>
    <rect x="56" y="0" width="24" height="20" rx="3" fill="#dc2626"/>
    <rect x="84" y="0" width="24" height="20" rx="3" fill="#dc2626"/>
    <rect x="112" y="0" width="24" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="124" y="14" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">空</text>
    <rect x="140" y="0" width="24" height="20" rx="3" fill="#dc2626"/>
    <rect x="168" y="0" width="24" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="180" y="14" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">空</text>
    <rect x="196" y="0" width="24" height="20" rx="3" fill="#dc2626"/>
  </g>
  <text x="656" y="128" font-size="12" fill="#7f1d1d" text-anchor="middle">后发格已到 · 前序慢格还在路上</text>

  <!-- Empty future zone -->
  <rect x="796" y="54" width="108" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="850" y="101" font-size="13" fill="#94a3b8" text-anchor="middle">未写入空槽</text>

  <line x1="36" y1="160" x2="904" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Bottom: 3 Rows Comparing 0 us vs 1 us vs 3 us -->
  <!-- Row 1: 0 us -->
  <text x="36" y="206" font-size="17" font-weight="bold" fill="#475569">不停顿 (0 µs)</text>
  <text x="36" y="226" font-size="12.5" fill="#64748b">死盯最前沿空洞</text>

  <rect x="196" y="182" width="510" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="451" y="204" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">死读降落带慢格（93.6% 空轮询）→ 顶满主机 447 条 CHA 反压</text>
  <text x="451" y="222" font-size="12" fill="#7f1d1d" text-anchor="middle">每轮仅取 19.4 格 · 主机被迫等 30.4 周期/格</text>

  <text x="815" y="216" font-size="26" font-weight="bold" fill="#64748b" text-anchor="middle">128.7 M/s</text>

  <!-- Row 2: 1 us -->
  <text x="36" y="286" font-size="17" font-weight="bold" fill="#475569">停 1 µs</text>
  <text x="36" y="306" font-size="12.5" fill="#64748b">小于 ~3.2 µs 排空窗</text>

  <rect x="196" y="262" width="150" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="271" y="291" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">停 1 µs（太短）</text>

  <rect x="354" y="262" width="352" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="530" y="284" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">醒来时慢格未落齐（连取 ~210 格又撞前沿）</text>
  <text x="530" y="302" font-size="12" fill="#7f1d1d" text-anchor="middle">CHA 仍堵在 433 条 (3.28 µs)</text>

  <text x="815" y="296" font-size="26" font-weight="bold" fill="#475569" text-anchor="middle">132.2 M/s</text>

  <!-- Row 3: 3 us -->
  <text x="36" y="366" font-size="17" font-weight="bold" fill="#0f172a">停 3 µs</text>
  <text x="36" y="386" font-size="12.5" font-weight="bold" fill="#dc2626">跨过 ~3.2 µs 排空窗</text>

  <rect x="196" y="342" width="236" height="48" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="314" y="364" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">停 3 µs：让开通道</text>
  <text x="314" y="382" font-size="12" fill="#475569" text-anchor="middle">~447 条在途写全部落齐</text>

  <rect x="440" y="342" width="266" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="573" y="364" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">醒来连取 ~900 格（空轮询 0.7%）</text>
  <text x="573" y="382" font-size="12" fill="#047857" text-anchor="middle">CHA 降至 360 条 · 主机 24.2 周期/格</text>

  <text x="815" y="376" font-size="28" font-weight="bold" fill="#dc2626" text-anchor="middle">161.6 M/s</text>
</svg>
