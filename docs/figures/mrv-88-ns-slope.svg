<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif">
  <rect width="1080" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ==================== PANEL 1: STEP 1 ==================== -->
  <rect x="24" y="24" width="328" height="372" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <circle cx="52" cy="54" r="14" fill="#0f172a"/>
  <text x="52" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="76" y="59" font-size="17" font-weight="700" fill="#0f172a">加受控忙等 +δ</text>
  <text x="76" y="80" font-size="12" fill="#64748b">双栅栏 + 串行依赖链（防乱序）</text>

  <!-- Host chain -->
  <text x="44" y="114" font-size="13" font-weight="600" fill="#334155">主机 x86_64（3.9 GHz）</text>
  <rect x="44" y="124" width="58" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="73" y="147" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#1e293b">lfence</text>
  <line x1="102" y1="142" x2="118" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-grey)"/>

  <rect x="122" y="124" width="128" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="186" y="141" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#dc2626">imul x, x</text>
  <text x="186" y="155" text-anchor="middle" font-size="10" fill="#b91c1c">× R 轮（~0.8 ns/轮）</text>
  <line x1="250" y1="142" x2="266" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-grey)"/>

  <rect x="270" y="124" width="58" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="299" y="147" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#1e293b">lfence</text>

  <text x="186" y="188" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">10 / 20 / 40 ns</text>

  <line x1="44" y1="210" x2="328" y2="210" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card chain -->
  <text x="44" y="238" font-size="13" font-weight="600" fill="#334155">卡核 ARM64（2.0 GHz）</text>
  <rect x="44" y="248" width="58" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="73" y="271" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#1e293b">isb</text>
  <line x1="102" y1="266" x2="118" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-grey)"/>

  <rect x="122" y="248" width="128" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="186" y="265" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#dc2626">mul x, x, x</text>
  <text x="186" y="279" text-anchor="middle" font-size="10" fill="#b91c1c">× R 轮（~1.5 ns/轮）</text>
  <line x1="250" y1="266" x2="266" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-grey)"/>

  <rect x="270" y="248" width="58" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="299" y="271" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#1e293b">isb</text>

  <text x="186" y="312" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">30 / 45 / 60 ns</text>

  <!-- Calibration note box -->
  <rect x="44" y="334" width="284" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="186" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">启动自校准：2001 次中位数 − 空测</text>


  <!-- ==================== PANEL 2: STEP 2 ==================== -->
  <rect x="376" y="24" width="328" height="372" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <circle cx="404" cy="54" r="14" fill="#0f172a"/>
  <text x="404" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="428" y="59" font-size="17" font-weight="700" fill="#0f172a">W = 1 串行定标</text>
  <text x="428" y="80" font-size="12" font-weight="500" fill="#64748b">单条无重叠，验证 +δ 1:1 落入 RTT</text>

  <!-- Bar steps showing W=1 WC1 host delay -->
  <text x="396" y="114" font-size="12" font-weight="600" fill="#334155">写合并 W = 1 实测周期（200 万轮）</text>

  <!-- +0 ns -->
  <text x="396" y="141" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">+0 ns</text>
  <rect x="446" y="127" width="128" height="20" rx="4" fill="#cbd5e1"/>
  <text x="582" y="142" font-size="12" font-weight="600" fill="#334155">924.2 ns</text>

  <!-- +10 ns -->
  <text x="396" y="171" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">+10 ns</text>
  <rect x="446" y="157" width="128" height="20" rx="4" fill="#cbd5e1"/>
  <rect x="574" y="157" width="10" height="20" rx="2" fill="#dc2626"/>
  <text x="592" y="172" font-size="12" font-weight="700" fill="#dc2626">934.9 (+10.7)</text>

  <!-- +20 ns -->
  <text x="396" y="201" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">+20 ns</text>
  <rect x="446" y="187" width="128" height="20" rx="4" fill="#cbd5e1"/>
  <rect x="574" y="187" width="20" height="20" rx="2" fill="#dc2626"/>
  <text x="602" y="202" font-size="12" font-weight="700" fill="#dc2626">944.7 (+20.5)</text>

  <!-- +40 ns -->
  <text x="396" y="231" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">+40 ns</text>
  <rect x="446" y="217" width="128" height="20" rx="4" fill="#cbd5e1"/>
  <rect x="574" y="217" width="40" height="20" rx="2" fill="#dc2626"/>
  <text x="620" y="232" font-size="12" font-weight="700" fill="#dc2626">964.3 (+40.1)</text>

  <line x1="396" y1="256" x2="684" y2="256" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Big verified numbers -->
  <rect x="396" y="272" width="136" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="464" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">主机 W=1 斜率</text>
  <text x="464" y="334" text-anchor="middle" font-size="26" font-weight="800" fill="#dc2626">1.01×</text>
  <text x="464" y="358" text-anchor="middle" font-size="11" fill="#64748b">0.99 – 1.03×</text>

  <rect x="548" y="272" width="136" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="616" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">卡核 W=1 斜率</text>
  <text x="616" y="334" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">1.11×</text>
  <text x="616" y="358" text-anchor="middle" font-size="11" fill="#64748b">30→60 档间 1.00×</text>


  <!-- ==================== PANEL 3: STEP 3 ==================== -->
  <rect x="728" y="24" width="328" height="372" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <circle cx="756" cy="54" r="14" fill="#0f172a"/>
  <text x="756" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="780" y="59" font-size="17" font-weight="700" fill="#0f172a">2000 万条摊平算斜率</text>
  <text x="780" y="80" font-size="12" fill="#64748b">总耗时 ÷ 2×10⁷ → 0.1 ns 分辨率</text>

  <!-- Formula badge -->
  <rect x="748" y="96" width="288" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="892" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">T = 总时间 ÷ 20,000,000</text>
  <text x="892" y="133" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">+10 ns/条  ⇒  总耗时 +0.20 s</text>

  <!-- Mini slope chart -->
  <line x1="784" y1="322" x2="1024" y2="322" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="784" y1="164" x2="784" y2="322" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="776" y="174" text-anchor="end" font-size="11" fill="#64748b">90</text>
  <text x="776" y="224" text-anchor="end" font-size="11" fill="#64748b">60</text>
  <text x="776" y="274" text-anchor="end" font-size="11" fill="#64748b">30</text>
  <text x="776" y="322" text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="756" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#475569" transform="rotate(-90 756 246)">T (ns/条)</text>

  <text x="784" y="340" text-anchor="middle" font-size="11" fill="#64748b">0</text>
  <text x="900" y="340" text-anchor="middle" font-size="11" fill="#64748b">30</text>
  <text x="958" y="340" text-anchor="middle" font-size="11" fill="#64748b">45</text>
  <text x="1016" y="340" text-anchor="middle" font-size="11" fill="#64748b">60</text>
  <text x="904" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">忙等 δ (ns)</text>

  <!-- Grid lines -->
  <line x1="784" y1="270" x2="1024" y2="270" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="784" y1="220" x2="1024" y2="220" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="784" y1="170" x2="1024" y2="170" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Flat line: Slow state WC4 W=64 (76.1 -> 75.9 -> 75.7 -> 75.6 ns) -->
  <polyline points="784,193 900,194 958,194 1016,194" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="784" cy="193" r="4.5" fill="#64748b"/>
  <circle cx="900" cy="194" r="4.5" fill="#64748b"/>
  <circle cx="958" cy="194" r="4.5" fill="#64748b"/>
  <circle cx="1016" cy="194" r="4.5" fill="#64748b"/>
  <text x="896" y="182" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">斜率 ≈ 0（被掩盖）</text>

  <!-- Steep line: Fast state WC1 W=1024 (24.8 -> 58.6 -> 72.3 -> 86.8 ns) -->
  <polyline points="784,280 900,223 958,200 1016,175" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="784" cy="280" r="4.5" fill="#dc2626"/>
  <circle cx="900" cy="223" r="4.5" fill="#dc2626"/>
  <circle cx="958" cy="200" r="4.5" fill="#dc2626"/>
  <circle cx="1016" cy="175" r="4.5" fill="#dc2626"/>
  <text x="936" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626" transform="rotate(-24 936 252)">斜率 ≈ 1（关键路径）</text>

  <!-- Footer verdict inside panel 3 -->
  <text x="892" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">斜率 = ΔT ÷ δ</text>
</svg>
