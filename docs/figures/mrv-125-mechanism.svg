<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
      .col-hdr { font-size: 13px; font-weight: 700; fill: #64748b; }
      .big-num { font-size: 26px; font-weight: 700; fill: #1e293b; }
      .big-teal { font-size: 26px; font-weight: 700; fill: #0f766e; }
      .hero-teal { font-size: 36px; font-weight: 700; fill: #0f766e; }
      .rate-grey { font-size: 22px; font-weight: 700; fill: #1e293b; }
      .rate-teal { font-size: 22px; font-weight: 700; fill: #0f766e; }
      .mid-lbl { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .mid-teal { font-size: 15px; font-weight: 700; fill: #0f766e; }
      .sub-lbl { font-size: 12.5px; fill: #475569; }
      .sub-teal { font-size: 12.5px; fill: #0f766e; }
      .tag-lbl { font-size: 11.5px; fill: #64748b; }
    </style>
  </defs>

  <rect width="980" height="360" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="110" y="28" text-anchor="middle" class="col-hdr">TX 留存池（65,536 包）</text>
  <text x="348" y="28" text-anchor="middle" class="col-hdr">主机 LLC（60 MiB）</text>
  <text x="636" y="28" text-anchor="middle" class="col-hdr">无一致性直推</text>
  <text x="860" y="28" text-anchor="middle" class="col-hdr">卡侧整形 ⇄ RX</text>

  <!-- Subtle vertical divider between host cache domain and PCIe direct path -->
  <line x1="554" y1="42" x2="554" y2="332" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ==================== TOP LANE: 2048 B set-aliasing ==================== -->
  <rect x="26" y="54" width="168" height="84" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="110" y="88" text-anchor="middle" class="big-num">2048 B</text>
  <text x="110" y="114" text-anchor="middle" class="sub-lbl">bits[10:6] = 0</text>

  <line x1="194" y1="96" x2="238" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>

  <!-- LLC 1/32 aliased block -->
  <rect x="248" y="54" width="200" height="62" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="248" y="54" width="18" height="62" rx="4" fill="#475569"/>
  <text x="356" y="81" text-anchor="middle" class="mid-lbl">1/32 组（1.875 MiB）</text>
  <text x="356" y="102" text-anchor="middle" class="sub-lbl">4 MiB 活跃头 2.13× 过载</text>

  <!-- Overflow arrow LLC -> DRAM -->
  <line x1="257" y1="116" x2="257" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>
  <rect x="248" y="152" width="200" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="348" y="177" text-anchor="middle" class="mid-lbl">DRAM · 0.60 miss</text>

  <!-- Clean straight arrow from top lane to MOVDIR64B -->
  <path d="M 448 172 L 570 172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>
  <text x="502" y="144" text-anchor="middle" class="rate-grey">22.3</text>
  <text x="502" y="162" text-anchor="middle" class="tag-lbl">M/s</text>

  <!-- ==================== BOTTOM LANE: 2112 B anti-alias ==================== -->
  <rect x="26" y="232" width="168" height="84" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <text x="110" y="266" text-anchor="middle" class="big-teal">2112 B</text>
  <text x="110" y="292" text-anchor="middle" class="sub-teal">+64 B 奇数行步长</text>

  <line x1="194" y1="274" x2="238" y2="274" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>

  <!-- LLC full spread block -->
  <rect x="248" y="238" width="200" height="72" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="348" y="269" text-anchor="middle" class="mid-teal">60 MiB 全组均匀散列</text>
  <text x="348" y="293" text-anchor="middle" class="sub-teal">0.00 miss · 全热命中</text>

  <!-- Clean straight arrow from bottom lane into MOVDIR64B -->
  <path d="M 448 274 L 570 274" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <text x="502" y="246" text-anchor="middle" class="rate-teal">43.9</text>
  <text x="502" y="264" text-anchor="middle" class="sub-teal">M/s</text>

  <!-- ==================== COLUMN 3: MOVDIR64B -> BAR4 ==================== -->
  <rect x="580" y="120" width="112" height="190" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="636" y="176" text-anchor="middle" class="mid-lbl">MOVDIR64B</text>
  <text x="636" y="204" text-anchor="middle" class="sub-lbl">↓</text>
  <text x="636" y="232" text-anchor="middle" class="mid-lbl">BAR4</text>
  <text x="636" y="268" text-anchor="middle" class="tag-lbl">无主机一致性</text>

  <!-- Arrow BAR4 -> CN106 -->
  <path d="M 692 146 L 758 146" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>
  <text x="725" y="136" text-anchor="middle" class="tag-lbl">64 B</text>

  <!-- ==================== COLUMN 4: CN106 + RX DDIO ==================== -->
  <rect x="768" y="54" width="184" height="114" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="860" y="86" text-anchor="middle" class="mid-lbl">CN106 卡核</text>
  <text x="860" y="114" text-anchor="middle" class="sub-lbl">T_pause = 1 µs</text>
  <text x="860" y="138" text-anchor="middle" class="sub-lbl">cbat 25–32 · 无慢态</text>

  <line x1="860" y1="168" x2="860" y2="206" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-teal)"/>
  <text x="908" y="192" text-anchor="middle" class="sub-teal">WC 写合并</text>

  <rect x="768" y="216" width="184" height="106" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.4"/>
  <text x="860" y="264" text-anchor="middle" class="hero-teal">100%</text>
  <text x="860" y="290" text-anchor="middle" class="mid-teal">RX DDIO 命中</text>
  <text x="860" y="310" text-anchor="middle" class="tag-lbl">0 NIC Snoop</text>
</svg>
