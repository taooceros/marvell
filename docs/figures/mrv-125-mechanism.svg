<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
      .col-hdr { font-size: 13px; font-weight: 700; fill: #64748b; }
      .big-num { font-size: 26px; font-weight: 700; fill: #1e293b; }
      .big-teal { font-size: 26px; font-weight: 700; fill: #0f766e; }
      .hero-teal { font-size: 36px; font-weight: 700; fill: #0f766e; }
      .rate-grey { font-size: 22px; font-weight: 700; fill: #1e293b; }
      .rate-teal { font-size: 22px; font-weight: 700; fill: #0f766e; }
      .mid-lbl { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .mid-teal { font-size: 15px; font-weight: 700; fill: #0f766e; }
      .sub-lbl { font-size: 12.5px; fill: #475569; }
      .sub-teal { font-size: 12.5px; fill: #0f766e; }
      .tag-lbl { font-size: 11.5px; fill: #64748b; }
    </style>
  </defs>

  <rect width="980" height="360" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="112" y="28" text-anchor="middle" class="col-hdr">TX 留存池（N=65,536）</text>
  <text x="352" y="28" text-anchor="middle" class="col-hdr">主机 LLC（60 MiB）</text>
  <text x="640" y="28" text-anchor="middle" class="col-hdr">无一致性直推</text>
  <text x="862" y="28" text-anchor="middle" class="col-hdr">卡侧整形 ⇄ RX</text>

  <!-- Subtle vertical divider between host cache domain and PCIe direct path -->
  <line x1="560" y1="42" x2="560" y2="338" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ==================== TOP LANE: 2048 B power-of-2 set-aliasing ==================== -->
  <rect x="14" y="52" width="194" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="111" y="85" text-anchor="middle" class="big-num">2048 B</text>
  <text x="111" y="107" text-anchor="middle" class="sub-lbl">2^11 切片 (UMEM)</text>
  <text x="111" y="126" text-anchor="middle" class="tag-lbl">bits[10:6] = 0</text>

  <line x1="208" y1="95" x2="240" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>
  <!-- LLC 1/32 aliased block -->
  <rect x="250" y="52" width="204" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="250" y="52" width="18" height="60" rx="4" fill="#475569"/>
  <text x="360" y="78" text-anchor="middle" class="mid-lbl">1/32 组（1.875 MiB）</text>
  <text x="360" y="99" text-anchor="middle" class="sub-lbl">4.00 MiB 活跃行 2.13× 过载</text>

  <!-- Overflow arrow LLC -> DRAM -->
  <line x1="259" y1="112" x2="259" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>
  <rect x="250" y="146" width="204" height="52" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="352" y="169" text-anchor="middle" class="mid-lbl">DRAM · 0.60 miss</text>
  <text x="352" y="188" text-anchor="middle" class="tag-lbl">真 128 MiB 溢出亦 21.5 M/s</text>

  <!-- Clean straight arrow from top lane to MOVDIR64B -->
  <path d="M 454 172 L 574 172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>
  <text x="508" y="144" text-anchor="middle" class="rate-grey">22.3</text>
  <text x="508" y="162" text-anchor="middle" class="tag-lbl">M/s</text>

  <!-- ==================== BOTTOM LANE: 2112 B anti-alias (4.00 MiB touched) ==================== -->
  <rect x="14" y="232" width="194" height="90" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <text x="111" y="265" text-anchor="middle" class="big-teal">2112 B</text>
  <text x="111" y="288" text-anchor="middle" class="sub-teal">奇数行（DPDK 2368 B 类）</text>
  <text x="111" y="308" text-anchor="middle" class="tag-lbl">仅首 64 B · 4.00 MiB 活跃行</text>

  <line x1="208" y1="277" x2="240" y2="277" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <!-- LLC full spread block -->
  <rect x="250" y="236" width="204" height="82" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="352" y="264" text-anchor="middle" class="mid-teal">60 MiB 全组散列</text>
  <text x="352" y="286" text-anchor="middle" class="sub-teal">4.00 MiB 活跃行 · 0.00 miss</text>
  <text x="352" y="306" text-anchor="middle" class="tag-lbl">活跃超 60 MiB 仍落 DRAM</text>

  <!-- Clean straight arrow from bottom lane into MOVDIR64B -->
  <path d="M 454 277 L 574 277" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <text x="508" y="249" text-anchor="middle" class="rate-teal">43.9</text>
  <text x="508" y="267" text-anchor="middle" class="sub-teal">M/s</text>

  <!-- ==================== COLUMN 3: MOVDIR64B -> BAR4 ==================== -->
  <rect x="584" y="122" width="112" height="196" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="640" y="180" text-anchor="middle" class="mid-lbl">MOVDIR64B</text>
  <text x="640" y="208" text-anchor="middle" class="sub-lbl">↓</text>
  <text x="640" y="236" text-anchor="middle" class="mid-lbl">BAR4</text>
  <text x="640" y="272" text-anchor="middle" class="tag-lbl">无主机一致性</text>

  <!-- Arrow BAR4 -> CN106 -->
  <path d="M 696 146 L 760 146" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-grey)"/>
  <text x="728" y="136" text-anchor="middle" class="tag-lbl">64 B</text>

  <!-- ==================== COLUMN 4: CN106 + RX DDIO ==================== -->
  <rect x="770" y="52" width="186" height="118" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="863" y="84" text-anchor="middle" class="mid-lbl">CN106 卡核</text>
  <text x="863" y="110" text-anchor="middle" class="sub-lbl">W=128 · T_pause=1 µs</text>
  <text x="863" y="133" text-anchor="middle" class="sub-lbl">cbat 25–32 · 零慢态</text>
  <text x="863" y="155" text-anchor="middle" class="tag-lbl">代价: 2KiB p50=5.75 µs</text>

  <line x1="863" y1="170" x2="863" y2="208" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-teal)"/>
  <text x="912" y="194" text-anchor="middle" class="sub-teal">WC 写合并</text>

  <rect x="770" y="218" width="186" height="106" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.4"/>
  <text x="863" y="264" text-anchor="middle" class="hero-teal">100%</text>
  <text x="863" y="290" text-anchor="middle" class="mid-teal">RX DDIO 命中</text>
  <text x="863" y="311" text-anchor="middle" class="tag-lbl">99.9999% · 0 NIC Snoop</text>
</svg>
