<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432">
  <defs>
    <style>
      .title { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sec { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 13px; font-weight: 700; fill: #334155; }
      .lbl { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #1e293b; }
      .sub { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 10.6px; fill: #64748b; }
      .big { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .big-acc { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: 700; fill: #1d4ed8; }
      .acc { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: 700; fill: #1d4ed8; }
    </style>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="960" height="432" fill="#ffffff"/>

  <!-- Top Section: Case A — W_credit = 32, MAX_DRAIN = 32 (Stop-and-Wait Overload) -->
  <rect x="20" y="18" width="920" height="178" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="45" class="sec">A. W_credit = 32, MAX_DRAIN = 32（追读整窗排空 → 20 M/s 过载）</text>

  <!-- Box A1 -->
  <rect x="38" y="66" width="188" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="132" y="92" text-anchor="middle" class="lbl" font-weight="700">主机单批发送</text>
  <text x="132" y="119" text-anchor="middle" class="big">26–31 条/批</text>
  <text x="132" y="142" text-anchor="middle" class="sub">触顶 W_credit = 32</text>
  <text x="132" y="159" text-anchor="middle" class="sub">max_send_burst = 0</text>

  <line x1="226" y1="119" x2="258" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Box A2 -->
  <rect x="266" y="66" width="206" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="369" y="92" text-anchor="middle" class="lbl" font-weight="700">单次 poll (MAX_DRAIN=32)</text>
  <text x="369" y="119" text-anchor="middle" class="big">32 → 1–6</text>
  <text x="369" y="142" text-anchor="middle" class="sub">隐式停等 1.1–1.4 µs</text>
  <text x="369" y="159" text-anchor="middle" class="sub">批末单次 RDTSCP 偏置</text>

  <line x1="472" y1="119" x2="504" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Box A3 -->
  <rect x="512" y="66" width="196" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="610" y="92" text-anchor="middle" class="lbl" font-weight="700">卡核跑空</text>
  <text x="610" y="119" text-anchor="middle" class="big">B↑ 有效并发↓</text>
  <text x="610" y="142" text-anchor="middle" class="sub">B = 1 → 8 → 16 → 32</text>
  <text x="610" y="159" text-anchor="middle" class="sub">对照 MAX_DRAIN=8 为 20.0 M/s</text>

  <line x1="708" y1="119" x2="740" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Box A4 -->
  <rect x="748" y="66" width="174" height="106" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="835" y="92" text-anchor="middle" class="lbl" font-weight="700">过载发散</text>
  <text x="835" y="120" text-anchor="middle" class="big">17.5–18.2 M/s</text>
  <text x="835" y="144" text-anchor="middle" class="sub">tot p99: 13–19 ms</text>
  <text x="835" y="161" text-anchor="middle" class="sub">排队线性累积</text>

  <!-- Bottom Section: Case B — W_credit = 48 > MAX_DRAIN = 32 -->
  <rect x="20" y="214" width="920" height="198" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="38" y="242" class="acc">B. W_credit = 48 &gt; MAX_DRAIN = 32（滞回确能降忙时，但 T_pause = 0 与无突发上限仍触发串行）</text>

  <!-- Box B1 -->
  <rect x="38" y="264" width="188" height="124" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="132" y="290" text-anchor="middle" class="acc">主机滞回 B = 32</text>
  <text x="132" y="319" text-anchor="middle" class="big-acc">48 → ≤16</text>
  <text x="132" y="344" text-anchor="middle" class="sub">按需静默 1.38 µs</text>
  <text x="132" y="363" text-anchor="middle" class="sub">轻载滞回零额外税</text>

  <line x1="226" y1="326" x2="258" y2="326" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Box B2: Corrected Causality -->
  <rect x="266" y="264" width="206" height="124" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="369" y="290" text-anchor="middle" class="lbl" font-weight="700">卡核忙时缩短（非恶化）</text>
  <text x="369" y="319" text-anchor="middle" class="big">忙批 ↑ / snp ↓</text>
  <text x="369" y="344" text-anchor="middle" class="sub">忙轮询 -16%（snp/taken 1.16→1.12）</text>
  <text x="369" y="363" text-anchor="middle" class="sub">T_pause=0 排空即 77 M/s 盯 next</text>

  <line x1="472" y1="326" x2="504" y2="326" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Box B3: Reopen burst with max_send_burst=0 -->
  <rect x="512" y="264" width="196" height="124" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="610" y="290" text-anchor="middle" class="lbl" font-weight="700">开闸无上限突发重入</text>
  <text x="610" y="319" text-anchor="middle" class="big">PEM0 → IOBN</text>
  <text x="610" y="344" text-anchor="middle" class="sub">无突发限（WC4 达 32–34 条/批）</text>
  <text x="610" y="363" text-anchor="middle" class="sub">撞上空轮询再触 76 ns 串行</text>

  <line x1="708" y1="326" x2="740" y2="326" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Box B4 -->
  <rect x="748" y="264" width="174" height="124" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="835" y="290" text-anchor="middle" class="acc">20.0 M/s 最优</text>
  <text x="835" y="320" text-anchor="middle" class="big-acc">7.01 µs</text>
  <text x="835" y="344" text-anchor="middle" class="lbl">tot p99（-41%）</text>
  <text x="835" y="363" text-anchor="middle" class="sub">wire 3.23 µs；仍 &gt; 2.5 µs</text>
</svg>
