<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="760" height="280" fill="#ffffff"/>

  <!-- Outer 128 B L3 block container -->
  <rect x="40" y="28" width="680" height="110" rx="8" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="50" font-size="13" fill="#666666" font-weight="bold">同一 128 B 物理块 (pa + 0 .. +127)</text>
  <text x="702" y="50" font-size="12" fill="#888888" text-anchor="end">LLC LTG = 128 B (sysfs index3 = 128，PCIe 入站待测)</text>

  <!-- Left 64 B coherency line (+0 B) -->
  <rect x="58" y="64" width="312" height="60" rx="6" fill="#ffffff" stroke="#1f77b4" stroke-width="2.2"/>
  <text x="76" y="89" font-size="14" fill="#1f77b4" font-weight="bold">+0 B .. +63 B</text>
  <text x="76" y="111" font-size="12" fill="#444444">核间目录 DTG · UniqueDirty (M)</text>
  <text x="354" y="98" font-size="18" fill="#1f77b4" font-weight="bold" text-anchor="end">64 B</text>

  <!-- Right 64 B coherency line (+64 B) -->
  <rect x="390" y="64" width="312" height="60" rx="6" fill="#ffffff" stroke="#1f77b4" stroke-width="2.2"/>
  <text x="408" y="89" font-size="14" fill="#1f77b4" font-weight="bold">+64 B .. +127 B</text>
  <text x="408" y="111" font-size="12" fill="#444444">核间目录 DTG · UniqueDirty (M)</text>
  <text x="686" y="98" font-size="18" fill="#1f77b4" font-weight="bold" text-anchor="end">64 B</text>

  <!-- Center divider: zero cross-line snoops -->
  <line x1="380" y1="60" x2="380" y2="195" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="318" y="145" width="124" height="28" rx="14" fill="#eef5fb" stroke="#1f77b4" stroke-width="1.2"/>
  <text x="380" y="164" font-size="12.5" fill="#1f77b4" font-weight="bold" text-anchor="middle">0 跨核 DTG 嗅探</text>

  <!-- Arrows from cores to their respective 64 B lines -->
  <line x1="214" y1="184" x2="214" y2="128" stroke="#1f77b4" stroke-width="2.2"/>
  <polygon points="214,124 209,133 219,133" fill="#1f77b4"/>

  <line x1="546" y1="184" x2="546" y2="128" stroke="#1f77b4" stroke-width="2.2"/>
  <polygon points="546,124 541,133 551,133" fill="#1f77b4"/>

  <!-- Card Core 3 box -->
  <rect x="84" y="186" width="260" height="68" rx="6" fill="#f2f4f7" stroke="#555555" stroke-width="1.5"/>
  <text x="102" y="212" font-size="14" fill="#222222" font-weight="bold">卡核 3 · L1D / L2 (64 B)</text>
  <text x="102" y="238" font-size="20" fill="#1f77b4" font-weight="bold">260 M/s</text>
  <text x="200" y="237" font-size="13" fill="#555555">写 / 75.7 M/s RMW</text>

  <!-- Card Core 4 box -->
  <rect x="416" y="186" width="260" height="68" rx="6" fill="#f2f4f7" stroke="#555555" stroke-width="1.5"/>
  <text x="434" y="212" font-size="14" fill="#222222" font-weight="bold">卡核 4 · L1D / L2 (64 B)</text>
  <text x="434" y="238" font-size="20" fill="#1f77b4" font-weight="bold">260 M/s</text>
  <text x="532" y="237" font-size="13" fill="#555555">写 / 75.7 M/s RMW</text>
</svg>
