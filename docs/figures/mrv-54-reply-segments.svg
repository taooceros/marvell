<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="100%" height="100%" fill="white"/>

  <!-- Column headers: 4 reply segments (64 KiB each), 4 slots shown per segment -->
  <text x="232" y="34" font-size="15" text-anchor="middle" fill="#666">段 0</text>
  <text x="382" y="34" font-size="15" text-anchor="middle" fill="#666">段 1 (+64 KiB)</text>
  <text x="532" y="34" font-size="15" text-anchor="middle" fill="#666">段 2 (+128 KiB)</text>
  <text x="682" y="34" font-size="15" text-anchor="middle" fill="#666">段 3 (+192 KiB)</text>
  <text x="790" y="34" font-size="15" text-anchor="middle" fill="#666">ItoM / 条</text>

  <!-- Row 1: Contiguous per-core segment (G1 base, G3 blocks-contig) -->
  <text x="148" y="92" font-size="17" text-anchor="end" fill="#333">本段连续</text>

  <!-- Seg 0: core 0 -->
  <g transform="translate(168, 60)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
  </g>

  <!-- Seg 1: core 1 -->
  <g transform="translate(318, 60)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
  </g>

  <!-- Seg 2: core 2 -->
  <g transform="translate(468, 60)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
  </g>

  <!-- Seg 3: core 3 -->
  <g transform="translate(618, 60)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
  </g>

  <text x="790" y="92" font-size="25" font-weight="bold" text-anchor="middle" fill="#333">1.00</text>

  <!-- Row 2: Interleaved across 2 segments (G2 blocks-tag, G4 base-interleaved) -->
  <text x="148" y="182" font-size="17" text-anchor="end" fill="#333">跨段交错</text>

  <!-- Seg 0: 0, 2, 0, 2 -->
  <g transform="translate(168, 150)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#d62728" stroke-width="2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#d62728" stroke-width="2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
  </g>

  <!-- Seg 1: 0, 2, 0, 2 -->
  <g transform="translate(318, 150)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#d62728" stroke-width="2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#ffffff" stroke="#d62728" stroke-width="2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#222">0</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#bdbdbd" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#222">2</text>
  </g>

  <!-- Curved jump arrows for core 0 alternating between Seg 0 and Seg 1 -->
  <path d="M 183 146 Q 258 118 333 146" fill="none" stroke="#d62728" stroke-width="1.8"/>
  <polygon points="333,146 325,141 328,148" fill="#d62728"/>
  <path d="M 333 200 Q 282 226 247 200" fill="none" stroke="#d62728" stroke-width="1.8" stroke-dasharray="4,3"/>
  <polygon points="247,200 255,205 252,198" fill="#d62728"/>

  <!-- Seg 2: 1, 3, 1, 3 -->
  <g transform="translate(468, 150)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
  </g>

  <!-- Seg 3: 1, 3, 1, 3 -->
  <g transform="translate(618, 150)">
    <rect x="0" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="15" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
    <rect x="32" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="47" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
    <rect x="64" y="0" width="30" height="46" rx="3" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
    <text x="79" y="29" font-size="16" text-anchor="middle" fill="#222">1</text>
    <rect x="96" y="0" width="30" height="46" rx="3" fill="#7a7a7a" stroke="#555" stroke-width="1.2"/>
    <text x="111" y="29" font-size="16" text-anchor="middle" fill="#fff">3</text>
  </g>

  <text x="790" y="182" font-size="25" font-weight="bold" text-anchor="middle" fill="#d62728">1.00</text>

  <!-- Bottom zoom: 1 cell = 4x16B STP = 64B = 1 line write -->
  <g transform="translate(168, 250)">
    <text x="-20" y="26" font-size="16" text-anchor="end" fill="#555">单格 64 B</text>
    <rect x="0" y="0" width="248" height="38" rx="4" fill="#f7f7f7" stroke="#d62728" stroke-width="2"/>
    <line x1="62" y1="0" x2="62" y2="38" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="124" y1="0" x2="124" y2="38" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="186" y1="0" x2="186" y2="38" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="31" y="24" font-size="13" text-anchor="middle" fill="#444">STP 16 B</text>
    <text x="93" y="24" font-size="13" text-anchor="middle" fill="#444">STP 16 B</text>
    <text x="155" y="24" font-size="13" text-anchor="middle" fill="#444">STP 16 B</text>
    <text x="217" y="24" font-size="13" text-anchor="middle" fill="#444">STP 16 B</text>
    <text x="272" y="25" font-size="17" font-weight="bold" fill="#d62728">= 1 × 64 B 整行写</text>
  </g>
</svg>
