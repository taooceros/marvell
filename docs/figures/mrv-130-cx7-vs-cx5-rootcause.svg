<svg xmlns="http://www.w3.org/2000/svg" width="980" height="456" viewBox="0 0 980 456">
  <defs>
    <style>
      .t-head { font-family: "Noto Sans CJK SC", "PingFang SC", "Inter", sans-serif; font-size: 13px; font-weight: 600; fill: #6B7280; letter-spacing: 0.5px; }
      .t-row  { font-family: "Noto Sans CJK SC", "PingFang SC", "Inter", sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .t-box  { font-family: "Noto Sans CJK SC", "PingFang SC", "Inter", sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .t-sub  { font-family: "Noto Sans CJK SC", "PingFang SC", "Inter", sans-serif; font-size: 12px; font-weight: 500; fill: #6B7280; }
      .t-big  { font-family: "Noto Sans CJK SC", "PingFang SC", "Inter", sans-serif; font-size: 19px; font-weight: 800; fill: #111827; }
      .t-bad  { font-family: "Noto Sans CJK SC", "PingFang SC", "Inter", sans-serif; font-size: 17px; font-weight: 800; fill: #DC2626; }
      .t-bsub { font-family: "Noto Sans CJK SC", "PingFang SC", "Inter", sans-serif; font-size: 12px; font-weight: 600; fill: #DC2626; }
      .t-mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 600; fill: #4B5563; }
      .t-mbad { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #DC2626; }
    </style>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6B7280"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="456" fill="#FFFFFF"/>

  <!-- Column headers -->
  <text x="148" y="34" text-anchor="middle" class="t-head">CN106</text>
  <text x="382" y="34" text-anchor="middle" class="t-head">线缆</text>
  <text x="610" y="34" text-anchor="middle" class="t-head">mercury 网卡</text>
  <text x="840" y="34" text-anchor="middle" class="t-head">结果</text>
  <line x1="36" y1="46" x2="944" y2="46" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= ROW 1: 2025 CX7 ================= -->
  <text x="40" y="76" class="t-row">2025 · 历史互通</text>

  <rect x="56" y="88" width="184" height="68" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="148" y="117" text-anchor="middle" class="t-box">CN106 eth0</text>
  <text x="148" y="140" text-anchor="middle" class="t-mono">ecp_bl1 0C.19.07</text>

  <line x1="250" y1="122" x2="284" y2="122" stroke="#6B7280" stroke-width="2" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>

  <rect x="294" y="90" width="176" height="64" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="382" y="118" text-anchor="middle" class="t-box">2025 原线缆</text>
  <text x="382" y="140" text-anchor="middle" class="t-sub">CX7 兼容 5W / 2m 200G</text>

  <line x1="480" y1="122" x2="514" y2="122" stroke="#6B7280" stroke-width="2" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>

  <rect x="524" y="88" width="172" height="68" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="610" y="117" text-anchor="middle" class="t-box">ConnectX-7</text>
  <text x="610" y="140" text-anchor="middle" class="t-sub">AN ON · 支持 50G PAM4</text>

  <line x1="704" y1="122" x2="736" y2="122" stroke="#6B7280" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="744" y="90" width="192" height="64" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
  <text x="840" y="121" text-anchor="middle" class="t-big">100G UP</text>
  <text x="840" y="142" text-anchor="middle" class="t-sub">日志亦曾起 50G</text>

  <line x1="36" y1="178" x2="944" y2="178" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- ================= ROW 2: 2026 CX5 + AN ON ================= -->
  <text x="40" y="208" class="t-row">2026 · CX5 自协商</text>

  <rect x="56" y="220" width="184" height="68" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="148" y="249" text-anchor="middle" class="t-box">100G / 40G-CR4</text>
  <text x="148" y="272" text-anchor="middle" class="t-mono">ecp_bl1 同版 · CL73</text>

  <line x1="250" y1="254" x2="284" y2="254" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3" marker-start="url(#arr-r)" marker-end="url(#arr-r)"/>

  <rect x="294" y="222" width="176" height="64" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="382" y="250" text-anchor="middle" class="t-box">3m 30AWG DAC</text>
  <text x="382" y="272" text-anchor="middle" class="t-sub">CL73 仅 312.5M (&lt;2 dB)</text>

  <line x1="480" y1="254" x2="514" y2="254" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3" marker-start="url(#arr-r)" marker-end="url(#arr-r)"/>

  <rect x="524" y="220" width="172" height="68" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="610" y="249" text-anchor="middle" class="t-box">ConnectX-5</text>
  <text x="610" y="272" text-anchor="middle" class="t-sub">AN ON · 仅 4×25G NRZ</text>

  <line x1="704" y1="254" x2="736" y2="254" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-r)"/>

  <rect x="744" y="220" width="192" height="68" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="840" y="250" text-anchor="middle" class="t-bad">FIX_REVERSALS</text>
  <text x="840" y="273" text-anchor="middle" class="t-bsub">40G (11 dB) 同卡死</text>

  <line x1="36" y1="310" x2="944" y2="310" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- ================= ROW 3: 2026 CX5 + FORCE 100G ================= -->
  <text x="40" y="340" class="t-row">2026 · CX5 强配 100G</text>

  <rect x="56" y="352" width="184" height="80" rx="8" fill="#F9FAFB" stroke="#DC2626" stroke-width="1.5"/>
  <text x="148" y="379" text-anchor="middle" class="t-box">CAUI-4_C2C + RS</text>
  <text x="148" y="401" text-anchor="middle" class="t-mbad">TX 默认 63 / 0 / 0</text>
  <text x="148" y="421" text-anchor="middle" class="t-sub">无 CL72 均衡</text>

  <line x1="246" y1="378" x2="286" y2="378" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-r)"/>
  <line x1="288" y1="406" x2="248" y2="406" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-r)"/>

  <rect x="294" y="356" width="176" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="382" y="388" text-anchor="middle" class="t-bad">19 dB @ 12.9G</text>
  <text x="382" y="412" text-anchor="middle" class="t-bsub">3m 30AWG · CA-L 悬崖</text>

  <line x1="476" y1="378" x2="516" y2="378" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-r)"/>
  <line x1="518" y1="406" x2="478" y2="406" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-r)"/>

  <rect x="524" y="352" width="172" height="80" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="610" y="379" text-anchor="middle" class="t-box">ConnectX-5</text>
  <text x="610" y="401" text-anchor="middle" class="t-mono">FORCE-100G + RS</text>
  <text x="610" y="421" text-anchor="middle" class="t-sub">无 CL72 均衡</text>

  <line x1="704" y1="392" x2="736" y2="392" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-r)"/>

  <rect x="744" y="352" width="192" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="840" y="380" text-anchor="middle" class="t-bad">12k/s 不可纠</text>
  <text x="840" y="402" text-anchor="middle" class="t-bsub">CX5→CN106 Hi-BER</text>
  <text x="840" y="421" text-anchor="middle" class="t-sub">CN106→CX5 无锁 (Op 36)</text>
</svg>
