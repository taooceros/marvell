<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="920" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- ==================== TOP ROW: NO PAUSE (FRONTIER CONTENTION) ==================== -->
  <g transform="translate(40, 36)">
    <text x="0" y="28" font-size="16" font-weight="700" fill="#334155">不停</text>
    <text x="0" y="50" font-size="13" fill="#64748b">19 格/轮</text>

    <!-- Host MOVDIR64B arrow into frontier -->
    <text x="155" y="16" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">主机 MOVDIR64B</text>
    <line x1="110" y1="26" x2="200" y2="26" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-grey)"/>

    <!-- Request Ring cells -->
    <g transform="translate(220, 4)">
      <!-- Already taken cells -->
      <rect x="0"   y="0" width="44" height="44" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="50"  y="0" width="44" height="44" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="100" y="0" width="44" height="44" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="72" y="64" font-size="12" fill="#94a3b8" text-anchor="middle">已取格</text>

      <!-- Queued cells -->
      <rect x="150" y="0" width="44" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="200" y="0" width="44" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Frontier cell (contested!) -->
      <rect x="250" y="-4" width="52" height="52" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
      <text x="276" y="27" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">前沿</text>

      <!-- Empty cells ahead -->
      <rect x="310" y="0" width="44" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
      <rect x="360" y="0" width="44" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>

      <!-- PCIe write landing on frontier -->
      <path d="M -12 -14 Q 130 -30 270 -8" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-grey)"/>
      <text x="130" y="-28" font-size="12" fill="#475569" text-anchor="middle">PCIe 写</text>

      <!-- Card cores spinning on the exact same frontier cell -->
      <path d="M 276 82 L 276 54" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-grey)"/>
      <rect x="220" y="84" width="112" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="276" y="105" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">卡 2 核紧盯</text>
    </g>

    <!-- Result number -->
    <g transform="translate(690, 6)">
      <text x="0" y="34" font-size="38" font-weight="800" fill="#475569">129</text>
      <text x="86" y="34" font-size="16" font-weight="600" fill="#64748b">M/s</text>
      <text x="0" y="58" font-size="13" fill="#64748b">30.3 周期/格</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="40" y1="186" x2="880" y2="186" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== BOTTOM ROW: PAUSE 3 us (FRONTIER UNCONTESTED) ==================== -->
  <g transform="translate(40, 224)">
    <text x="0" y="28" font-size="16" font-weight="700" fill="#0f766e">停 3 µs</text>
    <text x="0" y="50" font-size="13" fill="#0d9488">31.5 格/轮</text>

    <!-- Host MOVDIR64B arrow -->
    <text x="155" y="16" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle">主机 MOVDIR64B</text>
    <line x1="110" y1="26" x2="200" y2="26" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr-accent)"/>

    <!-- Request Ring cells -->
    <g transform="translate(220, 4)">
      <!-- Already taken cells -->
      <rect x="0"   y="0" width="44" height="44" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="50"  y="0" width="44" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <text x="47" y="64" font-size="12" fill="#64748b" text-anchor="middle">已取格</text>

      <!-- Batch of 32 accumulating undisturbed -->
      <rect x="100" y="0" width="44" height="44" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="150" y="0" width="44" height="44" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="200" y="0" width="44" height="44" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="250" y="0" width="44" height="44" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>

      <!-- Uncontested Frontier cell -->
      <rect x="300" y="-4" width="52" height="52" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
      <text x="326" y="27" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">前沿</text>

      <!-- Empty cell ahead -->
      <rect x="360" y="0" width="44" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>

      <!-- PCIe write landing freely on frontier -->
      <path d="M -12 -14 Q 155 -30 320 -8" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr-accent)"/>
      <text x="155" y="-28" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">PCIe 写（无争用）</text>

      <!-- Card cores stepped back away from frontier -->
      <path d="M 72 82 L 72 50" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>
      <rect x="0" y="84" width="210" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="105" y="105" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">卡 2 核：空转 / 私有行 / 已取格</text>
    </g>

    <!-- Result number -->
    <g transform="translate(690, 6)">
      <text x="0" y="34" font-size="38" font-weight="800" fill="#0d9488">162</text>
      <text x="86" y="34" font-size="16" font-weight="700" fill="#0f766e">M/s</text>
      <text x="0" y="58" font-size="13" font-weight="600" fill="#0f766e">24.1 周期/格</text>
    </g>
  </g>
</svg>
