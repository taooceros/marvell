<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430">
  <rect width="920" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <style>
      .t-sans { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
    </style>
  </defs>

  <!-- Left panel: ROC_NIX_TM_DEFAULT -->
  <rect x="24" y="22" width="424" height="386" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="236" y="52" text-anchor="middle" class="t-sans" font-size="16" font-weight="bold" fill="#334155">默认单 SMQ[0]</text>
  <text x="236" y="72" text-anchor="middle" class="t-sans" font-size="12" fill="#64748b">ROC_NIX_TM_DEFAULT（C = 8）</text>

  <!-- 8 SQ boxes (left) -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.2">
    <rect x="44" y="96" width="42" height="28" rx="5"/>
    <rect x="92" y="96" width="42" height="28" rx="5"/>
    <rect x="140" y="96" width="42" height="28" rx="5"/>
    <rect x="188" y="96" width="42" height="28" rx="5"/>
    <rect x="236" y="96" width="42" height="28" rx="5"/>
    <rect x="284" y="96" width="42" height="28" rx="5"/>
    <rect x="332" y="96" width="42" height="28" rx="5"/>
    <rect x="380" y="96" width="42" height="28" rx="5"/>
  </g>
  <g class="t-sans" font-size="11" fill="#334155" text-anchor="middle">
    <text x="65" y="114">SQ0</text>
    <text x="113" y="114">SQ1</text>
    <text x="161" y="114">SQ2</text>
    <text x="209" y="114">SQ3</text>
    <text x="257" y="114">SQ4</text>
    <text x="305" y="114">SQ5</text>
    <text x="353" y="114">SQ6</text>
    <text x="401" y="114">SQ7</text>
