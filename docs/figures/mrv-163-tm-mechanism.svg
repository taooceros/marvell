  <text x="684" y="272" text-anchor="middle" class="t-sans" font-size="13" font-weight="bold" fill="#1e3a8a">TL4[0] → TL1[0] → 100G eth0</text>
  <text x="684" y="289" text-anchor="middle" class="t-sans" font-size="11" font-weight="bold" fill="#2563eb">撞端口硬顶 100.0 Mpps（10.0 拍/包）</text>

  <!-- Result callout (right) -->
  <line x1="684" y1="296" x2="684" y2="326" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-b)"/>
  <text x="684" y="362" text-anchor="middle" class="t-sans" font-size="32" font-weight="bold" fill="#2563eb">99.6 Mpps</text>
  <text x="684" y="388" text-anchor="middle" class="t-sans" font-size="13" font-weight="bold" fill="#1d4ed8">+21.4% 零回落 · 止于 100.0M 硬顶</text>
</svg>
