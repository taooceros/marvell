  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arr-g)">
    <line x1="65" y1="124" x2="188" y2="168"/>
    <line x1="113" y1="124" x2="202" y2="168"/>
    <line x1="161" y1="124" x2="216" y2="168"/>
    <line x1="209" y1="124" x2="229" y2="168"/>
    <line x1="257" y1="124" x2="243" y2="168"/>
    <line x1="305" y1="124" x2="256" y2="168"/>
    <line x1="353" y1="124" x2="270" y2="168"/>
    <line x1="401" y1="124" x2="284" y2="168"/>
  </g>

