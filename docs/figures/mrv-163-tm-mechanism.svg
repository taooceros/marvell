  <rect x="96" y="252" width="280" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="236" y="272" text-anchor="middle" class="t-sans" font-size="13" font-weight="bold" fill="#334155">TL4[0] → TL1[0] → 100G eth0</text>
  <text x="236" y="289" text-anchor="middle" class="t-sans" font-size="11" fill="#64748b">端口硬顶 100.0 Mpps（sclk 1000 MHz）</text>

  <!-- Result callout (left) -->
  <line x1="236" y1="296" x2="236" y2="326" stroke="#64748b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="236" y="362" text-anchor="middle" class="t-sans" font-size="32" font-weight="bold" fill="#475569">82.1 Mpps</text>
  <text x="236" y="388" text-anchor="middle" class="t-sans" font-size="13" fill="#64748b">较 C=4 回落 −17.6%</text>

  <!-- Right panel: ROC_NIX_TM_RLIMIT -->
  <rect x="472" y="22" width="424" height="386" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="684" y="52" text-anchor="middle" class="t-sans" font-size="16" font-weight="bold" fill="#1d4ed8">每队列独立 SMQ</text>
  <text x="684" y="72" text-anchor="middle" class="t-sans" font-size="12" fill="#2563eb">ROC_NIX_TM_RLIMIT（C = 8）</text>

  <!-- 8 SQ boxes (right) -->
  <g fill="#ffffff" stroke="#93c5fd" stroke-width="1.3">
    <rect x="492" y="96" width="42" height="28" rx="5"/>
    <rect x="540" y="96" width="42" height="28" rx="5"/>
    <rect x="588" y="96" width="42" height="28" rx="5"/>
    <rect x="636" y="96" width="42" height="28" rx="5"/>
    <rect x="684" y="96" width="42" height="28" rx="5"/>
    <rect x="732" y="96" width="42" height="28" rx="5"/>
    <rect x="780" y="96" width="42" height="28" rx="5"/>
    <rect x="828" y="96" width="42" height="28" rx="5"/>
  </g>
  <g class="t-sans" font-size="11" fill="#1e293b" text-anchor="middle">
    <text x="513" y="114">SQ0</text>
    <text x="561" y="114">SQ1</text>
    <text x="609" y="114">SQ2</text>
    <text x="657" y="114">SQ3</text>
    <text x="705" y="114">SQ4</text>
    <text x="753" y="114">SQ5</text>
    <text x="801" y="114">SQ6</text>
    <text x="849" y="114">SQ7</text>
  </g>

