  <g stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arr-b)">
    <line x1="513" y1="124" x2="513" y2="168"/>
    <line x1="561" y1="124" x2="561" y2="168"/>
    <line x1="609" y1="124" x2="609" y2="168"/>
    <line x1="657" y1="124" x2="657" y2="168"/>
    <line x1="705" y1="124" x2="705" y2="168"/>
    <line x1="753" y1="124" x2="753" y2="168"/>
    <line x1="801" y1="124" x2="801" y2="168"/>
    <line x1="849" y1="124" x2="849" y2="168"/>
  </g>

  <!-- 8 dedicated SMQ boxes -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.4">
    <rect x="492" y="172" width="42" height="44" rx="6"/>
    <rect x="540" y="172" width="42" height="44" rx="6"/>
    <rect x="588" y="172" width="42" height="44" rx="6"/>
    <rect x="636" y="172" width="42" height="44" rx="6"/>
    <rect x="684" y="172" width="42" height="44" rx="6"/>
    <rect x="732" y="172" width="42" height="44" rx="6"/>
    <rect x="780" y="172" width="42" height="44" rx="6"/>
    <rect x="828" y="172" width="42" height="44" rx="6"/>
  </g>
  <g class="t-sans" font-size="10.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
    <text x="513" y="191">SMQ</text><text x="513" y="206">0</text>
    <text x="561" y="191">SMQ</text><text x="561" y="206">9</text>
    <text x="609" y="191">SMQ</text><text x="609" y="206">10</text>
    <text x="657" y="191">SMQ</text><text x="657" y="206">11</text>
    <text x="705" y="191">SMQ</text><text x="705" y="206">12</text>
    <text x="753" y="191">SMQ</text><text x="753" y="206">13</text>
    <text x="801" y="191">SMQ</text><text x="801" y="206">14</text>
    <text x="849" y="191">SMQ</text><text x="849" y="206">15</text>
  </g>

  <!-- Converging arrows SMQ -> TL4 -->
  <g stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arr-b)">
    <line x1="513" y1="216" x2="610" y2="249"/>
    <line x1="561" y1="216" x2="631" y2="249"/>
    <line x1="609" y1="216" x2="652" y2="249"/>
    <line x1="657" y1="216" x2="673" y2="249"/>
    <line x1="705" y1="216" x2="695" y2="249"/>
    <line x1="753" y1="216" x2="716" y2="249"/>
    <line x1="801" y1="216" x2="737" y2="249"/>
    <line x1="849" y1="216" x2="758" y2="249"/>
