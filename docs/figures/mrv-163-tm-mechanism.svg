  <rect x="148" y="172" width="176" height="44" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="236" y="192" text-anchor="middle" class="t-sans" font-size="14" font-weight="bold" fill="#1e293b">唯一 SMQ[0]</text>
  <text x="236" y="209" text-anchor="middle" class="t-sans" font-size="11" fill="#475569">8 队列挤单桶争用</text>

  <!-- Arrow to TL4..TL1 -->
  <line x1="236" y1="216" x2="236" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arr-g)"/>

