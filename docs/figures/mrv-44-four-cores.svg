<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-44: how the 4 card cores split the closed loop (write-combining replies).
       Card core i (lcore 3+i) takes the request cells with (seq - 1) mod 4 = i from the one shared
       request ring (card memory behind BAR4 slot 15) and stores each reply through its own PEM0
       outbound region 255 - i into sub-ring i (1024 cells) of the host reply ring; the one host core
       takes the replies in sequence order. Code: testbed/crates/testbed/src/inline.rs,
       bin/inline_reflector.rs, bin/inline_pingpong.rs. Explanations live in the issue text. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="white"/>

  <!-- headers -->
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">卡 4 核怎么分工</text>
  <text x="30" y="68" font-size="14" fill="#64748b">闭环，主机 1 核，写合并回程；红 = 卡核 1 的那份</text>

  <!-- lanes -->
  <g fill="#f1f5f9">
    <rect x="30" y="92" width="900" height="120" rx="12"/>
    <rect x="30" y="252" width="900" height="140" rx="12"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#64748b">
    <text x="52" y="158">主机</text>
    <text x="52" y="328">卡</text>
  </g>
  <text x="52" y="237" font-size="13" fill="#94a3b8">PCIe</text>

  <!-- host: the one host core -->
  <rect x="128" y="126" width="124" height="52" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="158" font-size="16" fill="#1e293b" text-anchor="middle">核 40</text>

  <!-- host memory: the reply ring, one sub-ring per card core -->
  <text x="560" y="122" font-size="14" fill="#64748b">回复环</text>
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="560" y="132" width="80" height="40" rx="6"/>
    <rect x="732" y="132" width="80" height="40" rx="6"/>
    <rect x="818" y="132" width="80" height="40" rx="6"/>
  </g>
  <rect x="646" y="132" width="80" height="40" rx="6" fill="#dc2626"/>
  <g font-size="16" text-anchor="middle" fill="#64748b">
    <text x="600" y="158">0</text>
    <text x="772" y="158">2</text>
    <text x="858" y="158">3</text>
  </g>
  <text x="686" y="158" font-size="16" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="898" y="122" font-size="13" fill="#94a3b8" text-anchor="end">每段 1024 格</text>

  <!-- the host takes replies in sequence order: sub-ring 0, 1, 2, 3, 0, ... -->
  <line x1="556" y1="152" x2="256" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#head)"/>
  <text x="406" y="142" font-size="13" fill="#94a3b8" text-anchor="middle">按序号</text>

  <!-- requests: MOVDIR64B into the shared ring in card memory -->
  <line x1="190" y1="178" x2="190" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#head)"/>
  <text x="202" y="237" font-size="13" fill="#94a3b8">MOVDIR64B</text>

  <!-- card: the one request ring; the digit is the core that takes the cell -->
  <text x="128" y="284" font-size="14" fill="#64748b">请求环</text>
  <text x="464" y="286" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="end">(seq − 1) mod 4</text>
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="128" y="296" width="30" height="32" rx="4"/>
    <rect x="196" y="296" width="30" height="32" rx="4"/>
    <rect x="230" y="296" width="30" height="32" rx="4"/>
    <rect x="264" y="296" width="30" height="32" rx="4"/>
    <rect x="332" y="296" width="30" height="32" rx="4"/>
    <rect x="366" y="296" width="30" height="32" rx="4"/>
    <rect x="400" y="296" width="30" height="32" rx="4"/>
  </g>
  <g fill="#dc2626">
    <rect x="162" y="296" width="30" height="32" rx="4"/>
    <rect x="298" y="296" width="30" height="32" rx="4"/>
    <rect x="434" y="296" width="30" height="32" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#64748b">
    <text x="143" y="318">0</text>
    <text x="211" y="318">2</text>
    <text x="245" y="318">3</text>
    <text x="279" y="318">0</text>
    <text x="347" y="318">2</text>
    <text x="381" y="318">3</text>
    <text x="415" y="318">0</text>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    <text x="177" y="318">1</text>
    <text x="313" y="318">1</text>
    <text x="449" y="318">1</text>
  </g>
  <text x="482" y="318" font-size="16" fill="#94a3b8" text-anchor="middle">…</text>
  <text x="128" y="354" font-size="13" fill="#94a3b8">共用</text>

  <!-- card: the four cores, each under its own sub-ring -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="560" y="292" width="80" height="40" rx="8"/>
    <rect x="732" y="292" width="80" height="40" rx="8"/>
    <rect x="818" y="292" width="80" height="40" rx="8"/>
  </g>
  <rect x="646" y="292" width="80" height="40" rx="8" fill="white" stroke="#dc2626" stroke-width="2"/>
  <g font-size="15" text-anchor="middle" fill="#1e293b">
    <text x="600" y="318">核 0</text>
    <text x="772" y="318">核 2</text>
    <text x="858" y="318">核 3</text>
  </g>
  <text x="686" y="318" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">核 1</text>
  <text x="898" y="354" font-size="13" fill="#94a3b8" text-anchor="end">lcore 3–6</text>

  <!-- replies: each core through its own PEM0 outbound region into its own sub-ring -->
  <g stroke="#64748b" stroke-width="2" marker-end="url(#head)">
    <line x1="600" y1="290" x2="600" y2="176"/>
    <line x1="772" y1="290" x2="772" y2="176"/>
    <line x1="858" y1="290" x2="858" y2="176"/>
  </g>
  <line x1="686" y1="290" x2="686" y2="176" stroke="#dc2626" stroke-width="2.5" marker-end="url(#head-red)"/>
  <g font-size="12" fill="#94a3b8">
    <text x="606" y="236">区 255</text>
    <text x="778" y="236">253</text>
    <text x="864" y="236">252</text>
  </g>
  <text x="692" y="236" font-size="12" font-weight="bold" fill="#dc2626">254</text>
  <text x="548" y="236" font-size="13" fill="#94a3b8" text-anchor="end">各自回程</text>
</svg>
