<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sec { font-size: 13px; font-weight: 700; }
      .box-t { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .box-s { font-size: 11px; fill: #475569; }
      .big { font-size: 20px; font-weight: 700; }
      .num { font-size: 12px; font-weight: 700; }
      .sm { font-size: 11px; fill: #64748b; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Top row: Parallel MOVDIR64B pipeline (distinct 64B lines, no SFENCE) -->
  <rect x="20" y="20" width="920" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="20" y="20" width="6" height="200" rx="3" fill="#2563eb"/>
  <text x="40" y="47" class="sec" fill="#1d4ed8">并行入卡（不同 64 B 行 · 无 SFENCE）</text>
  <text x="920" y="48" text-anchor="end" class="big" fill="#2563eb">175.2 M/s · 11.21 GB/s</text>

  <!-- Stage 1: Host Core(s) -->
  <rect x="40" y="68" width="142" height="128" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="111" y="92" text-anchor="middle" class="box-t">主机核 (1–4 核)</text>
  <text x="111" y="112" text-anchor="middle" class="box-s">MOVDIR64B</text>
  <rect x="56" y="124" width="110" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="111" y="140" text-anchor="middle" class="num" fill="#1d4ed8">写缓冲 114 槽</text>
  <text x="111" y="176" text-anchor="middle" class="sm">静态模板单核打满</text>

  <!-- Multi-arrows Core -> CHA -->
  <line x1="184" y1="106" x2="226" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="184" y1="132" x2="226" y2="132" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="184" y1="158" x2="226" y2="158" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Stage 2: 32 Host CHAs -->
  <rect x="232" y="68" width="176" height="128" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="320" y="92" text-anchor="middle" class="box-t" fill="#1e3a8a">主机 32 × CHA TOR</text>
  <text x="320" y="124" text-anchor="middle" class="big" fill="#2563eb">267–352 条</text>
  <text x="320" y="146" text-anchor="middle" class="num" fill="#1e40af">并行在途队列</text>
  <text x="320" y="176" text-anchor="middle" class="sm">32 CHA 均匀分摊</text>

  <!-- Multi-arrows CHA -> IRP/IIO -->
  <line x1="410" y1="112" x2="450" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="410" y1="134" x2="450" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="410" y1="156" x2="450" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: IRP1 / IIO1 -->
  <rect x="456" y="68" width="140" height="128" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="526" y="92" text-anchor="middle" class="box-t">主机 IRP1 / IIO1</text>
  <text x="526" y="124" text-anchor="middle" class="big" fill="#0f172a">7.65 条</text>
  <text x="526" y="146" text-anchor="middle" class="box-s">出站队列饱和</text>
  <text x="526" y="176" text-anchor="middle" class="sm">1.00 GHz 时钟</text>

  <!-- PCIe Gen5 x4 Link -->
  <line x1="598" y1="132" x2="720" y2="132" stroke="#2563eb" stroke-width="5" marker-end="url(#arr-blue)"/>
  <rect x="608" y="88" width="102" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="659" y="108" text-anchor="middle" class="num" fill="#0f172a">PCIe Gen5 ×4</text>
  <text x="659" y="158" text-anchor="middle" class="num" fill="#2563eb">97.9% 线速</text>
  <text x="659" y="176" text-anchor="middle" class="sm">上限 179.0 M/s</text>

  <!-- Stage 4: Card PEM0 / TAD -->
  <rect x="728" y="68" width="192" height="128" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="824" y="92" text-anchor="middle" class="box-t">卡 PEM0 → TAD (L3)</text>
  <text x="824" y="122" text-anchor="middle" class="big" fill="#0f172a">100% 命中</text>
  <text x="824" y="146" text-anchor="middle" class="box-s">DRAM 溢出 = 0 · 重试 = 0</text>
  <text x="824" y="176" text-anchor="middle" class="sm">校验错误 = 0</text>

  <!-- Bottom row: Serial degradation (SFENCE K=1 or same 64B line) -->
  <rect x="20" y="242" width="920" height="138" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="20" y="242" width="6" height="138" rx="3" fill="#64748b"/>
  <text x="40" y="269" class="sec" fill="#334155">退化为串行（每写 SFENCE 或重复写同 1 条 64 B 行）</text>
  <text x="920" y="270" text-anchor="end" class="big" fill="#475569">8.1–8.9 M/s · 0.52–0.57 GB/s</text>

  <!-- Serial Stage 1 -->
  <rect x="40" y="288" width="142" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="111" y="314" text-anchor="middle" class="box-t">单核 cpu40</text>
  <text x="111" y="338" text-anchor="middle" class="box-s">SB 停顿 98%</text>

  <!-- Single thin arrow -->
  <line x1="184" y1="325" x2="226" y2="325" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-grey)"/>

  <!-- Serial Stage 2: 1 CHA / 1 in-flight -->
  <rect x="232" y="288" width="176" height="74" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="320" y="314" text-anchor="middle" class="box-t">CHA 仅 ~1 条在途</text>
  <text x="320" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">0.83–0.97 条 · 103–109 ns</text>

  <line x1="410" y1="325" x2="450" y2="325" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-grey)"/>

  <!-- Serial Stage 3 -->
  <rect x="456" y="288" width="140" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="526" y="314" text-anchor="middle" class="box-t">IRP1 / IIO1</text>
  <text x="526" y="338" text-anchor="middle" class="box-s">仅 0.15–0.17 条</text>

  <line x1="598" y1="325" x2="720" y2="325" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-grey)"/>
  <text x="659" y="314" text-anchor="middle" class="sm">链路空闲 95%</text>
  <text x="659" y="346" text-anchor="middle" class="sm">慢 20–22×</text>

  <!-- Serial Stage 4 -->
  <rect x="728" y="288" width="192" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="824" y="314" text-anchor="middle" class="box-t">卡 PEM0 → TAD</text>
  <text x="824" y="338" text-anchor="middle" class="box-s">逐条落盘 · 无积压</text>
</svg>
