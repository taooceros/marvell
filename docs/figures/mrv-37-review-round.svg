<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-37. Review round after every experiment: results -> check (small model) -> three reviewers in
       parallel -> the issue agent answers each point. A failed check goes back first.
       What each step looks at is in AGENTS.md ("Review round after every experiment"). -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="white"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">每次实验后的评审轮</text>

  <!-- stages -->
  <g fill="#f1f5f9">
    <rect x="30" y="70" width="190" height="230" rx="12"/>
    <rect x="240" y="70" width="190" height="230" rx="12"/>
    <rect x="450" y="70" width="190" height="230" rx="12"/>
    <rect x="660" y="70" width="190" height="230" rx="12"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">
    <text x="125" y="104">贴结果</text>
    <text x="335" y="104">检查</text>
    <text x="545" y="104">评审</text>
    <text x="755" y="104">逐条回复</text>
  </g>

  <!-- who -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="60" y="180" width="130" height="40" rx="10"/>
    <rect x="270" y="180" width="130" height="40" rx="10"/>
    <rect x="480" y="130" width="130" height="40" rx="10"/>
    <rect x="480" y="180" width="130" height="40" rx="10"/>
    <rect x="480" y="230" width="130" height="40" rx="10"/>
    <rect x="690" y="180" width="130" height="40" rx="10"/>
  </g>
  <g font-size="16" fill="#1e293b" text-anchor="middle">
    <text x="125" y="206">issue agent</text>
    <text x="335" y="206">Hydrogen</text>
    <text x="545" y="156">Carbon</text>
    <text x="545" y="206">Argon</text>
    <text x="545" y="256">Fable</text>
    <text x="755" y="206">issue agent</text>
  </g>

  <!-- flow -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#head)">
    <path d="M 190 200 H 268"/>
    <path d="M 400 200 H 478"/>
    <path d="M 440 200 V 150 H 478"/>
    <path d="M 440 200 V 250 H 478"/>
    <path d="M 610 200 H 688"/>
  </g>
  <path d="M 610 150 H 650 V 250 H 610" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- failed check: back to the issue agent -->
  <path d="M 335 220 C 335 282, 125 282, 125 223" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#head-red)"/>
  <text x="230" y="252" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">不过</text>
</svg>
