<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-45. The life of one ring cell: the host writes it, the card core finds it by polling, and the
       host learns that the cell may be written again either from the reply (closed loop) or by reading
       the card core's NEXT word (one-way stream). No doorbell, no interrupt.
       The checks, limits and code lines are in the MRV-45 answer. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="404" fill="white"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">一格什么时候可以再写</text>
  <text x="30" y="68" font-size="14" fill="#64748b">环 65533 格，W ≤ 4095</text>

  <!-- lanes -->
  <g fill="#f1f5f9">
    <rect x="30" y="92" width="900" height="120" rx="12"/>
    <rect x="30" y="252" width="900" height="120" rx="12"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#64748b">
    <text x="52" y="158">主机</text>
    <text x="52" y="318">卡</text>
  </g>

  <!-- stages -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="135" y="132" width="130" height="52" rx="10"/>
    <rect x="335" y="132" width="130" height="52" rx="10"/>
    <rect x="535" y="132" width="130" height="52" rx="10"/>
    <rect x="735" y="132" width="130" height="52" rx="10"/>
    <rect x="135" y="286" width="130" height="52" rx="10"/>
    <rect x="535" y="286" width="130" height="52" rx="10"/>
    <rect x="735" y="286" width="130" height="52" rx="10"/>
  </g>
  <g font-size="16" fill="#1e293b" text-anchor="middle">
    <text x="200" y="164">写一格</text>
    <text x="400" y="164">查额度</text>
    <text x="600" y="164">收回复</text>
    <text x="800" y="164">读 NEXT</text>
    <text x="200" y="318">轮询头尾</text>
    <text x="600" y="318">回复</text>
    <text x="800" y="318">记 NEXT</text>
  </g>

  <!-- flow -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#head)">
    <path d="M 200 184 V 284"/>
    <path d="M 265 312 H 533"/>
    <path d="M 665 312 H 733"/>
    <path d="M 535 158 H 467"/>
    <path d="M 335 158 H 267"/>
    <path d="M 800 132 V 112 H 400 V 130"/>
  </g>
  <text x="212" y="237" font-size="13" fill="#94a3b8">MOVDIR64B</text>

  <!-- how the host learns the cell is free again -->
  <line x1="600" y1="286" x2="600" y2="187" stroke="#dc2626" stroke-width="2" marker-end="url(#head-red)"/>
  <line x1="800" y1="286" x2="800" y2="187" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head-red)"/>
  <g font-size="16" font-weight="bold" fill="#dc2626">
    <text x="612" y="238">闭环</text>
    <text x="812" y="238">流</text>
  </g>
</svg>
