<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" width="1080" height="510">
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .row-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .row-title-red { font-size: 15px; font-weight: 700; fill: #b91c1c; }
      .row-sub { font-size: 12px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; rx: 8; }
      .box-dark { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.6; rx: 8; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 8; }
      .node-txt { font-size: 13px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .node-sub { font-size: 11px; fill: #64748b; text-anchor: middle; }
      .red-txt { font-size: 13px; font-weight: 700; fill: #991b1b; text-anchor: middle; }
      .red-sub { font-size: 11px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .big-ok { font-size: 26px; font-weight: 800; fill: #1e293b; text-anchor: middle; }
      .big-red { font-size: 25px; font-weight: 800; fill: #dc2626; text-anchor: middle; }
      .out-sub { font-size: 12px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .out-sub-red { font-size: 12px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      .sep { stroke: #e2e8f0; stroke-width: 1.2; }
      .line-gray { stroke: #64748b; stroke-width: 2.2; fill: none; }
      .line-red { stroke: #dc2626; stroke-width: 2.8; fill: none; }
      .tag-red { font-size: 11.5px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1.5 L9,5 L0,8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1.5 L9,5 L0,8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1080" height="510" fill="#ffffff"/>

  <!-- Title -->
  <text x="28" y="36" class="title">为什么会这样？同 CPU 内三条物理路径对比</text>

  <!-- Row separators -->
  <line x1="24" y1="194" x2="1056" y2="194" class="sep"/>
  <line x1="24" y1="348" x2="1056" y2="348" class="sep"/>
  <!-- Outcome column divider -->
  <line x1="912" y1="54" x2="912" y2="492" class="sep"/>

  <!-- ================= ROW 1: Normal MMIO ================= -->
  <text x="28" y="106" class="row-title">① 正常 MMIO</text>
  <text x="28" y="128" class="row-sub">1 核 175 Mpps</text>
  <text x="28" y="146" class="row-sub">或 8 核限速</text>

  <!-- Upper track: Sender -> CHA -> M2PCIe1 -> IRP1 -> NIC -->
  <rect x="176" y="64" width="90" height="44" class="box"/>
  <text x="221" y="91" class="node-txt">发送核</text>

  <line x1="266" y1="86" x2="300" y2="86" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="304" y="60" width="144" height="52" class="box"/>
  <text x="376" y="83" class="node-txt">片上中转 CHA</text>
  <text x="376" y="101" class="node-sub">19 槽 (很空)</text>

  <line x1="448" y1="86" x2="482" y2="86" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="486" y="60" width="122" height="52" class="box"/>
  <text x="547" y="83" class="node-txt">M2PCIe1</text>
  <text x="547" y="101" class="node-sub">非空 8%</text>

  <line x1="608" y1="86" x2="642" y2="86" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="646" y="60" width="108" height="52" class="box"/>
  <text x="700" y="83" class="node-txt">IRP1</text>
  <text x="700" y="101" class="node-sub">4.2 / ~8 槽</text>

  <line x1="754" y1="86" x2="788" y2="86" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="792" y="64" width="98" height="44" class="box-dark"/>
  <text x="841" y="91" class="node-txt">网卡 BAR4</text>

  <!-- Lower track: Neighbor -> L3 / DDR5 (completely isolated) -->
  <rect x="176" y="132" width="90" height="44" class="box"/>
  <text x="221" y="159" class="node-txt">邻居核</text>

  <line x1="266" y1="154" x2="358" y2="154" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="362" y="132" width="212" height="44" class="box-dark"/>
  <text x="468" y="159" class="node-txt">L3 缓存 / DDR5 主存</text>

  <!-- Outcome 1 -->
  <text x="992" y="118" class="big-ok">&lt; 1%</text>
  <text x="992" y="143" class="out-sub">各走各道</text>

  <!-- ================= ROW 2: Multi-core unpaced overload ================= -->
  <text x="28" y="258" class="row-title-red">② 多核无控超发</text>
  <text x="28" y="280" class="row-sub">4–8 核撞死</text>
  <text x="28" y="298" class="row-sub">175.5 Mpps 顶</text>

  <!-- Upper track with RED backpressure flowing RIGHT -> LEFT -->
  <rect x="176" y="216" width="90" height="44" class="box"/>
  <text x="221" y="243" class="node-txt">发送核 ×8</text>

  <line x1="266" y1="238" x2="300" y2="238" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="304" y="212" width="144" height="52" class="box-red"/>
  <text x="376" y="235" class="red-txt">片上中转 CHA</text>
  <text x="376" y="253" class="red-sub">654 槽 (堵满)</text>

  <!-- Backpressure arrow M2PCIe1 -> CHA -->
  <line x1="484" y1="238" x2="452" y2="238" class="line-red" marker-end="url(#arr-red)"/>
  <text x="467" y="226" class="tag-red">倒灌</text>

  <rect x="486" y="212" width="122" height="52" class="box-red"/>
  <text x="547" y="235" class="red-txt">M2PCIe1</text>
  <text x="547" y="253" class="red-sub">非空 99%</text>

  <!-- Backpressure arrow IRP1 -> M2PCIe1 -->
  <line x1="644" y1="238" x2="612" y2="238" class="line-red" marker-end="url(#arr-red)"/>
  <text x="627" y="226" class="tag-red">反压</text>

  <rect x="646" y="212" width="108" height="52" class="box-red"/>
  <text x="700" y="235" class="red-txt">IRP1</text>
  <text x="700" y="253" class="red-sub">7.6 / ~8 先满</text>

  <line x1="754" y1="238" x2="788" y2="238" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="792" y="216" width="98" height="44" class="box-dark"/>
  <text x="841" y="243" class="node-txt">PCIe 上限</text>

  <!-- Lower track blocked by vertical red spill from CHA -->
  <rect x="176" y="286" width="90" height="44" class="box"/>
  <text x="221" y="313" class="node-txt">邻居核</text>

  <line x1="266" y1="308" x2="358" y2="308" class="line-gray" marker-end="url(#arr-gray)"/>
  <!-- Red choke arrow from CHA down onto neighbor lane -->
  <line x1="340" y1="264" x2="340" y2="300" class="line-red" marker-end="url(#arr-red)"/>
  <text x="312" y="289" class="tag-red">饿死</text>

  <rect x="362" y="286" width="212" height="44" class="box-dark"/>
  <text x="468" y="313" class="node-txt">L3 缓存 / DDR5 主存</text>

  <!-- Outcome 2 -->
  <text x="992" y="270" class="big-red">-69.5%</text>
  <text x="992" y="296" class="out-sub-red">L3 尾延迟 20x</text>

  <!-- ================= ROW 3: Traditional Host-RAM DMA ================= -->
  <text x="28" y="414" class="row-title-red">③ 传统主存 DMA</text>
  <text x="28" y="436" class="row-sub">160 Mpps</text>
  <text x="28" y="454" class="row-sub">主存环 + 网卡拉</text>

  <rect x="176" y="370" width="90" height="44" class="box"/>
  <text x="221" y="397" class="node-txt">发送核</text>

  <rect x="176" y="436" width="90" height="44" class="box"/>
  <text x="221" y="463" class="node-txt">邻居核</text>

  <!-- Both merge into shared L3 / DDR5 -->
  <path d="M 266 392 L 326 392 L 326 416 L 358 416" class="line-red" marker-end="url(#arr-red)"/>
  <path d="M 266 458 L 326 458 L 326 436 L 358 436" class="line-gray" marker-end="url(#arr-gray)"/>

  <rect x="362" y="394" width="250" height="62" class="box-red"/>
  <text x="487" y="421" class="red-txt">L3 缓存 / DDR5 主存</text>
  <text x="487" y="441" class="red-sub">同抢缓存容量与内存通道</text>

  <line x1="612" y1="425" x2="714" y2="425" class="line-red" marker-end="url(#arr-red)"/>
  <text x="663" y="413" class="tag-red">DMA 读拉</text>

  <rect x="718" y="403" width="142" height="44" class="box-dark"/>
  <text x="789" y="430" class="node-txt">网卡 DPI 引擎</text>

  <!-- Outcome 3 -->
  <text x="992" y="422" class="big-red">-10%~-41%</text>
  <text x="992" y="448" class="out-sub-red">直抢缓存 / 内存</text>
</svg>
