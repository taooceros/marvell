<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; fill: #222; }
      .hdr { font-size: 15px; font-weight: 700; fill: #333; }
      .hdr-acc { font-size: 15px; font-weight: 700; fill: #1b6ca8; }
      .lbl { font-size: 12px; font-weight: 600; fill: #333; }
      .sub { font-size: 11px; fill: #666; }
      .big-grey { font-size: 26px; font-weight: 700; fill: #555; }
      .big-acc { font-size: 26px; font-weight: 700; fill: #1b6ca8; }
      .tag { font-size: 11px; font-weight: 700; fill: #fff; }
      .tag-dk { font-size: 11px; font-weight: 700; fill: #1b6ca8; }
    </style>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#777"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1b6ca8"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ================= TOP ROW: CONTROL A (SHARED WINDOW) ================= -->
  <rect x="24" y="20" width="912" height="184" rx="10" fill="#f7f7f8" stroke="#d4d7dc" stroke-width="1.2"/>
  <text x="44" y="46" class="hdr">A · 共享单窗（W = 32 / 64，阈值 1024 B，无 C_line）</text>

  <!-- Two Poisson streams -->
  <rect x="44" y="66" width="128" height="44" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="108" y="85" text-anchor="middle" class="lbl">小包 64 B</text>
  <text x="108" y="101" text-anchor="middle" class="sub">8 Mreq/s 泊松</text>

  <rect x="44" y="128" width="128" height="44" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="108" y="147" text-anchor="middle" class="lbl">大包 4 KiB KV</text>
  <text x="108" y="163" text-anchor="middle" class="sub">128 MiB 随机 64 页</text>

  <!-- Arrows into Shared Window -->
  <path d="M 172 88 L 222 108" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr-g)"/>
  <path d="M 172 150 L 222 132" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr-g)"/>

  <!-- Shared Credit Window Box -->
  <rect x="228" y="66" width="212" height="106" rx="8" fill="#eceef1" stroke="#666" stroke-width="1.6"/>
  <text x="334" y="88" text-anchor="middle" class="lbl">共享 FIFO 信用窗</text>
  <rect x="244" y="98" width="36" height="24" rx="3" fill="#fff" stroke="#888"/>
  <text x="262" y="114" text-anchor="middle" class="sub">小</text>
  <rect x="284" y="98" width="140" height="24" rx="3" fill="#6d737d"/>
  <text x="354" y="114" text-anchor="middle" class="tag">4 KiB 占满 80.5%</text>
  <text x="334" y="142" text-anchor="middle" class="sub">TX 准入 HoL 阻塞</text>
  <text x="334" y="159" text-anchor="middle" class="sub">单流 256 B×32 = 128 行 → 慢崖</text>

  <!-- Arrows to PCIe / Card -->
  <line x1="440" y1="119" x2="496" y2="119" stroke="#777" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>

  <!-- BAR4 + DPI Box -->
  <rect x="502" y="66" width="174" height="106" rx="8" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="589" y="92" text-anchor="middle" class="lbl">CN106 单卡核</text>
  <text x="589" y="114" text-anchor="middle" class="sub">BAR4 慢态 13.4 M 行/s</text>
  <text x="589" y="136" text-anchor="middle" class="sub">2 DPI VFs（18.6 GB/s）</text>
  <text x="589" y="158" text-anchor="middle" class="sub">1H + 1C + 零 SDP</text>

  <!-- Arrow to Metric -->
  <line x1="676" y1="119" x2="722" y2="119" stroke="#777" stroke-width="1.8" marker-end="url(#arr-g)"/>

  <!-- Key Failure Numbers -->
  <rect x="728" y="56" width="190" height="126" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="823" y="84" text-anchor="middle" class="sub">饱和混流 64 B tot p99</text>
  <text x="823" y="114" text-anchor="middle" class="big-grey">40.5 ms</text>
  <line x1="748" y1="128" x2="898" y2="128" stroke="#e2e5e9" stroke-width="1"/>
  <text x="823" y="148" text-anchor="middle" class="sub">单流 256 B W=32</text>
  <text x="823" y="170" text-anchor="middle" class="hdr">3.43 Mreq/s</text>

  <!-- ================= BOTTOM ROW: TREATMENT B (SPLIT DUAL CREDITS) ================= -->
  <rect x="24" y="224" width="912" height="196" rx="10" fill="#f3f8fc" stroke="#1b6ca8" stroke-width="1.8"/>
  <text x="44" y="250" class="hdr-acc">B · 拆分双信用窗（W_small = 32, C_line ≤ 32 | W_large = 32 | 阈值 512 B）</text>

  <!-- Small Lane (Top sub-track) -->
  <rect x="44" y="268" width="128" height="48" rx="6" fill="#fff" stroke="#1b6ca8" stroke-width="1.4"/>
  <text x="108" y="288" text-anchor="middle" class="lbl">小包 &lt; 512 B</text>
  <text x="108" y="305" text-anchor="middle" class="sub">独立泊松到达</text>

  <line x1="172" y1="292" x2="222" y2="292" stroke="#1b6ca8" stroke-width="2" marker-end="url(#arr-a)"/>

  <rect x="228" y="268" width="212" height="48" rx="6" fill="#1b6ca8"/>
  <text x="334" y="288" text-anchor="middle" class="tag">小包独立窗 W_small = 32</text>
  <text x="334" y="305" text-anchor="middle" class="tag">行上限 C_line ≤ 32（避慢崖）</text>

  <line x1="440" y1="292" x2="496" y2="292" stroke="#1b6ca8" stroke-width="2" marker-end="url(#arr-a)"/>

  <rect x="502" y="268" width="174" height="48" rx="6" fill="#fff" stroke="#1b6ca8" stroke-width="1.4"/>
  <text x="589" y="288" text-anchor="middle" class="tag-dk">OP_PUSH（直推 + WC）</text>
  <text x="589" y="305" text-anchor="middle" class="sub">与 DPI 路径解耦</text>

  <!-- Large Lane (Bottom sub-track) -->
  <rect x="44" y="346" width="128" height="48" rx="6" fill="#fff" stroke="#777" stroke-width="1.2"/>
  <text x="108" y="366" text-anchor="middle" class="lbl">大包 ≥ 512 B</text>
  <text x="108" y="383" text-anchor="middle" class="sub">128 MiB 随机 64 页</text>

  <line x1="172" y1="370" x2="222" y2="370" stroke="#777" stroke-width="1.8" marker-end="url(#arr-g)"/>

  <rect x="228" y="346" width="212" height="48" rx="6" fill="#fff" stroke="#777" stroke-width="1.4"/>
  <text x="334" y="366" text-anchor="middle" class="lbl">大包独立窗 W_large = 32</text>
  <text x="334" y="383" text-anchor="middle" class="sub">1 门铃行/包 · 不抢占小包</text>

  <line x1="440" y1="370" x2="496" y2="370" stroke="#777" stroke-width="1.8" marker-end="url(#arr-g)"/>

  <rect x="502" y="346" width="174" height="48" rx="6" fill="#fff" stroke="#777" stroke-width="1.2"/>
  <text x="589" y="366" text-anchor="middle" class="lbl">OP_DMA（2 DPI VFs）</text>
  <text x="589" y="383" text-anchor="middle" class="sub">18.93 GB/s · 64 页零退化</text>

  <!-- Decoupled separator -->
  <line x1="228" y1="331" x2="676" y2="331" stroke="#1b6ca8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Arrows to Result Box -->
  <path d="M 676 292 L 722 308" stroke="#1b6ca8" stroke-width="2" fill="none" marker-end="url(#arr-a)"/>
  <path d="M 676 370 L 722 354" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr-g)"/>

  <!-- Key Winning Numbers -->
  <rect x="728" y="264" width="190" height="136" rx="8" fill="#fff" stroke="#1b6ca8" stroke-width="1.8"/>
  <text x="823" y="290" text-anchor="middle" class="sub">饱和混流 64 B tot p99</text>
  <text x="823" y="320" text-anchor="middle" class="big-acc">2.75 µs</text>
  <text x="823" y="338" text-anchor="middle" class="tag-dk">↓ 14,701×（wire 1.84 µs）</text>
  <line x1="748" y1="349" x2="898" y2="349" stroke="#d5e6f3" stroke-width="1"/>
  <text x="823" y="369" text-anchor="middle" class="sub">单流 256 B W=32（C=32/48）</text>
  <text x="823" y="390" text-anchor="middle" class="hdr-acc">5.00 / 6.66 Mreq/s</text>
</svg>
