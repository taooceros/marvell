<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="980" height="410" fill="#ffffff"/>

  <!-- Outer Card: One Shared 4 MiB BAR4 Ring -->
  <rect x="24" y="20" width="932" height="370" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="48" y="54" font-size="18" font-weight="700" fill="#0f172a">同一块 4 MiB 卡内存（BAR4 Slot 15 请求环）</text>
  <text x="932" y="54" text-anchor="end" font-size="14" font-weight="700" fill="#475569">按 (seq − 1) % 4 交错分格 · 互不读同一 64 B 格</text>

  <!-- Host MOVDIR64B In-Flight Write Frontier Banner -->
  <rect x="242" y="72" width="536" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="510" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">主机 MOVDIR64B 写入最前沿（4 格 = 256 B，在途排队 ~45 条）</text>

  <!-- 128B Block Brackets (with clear vertical gap below y=106) -->
  <path d="M 250 140 L 250 130 L 502 130 L 502 140" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="376" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">同一 128 B 块（0..128 B）</text>

  <path d="M 518 140 L 518 130 L 770 130 L 770 140" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="644" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">下一 128 B 块（128..256 B）</text>

  <!-- Ring Cells Row (y=148..224) -->
  <!-- Consumed cells (left) -->
  <rect x="48" y="148" width="84" height="76" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="90" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">seq ≤ k−1</text>
  <text x="90" y="203" text-anchor="middle" font-size="11" fill="#64748b">已处理</text>

  <rect x="140" y="148" width="84" height="76" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="182" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">seq = k</text>
  <text x="182" y="203" text-anchor="middle" font-size="11" fill="#64748b">已处理</text>

  <!-- Frontier 4 Cells (242..778) -->
  <rect x="242" y="142" width="536" height="88" rx="8" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Cell k+1 (Core 0) -->
  <rect x="250" y="148" width="122" height="76" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="311" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">seq = k+1</text>
  <text x="311" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">独立 64 B 格</text>
  <text x="311" y="211" text-anchor="middle" font-size="11" fill="#64748b">偏移 +0 B</text>

  <!-- Cell k+2 (Core 1) -->
  <rect x="380" y="148" width="122" height="76" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="441" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">seq = k+2</text>
  <text x="441" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">独立 64 B 格</text>
  <text x="441" y="211" text-anchor="middle" font-size="11" fill="#64748b">偏移 +64 B</text>

  <!-- Cell k+3 (Core 2) -->
  <rect x="518" y="148" width="122" height="76" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="579" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">seq = k+3</text>
  <text x="579" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">独立 64 B 格</text>
  <text x="579" y="211" text-anchor="middle" font-size="11" fill="#64748b">偏移 +128 B</text>

  <!-- Cell k+4 (Core 3) -->
  <rect x="648" y="148" width="122" height="76" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="709" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">seq = k+4</text>
  <text x="709" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">独立 64 B 格</text>
  <text x="709" y="211" text-anchor="middle" font-size="11" fill="#64748b">偏移 +192 B</text>

  <!-- Future In-Flight Cells (right) -->
  <rect x="796" y="148" width="136" height="76" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="864" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">k+5 .. k+45</text>
  <text x="864" y="202" text-anchor="middle" font-size="11" fill="#dc2626">在途写 (~3 µs)</text>

  <!-- Upward Polling Arrows from 4 Card Cores -->
  <line x1="311" y1="268" x2="311" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="441" y1="268" x2="441" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="579" y1="268" x2="579" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="709" y1="268" x2="709" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- 4 Card Cores Boxes -->
  <rect x="250" y="270" width="122" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="311" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">卡核 0 (lcore 3)</text>
  <text x="311" y="315" text-anchor="middle" font-size="11" fill="#64748b">只读 seq = 1, 5, 9…</text>

  <rect x="380" y="270" width="122" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="441" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">卡核 1 (lcore 4)</text>
  <text x="441" y="315" text-anchor="middle" font-size="11" fill="#64748b">只读 seq = 2, 6, 10…</text>

  <rect x="518" y="270" width="122" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="579" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">卡核 2 (lcore 5)</text>
  <text x="579" y="315" text-anchor="middle" font-size="11" fill="#64748b">只读 seq = 3, 7, 11…</text>

  <rect x="648" y="270" width="122" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="709" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">卡核 3 (lcore 6)</text>
  <text x="709" y="315" text-anchor="middle" font-size="11" fill="#64748b">只读 seq = 4, 8, 12…</text>

  <!-- Short Bottom Summary Badges -->
  <rect x="242" y="344" width="260" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="372" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">核间：64 B 粒度 · 零伪共享 (MRV-90)</text>

  <rect x="518" y="344" width="260" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="648" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">核 ⇄ PCIe：4 核齐盯 256 B 落盘前沿</text>
</svg>
