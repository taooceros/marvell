<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" font-family="DejaVu Sans, Noto Sans CJK SC, Droid Sans Fallback, sans-serif">
  <rect width="920" height="340" fill="#ffffff"/>

  <!-- Left box: Host -->
  <rect x="28" y="42" width="190" height="256" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="123" y="76" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">主机核 40</text>
  <text x="123" y="98" font-size="13" fill="#64748b" text-anchor="middle">3.9 GHz · uncore 2.2 GHz</text>

  <rect x="46" y="118" width="154" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="123" y="144" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">发请求 MOVDIR64B</text>
  <text x="123" y="168" font-size="13" fill="#475569" text-anchor="middle">9 ns/条 · 上限 162 M/s</text>

  <rect x="46" y="208" width="154" height="68" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="123" y="233" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">轮询主机回复环</text>
  <text x="123" y="253" font-size="12.5" fill="#475569" text-anchor="middle">1 卡核：14 ns/条 (50.5 M/s)</text>
  <text x="123" y="270" font-size="12.5" fill="#dc2626" text-anchor="middle">4 卡核：33 ns/条 (23.9 M/s)</text>

  <!-- Right box: Card -->
  <rect x="702" y="42" width="190" height="256" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="797" y="76" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">CN106 卡核</text>
  <text x="797" y="98" font-size="13" fill="#64748b" text-anchor="middle">2.0 GHz · 64 B 一致性</text>

  <rect x="720" y="118" width="154" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="797" y="143" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">读 BAR4 请求环</text>
  <text x="797" y="163" font-size="12.5" fill="#dc2626" text-anchor="middle">盯前沿 129 · 停 3µs 162</text>

  <rect x="720" y="208" width="154" height="68" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="797" y="234" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">写合并 (WC) 回程</text>
  <text x="797" y="256" font-size="13" fill="#475569" text-anchor="middle">卡上仅 0.04 µs · 64 B 整行</text>

  <!-- Top path: H2C (Host -> Card) -->
  <line x1="218" y1="150" x2="690" y2="150" stroke="#dc2626" stroke-width="3"/>
  <polygon points="700,150 686,143 686,157" fill="#dc2626"/>

  <!-- H2C queue callout -->
  <rect x="295" y="48" width="330" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="460" y="74" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">去程 (主机 → 卡)：唯一的排队点</text>
  <text x="460" y="98" font-size="13.5" fill="#7f1d1d" text-anchor="middle">单向 / 开环：0.45–0.97 µs（畅通）</text>
  <text x="460" y="119" font-size="13.5" font-weight="bold" fill="#dc2626" text-anchor="middle">闭环 W=64 锁步：积压 3.15–3.63 µs → 13 M/s</text>

  <!-- Bottom path: C2H (Card -> Host) -->
  <line x1="702" y1="242" x2="230" y2="242" stroke="#475569" stroke-width="3"/>
  <polygon points="220,242 234,235 234,249" fill="#475569"/>

  <!-- C2H callout -->
  <rect x="295" y="258" width="330" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="281" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">回程 (卡 → 主机)：写合并从不排队</text>
  <text x="460" y="301" font-size="13" fill="#475569" text-anchor="middle">单向 83–115 M/s · 闭环回程恒为 ~0.5 µs</text>

  <!-- Center contrast badge: Closed-loop vs Open-loop -->
  <rect x="330" y="168" width="260" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="460" y="193" font-size="13.5" font-weight="bold" fill="#dc2626" text-anchor="middle">闭环等回复：锁在 13 M/s</text>
  <text x="460" y="214" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">开环双向对发：35–42 M/s × 2</text>
</svg>
