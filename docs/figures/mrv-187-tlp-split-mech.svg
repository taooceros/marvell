<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="980" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">DSA 写 CN106 BAR4：各级实测计数粒度与 PCIe 64 B TLP 上限</text>

  <!-- Subtle backdrop for Sapphire Rapids Socket 1 -->
  <rect x="24" y="54" width="676" height="206" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="75" font-size="12" font-weight="600" fill="#64748b">Xeon SPR Socket 1 片上通路（同插槽，跨 IIO 栈）</text>

  <!-- Box 1: IIO0 loc_p2p -->
  <rect x="40" y="94" width="184" height="132" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="132" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">dsa2 / IIO₀ 入口</text>
  <text x="132" y="138" text-anchor="middle" font-size="11" fill="#64748b">iio0_loc_p2p 实测</text>
  <text x="132" y="176" text-anchor="middle" font-size="23" font-weight="800" fill="#0f172a">512 B / 次</text>
  <text x="132" y="198" text-anchor="middle" font-size="11" fill="#475569">4 KiB → 8 次</text>
  <text x="132" y="214" text-anchor="middle" font-size="10.2" fill="#64748b">192/300 B: 1.25/1.50×</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="224" y1="160" x2="264" y2="160" stroke="#475569" stroke-width="2.2"/>
  <polygon points="264,154 276,160 264,166" fill="#475569"/>

  <!-- Box 2: IIO0 p2p_txn -->
  <rect x="278" y="94" width="188" height="132" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/>
  <text x="372" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3412">IIO₀ → SPR 2D Mesh</text>
  <text x="372" y="138" text-anchor="middle" font-size="11" fill="#c2410c">Mesh NCB (iio0_p2p_txn)</text>
  <text x="372" y="176" text-anchor="middle" font-size="23" font-weight="800" fill="#ea580c">64 B / 行</text>
  <text x="372" y="198" text-anchor="middle" font-size="11" fill="#9a3412">4 KiB → 64 行</text>
  <text x="372" y="214" text-anchor="middle" font-size="10.2" fill="#c2410c">96/192/300 B → 2/3/5 行</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="466" y1="160" x2="506" y2="160" stroke="#ea580c" stroke-width="2.2"/>
  <polygon points="506,154 518,160 506,166" fill="#ea580c"/>

  <!-- Box 3: IIO1 Root Port -->
  <rect x="520" y="94" width="166" height="132" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
  <text x="603" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">IIO₁ · RP 98:01</text>
  <text x="603" y="138" text-anchor="middle" font-size="11" fill="#64748b">iio1_out_tlp 实测</text>
  <text x="603" y="176" text-anchor="middle" font-size="23" font-weight="800" fill="#ea580c">64 B TLP</text>
  <text x="603" y="198" text-anchor="middle" font-size="11" fill="#475569">4 KiB → 64 包（1:1）</text>
  <text x="603" y="214" text-anchor="middle" font-size="10.2" fill="#c2410c">不二次合并 · IRP₁ 5.45×</text>

  <!-- Arrow 3 -> 4 (PCIe Gen5 x4) -->
  <line x1="686" y1="160" x2="764" y2="160" stroke="#ea580c" stroke-width="2.6"/>
  <polygon points="764,153 778,160 764,167" fill="#ea580c"/>
  <text x="732" y="143" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Gen5 ×4</text>
  <text x="732" y="182" text-anchor="middle" font-size="10.8" fill="#64748b">64 B + 24 B 头</text>

  <!-- Box 4: CN106 BAR4 -->
  <rect x="780" y="94" width="176" height="132" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <text x="868" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">CN106 BAR4</text>
  <text x="868" y="138" text-anchor="middle" font-size="11" fill="#64748b">99:00.0 · 槽 15</text>
  <text x="868" y="176" text-anchor="middle" font-size="23" font-weight="800" fill="#0f172a">11.22 GB/s</text>
  <text x="868" y="198" text-anchor="middle" font-size="11" fill="#475569">175.4 M TLP/s</text>
  <text x="868" y="214" text-anchor="middle" font-size="10.2" fill="#64748b">≈ MOVDIR64B (11.21)</text>

  <!-- Bottom comparison strip -->
  <rect x="24" y="274" width="932" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="293" text-anchor="middle" font-size="12" fill="#334155">
    同 11.22 GB/s 线速顶：CPU MOVDIR64B 需 175.2 M 次/秒 写指令 · DSA 写 64 KiB 仅需 0.17 M 次/秒 门铃（1,024× 少提交）
  </text>
</svg>
