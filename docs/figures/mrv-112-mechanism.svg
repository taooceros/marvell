<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 356" width="920" height="356">
  <defs>
    <style>
      .font { font-family: "DejaVu Sans", "Droid Sans Fallback", sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12px; fill: #475569; }
      .lbl { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .small { font-size: 11px; fill: #475569; }
      .ok { font-size: 11px; font-weight: 700; fill: #334155; }
      .red-big { font-size: 28px; font-weight: 800; fill: #dc2626; }
      .red-lbl { font-size: 14px; font-weight: 700; fill: #991b1b; }
      .red-sub { font-size: 11.5px; fill: #7f1d1d; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .cell0 { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; rx: 3; }
      .cell1 { fill: #cbd5e1; stroke: #475569; stroke-width: 1.2; rx: 3; }
      .gap { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3,2; rx: 3; }
      .red-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 10; }
      .tad-box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="920" height="356" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="175" y="28" text-anchor="middle" class="font title">BAR4 请求环步长</text>
  <text x="535" y="28" text-anchor="middle" class="font title">卡入向瓶颈</text>
  <text x="815" y="28" text-anchor="middle" class="font title">L3 / TAD</text>
  <g transform="translate(24, 52)">
    <rect width="310" height="86" class="box"/>
    <text x="14" y="23" class="font lbl">64 B（紧排基线）</text>
    <text x="296" y="23" text-anchor="end" class="font small">13.1 M/s</text>
    <!-- 128 B block frame -->
    <rect x="14" y="34" width="144" height="34" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" rx="4"/>
    <rect x="18" y="38" width="66" height="26" class="cell0"/>
    <text x="51" y="55" text-anchor="middle" class="font small">核 0 · 64B</text>
    <rect x="88" y="38" width="66" height="26" class="cell1"/>
    <text x="121" y="55" text-anchor="middle" class="font small">核 1 · 64B</text>
    <text x="170" y="50" class="font small">同 128 B 块</text>
    <text x="170" y="65" class="font small">同 4 KiB 页</text>
  </g>

  <!-- Row 2: 128 B -->
  <g transform="translate(24, 152)">
    <rect width="310" height="86" class="box"/>
    <text x="14" y="23" class="font lbl">128 B（独立 LLC 块）</text>
    <text x="296" y="23" text-anchor="end" class="font small">13.5 M/s</text>
    <rect x="14" y="38" width="54" height="26" class="cell0"/>
    <text x="41" y="55" text-anchor="middle" class="font small">核 0</text>
    <rect x="72" y="38" width="28" height="26" class="gap"/>
    <rect x="104" y="38" width="54" height="26" class="cell1"/>
    <text x="131" y="55" text-anchor="middle" class="font small">核 1</text>
    <text x="170" y="50" class="font ok">✓ L2 缺失 −30%</text>
    <text x="170" y="65" class="font small">仍同 4 KiB 页</text>
  </g>

  <!-- Row 3: 4096 / 4224 B -->
  <g transform="translate(24, 252)">
    <rect width="310" height="86" class="box"/>
    <text x="14" y="23" class="font lbl">4096 / 4224 B（独立页）</text>
    <text x="296" y="23" text-anchor="end" class="font small">13.5–15.0 M/s</text>
    <rect x="14" y="38" width="52" height="26" class="cell0"/>
    <text x="40" y="55" text-anchor="middle" class="font small">页 0</text>
    <text x="84" y="55" text-anchor="middle" class="font small">⋯</text>
    <rect x="102" y="38" width="52" height="26" class="cell1"/>
    <text x="128" y="55" text-anchor="middle" class="font small">页 1</text>
    <text x="170" y="50" class="font ok">✓ 跨页预取消除</text>
    <text x="170" y="65" class="font small">LLrd −26%</text>
  </g>

  <!-- Converging arrows from all 3 strides to PEM0/IOBN -->
  <path d="M334,95 C372,95 372,175 404,175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <path d="M334,195 L404,195" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <path d="M334,295 C372,295 372,215 404,215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Central Red Bottleneck: PEM0 -> IOBN -->
  <g transform="translate(410, 74)">
    <rect width="250" height="232" class="red-box"/>
    <text x="125" y="34" text-anchor="middle" class="font red-lbl">PEM0 → IOBN 入向桥</text>
    <text x="125" y="54" text-anchor="middle" class="font red-sub">单通道串行 · ~42 条积压</text>

    <line x1="26" y1="68" x2="224" y2="68" stroke="#fecaca" stroke-width="1.2"/>

    <text x="125" y="114" text-anchor="middle" class="font red-big">74–76 ns</text>
    <text x="125" y="138" text-anchor="middle" class="font red-lbl">每条写入 · 13.1–13.5 M/s</text>

    <rect x="24" y="158" width="202" height="54" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" rx="6"/>
    <text x="125" y="180" text-anchor="middle" class="font lbl">单格需求空轮询</text>
    <text x="125" y="200" text-anchor="middle" class="font small">私有 L1/L2 命中 → 嗅探串行</text>
  </g>

  <!-- Arrow PEM0/IOBN -> TAD -->
  <line x1="660" y1="195" x2="722" y2="195" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)"/>
  <text x="691" y="184" text-anchor="middle" class="font small">逐笔放行</text>

  <!-- Right box: TAD starved -->
  <g transform="translate(730, 118)">
    <rect width="166" height="154" class="tad-box"/>
    <text x="83" y="30" text-anchor="middle" class="font lbl">TAD / LLC 空转</text>
    <text x="83" y="72" text-anchor="middle" class="font red-big" style="font-size:24px;">0.02–0.12</text>
    <text x="83" y="94" text-anchor="middle" class="font small">平均在途（条）</text>
    <line x1="20" y1="108" x2="146" y2="108" stroke="#cbd5e1" stroke-width="1"/>
    <text x="83" y="128" text-anchor="middle" class="font small">retry = 0</text>
    <text x="83" y="144" text-anchor="middle" class="font small">快态需 &gt; 1.0 条</text>
  </g>

</svg>
