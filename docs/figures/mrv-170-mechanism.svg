<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 396" width="1120" height="396" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif">
  <rect width="1120" height="396" fill="#ffffff"/>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="560" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">CN106 NIX0 加固零 LDADDA（--cqe-direct-safe）快/慢路径</text>

  <!-- Row 1: 128 B CQE (2 x 64 B Cache Lines) -->
  <text x="48" y="66" font-size="12.5" font-weight="bold" fill="#475569">128 B CQE（cq_ctx-&gt;caching = 1）</text>

  <!-- Cache Line 0 -->
  <rect x="48" y="76" width="494" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="295" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">Cache Line 0（cq[0..7]）</text>
  <rect x="58" y="102" width="112" height="26" rx="4" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.5"/>
  <text x="114" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6fa5">w0: cqe_type</text>
  <rect x="176" y="102" width="142" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.1"/>
  <text x="247" y="119" text-anchor="middle" font-size="11" fill="#1e293b">w1: err / dsz</text>
  <rect x="324" y="102" width="108" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.1"/>
  <text x="378" y="119" text-anchor="middle" font-size="11" fill="#1e293b">w2: pkt_len</text>
  <rect x="438" y="102" width="94" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="485" y="119" text-anchor="middle" font-size="11" fill="#64748b">w3..w7</text>

  <!-- Cache Line 1 -->
  <rect x="558" y="76" width="514" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="815" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">Cache Line 1（cq[8..15]）</text>
  <rect x="568" y="102" width="96" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.1"/>
  <text x="616" y="119" text-anchor="middle" font-size="11" fill="#1e293b">w8: sg1/segs</text>
  <rect x="670" y="102" width="108" height="26" rx="4" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.5"/>
  <text x="724" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6fa5">w9: seg1_addr</text>
  <rect x="784" y="102" width="114" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.1"/>
  <text x="841" y="119" text-anchor="middle" font-size="11" fill="#1e293b">w10..11: seg2..3</text>
  <rect x="904" y="102" width="158" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.1"/>
  <text x="983" y="119" text-anchor="middle" font-size="11" fill="#1e293b">w12..15: sg2+seg4..6</text>

  <!-- Row 2: Fast Path (Single Accent Blue) -->
  <text x="48" y="166" font-size="12" font-weight="bold" fill="#1d6fa5">健康包快路径（0 LDADDA）</text>

  <!-- Step 1 -->
  <rect x="48" y="176" width="212" height="72" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="2"/>
  <text x="154" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d6fa5">① ldar w0</text>
  <text x="154" y="222" text-anchor="middle" font-size="11.5" fill="#334155">cqe_type = 0 → 空返</text>
  <text x="154" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6fa5">8.36 ns</text>

  <line x1="260" y1="212" x2="290" y2="212" stroke="#1d6fa5" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2 -->
  <rect x="296" y="176" width="234" height="72" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="2"/>
  <text x="413" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d6fa5">② ldar w9 + 验 w1 / w8</text>
  <text x="413" y="222" text-anchor="middle" font-size="11.5" fill="#334155">ctype = 1 · err = 0</text>
  <text x="413" y="239" text-anchor="middle" font-size="11" fill="#64748b">提取 segs 1..6</text>

  <line x1="530" y1="212" x2="560" y2="212" stroke="#1d6fa5" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 3 -->
  <rect x="566" y="176" width="250" height="72" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="2"/>
  <text x="691" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d6fa5">③ 全清 128 B + dmb oshst</text>
  <text x="691" y="222" text-anchor="middle" font-size="11.5" fill="#334155">8×stp xzr（cq[0..15] = 0）</text>
  <text x="691" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6fa5">3.50 ns（+0.00 ns）</text>

  <line x1="816" y1="212" x2="846" y2="212" stroke="#1d6fa5" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 4 -->
  <rect x="852" y="176" width="220" height="72" rx="8" fill="#eff6ff" stroke="#1d6fa5" stroke-width="2"/>
  <text x="962" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d6fa5">④ 写 cq_door</text>
  <text x="962" y="222" text-anchor="middle" font-size="11.5" fill="#334155">归还槽位</text>
  <text x="962" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6fa5">0 LDADDA</text>

  <!-- Row 3 Connectors: Anomaly slow path from Step 2 -->
  <path d="M 413 248 L 413 276" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3"/>
  <path d="M 182 276 L 456 276" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="182" y1="276" x2="182" y2="300" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr-grey)"/>
  <line x1="456" y1="276" x2="456" y2="300" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr-grey)"/>
  <text x="424" y="268" font-size="11" fill="#475569">err≠0 / w9==0 / ctype≠1</text>

  <!-- Row 3 Connectors: Watchdog & QINT guard from Step 4 -->
  <path d="M 962 248 L 962 276" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3"/>
  <path d="M 716 276 L 962 276" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="716" y1="276" x2="716" y2="300" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr-grey)"/>
  <line x1="962" y1="276" x2="962" y2="300" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr-grey)"/>
  <text x="839" y="268" text-anchor="middle" font-size="11" fill="#475569">生产契约门控</text>

  <!-- Row 3: Slow Path & Guard Boxes (Greys only) -->
  <!-- G1: Recoverable RX err / 0-seg -->
  <rect x="48" y="306" width="268" height="62" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="182" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">RX 错包 / 0 段</text>
  <text x="182" y="352" text-anchor="middle" font-size="11.5" fill="#475569">LDADDA 核对 → 释放 / 归还</text>

  <!-- G2: Non-RX fail-stop -->
  <rect x="336" y="306" width="240" height="62" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="456" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">未知非 RX（ctype ≠ 1）</text>
  <text x="456" y="352" text-anchor="middle" font-size="11.5" fill="#334155">fatal_cq_err → 停队复位</text>

  <!-- G3: Watchdog -->
  <rect x="600" y="306" width="232" height="62" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="716" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">周期看门狗</text>
  <text x="716" y="352" text-anchor="middle" font-size="11.5" fill="#475569">wd=4096 + 空轮询超时</text>

  <!-- G4: QINT + sync -->
  <rect x="852" y="306" width="220" height="62" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="962" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">QINT + 停启 sync</text>
  <text x="962" y="352" text-anchor="middle" font-size="11.5" fill="#475569">DOOR_ERR / 清脏槽</text>
</svg>
