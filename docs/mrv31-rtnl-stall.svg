<text x="660" y="508" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="normal">排队等锁：25 秒的采样里，EasyTier 的几个线程每一次都卡在这里</text>
<text x="30" y="576" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">结果：EasyTier 连中心节点 128.208.6.6 的连接 21:30–23:14 断了 14 次；11-10 到 21:10 只断过 1 次。</text>
<text x="30" y="598" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">（锁那一行按 0.1 s 采样各程序打开的 speed 文件画出；EasyTier 一行的“一直在排队”是实测，重连的位置按它日志里约 8.2 s 一次的节奏示意。）</text>
<text x="30" y="646" font-size="17" fill="#0891b2" text-anchor="start" font-weight="bold">③ 修复后</text>
<text x="30" y="684" font-size="15" fill="#0891b2" text-anchor="start" font-weight="bold">补丁：卡以后再重启或卡死时</text>
