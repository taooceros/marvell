<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Droid Sans Fallback, DejaVu Sans, sans-serif">
  <!-- MRV-31. Why EasyTier dropped after the card rebooted: a program reading ens1's speed takes RTNL,
       octeon_ep holds it for 8 s waiting for a card that no longer answers, and EasyTier (2 s per
       reconnect) queues behind the lock. Right: after the reload the card answers in about 4 ms (2.6-5.2 ms measured).
       Measurements and the fix are in the MRV-31 description. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="white"/>

  <!-- headers -->
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#0f172a">卡不回复时，EasyTier 为什么掉线</text>
  <text x="30" y="68" font-size="14" fill="#64748b">卡重启后，修复前</text>
  <text x="730" y="42" font-size="16" font-weight="bold" fill="#0f172a">修复后</text>
  <text x="730" y="68" font-size="14" fill="#64748b">卡正常</text>

  <!-- columns -->
  <g fill="#f1f5f9">
    <rect x="30" y="92" width="190" height="258" rx="12"/>
    <rect x="240" y="92" width="350" height="258" rx="12"/>
    <rect x="610" y="92" width="100" height="258" rx="12"/>
    <rect x="730" y="92" width="200" height="258" rx="12"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">
    <text x="125" y="124">程序</text>
    <text x="415" y="124">内核</text>
    <text x="660" y="124">卡</text>
  </g>

  <!-- before: who holds the lock, who waits -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="44" y="154" width="162" height="52" rx="10"/>
    <rect x="44" y="264" width="162" height="52" rx="10"/>
    <rect x="330" y="154" width="100" height="162" rx="10"/>
    <rect x="462" y="154" width="110" height="52" rx="10"/>
    <rect x="626" y="154" width="68" height="52" rx="10"/>
  </g>
  <g font-size="16" fill="#1e293b" text-anchor="middle">
    <text x="125" y="186">tern / mailstream</text>
    <text x="125" y="296">EasyTier</text>
    <text x="380" y="241">RTNL 锁</text>
    <text x="517" y="186">octeon_ep</text>
    <text x="660" y="186">卡</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#head)">
    <line x1="206" y1="180" x2="328" y2="180"/>
    <line x1="430" y1="180" x2="460" y2="180"/>
    <line x1="206" y1="290" x2="254" y2="290"/>
  </g>

  <!-- the wait: the driver asks a card that does not answer -->
  <line x1="572" y1="180" x2="604" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <g stroke="#dc2626" stroke-width="2.5" stroke-linecap="round">
    <line x1="606" y1="173" x2="616" y2="187"/>
    <line x1="616" y1="173" x2="606" y2="187"/>
  </g>
  <text x="598" y="240" font-size="24" font-weight="bold" fill="#dc2626" text-anchor="middle">8 s</text>

  <!-- EasyTier queues behind the lock -->
  <g fill="#dc2626">
    <rect x="262" y="276" width="8" height="28" rx="2"/>
    <rect x="274" y="276" width="8" height="28" rx="2"/>
    <rect x="286" y="276" width="8" height="28" rx="2"/>
    <rect x="298" y="276" width="8" height="28" rx="2"/>
    <rect x="310" y="276" width="8" height="28" rx="2"/>
  </g>
  <text x="125" y="338" font-size="13" fill="#94a3b8" text-anchor="middle">限时 2 s</text>

  <!-- after: the same paths, small -->
  <g fill="white" stroke="#94a3b8" stroke-width="1.5">
    <rect x="744" y="169" width="36" height="22" rx="6"/>
    <rect x="744" y="279" width="36" height="22" rx="6"/>
    <rect x="800" y="169" width="22" height="132" rx="6"/>
    <rect x="842" y="169" width="36" height="22" rx="6"/>
    <rect x="896" y="169" width="24" height="22" rx="6"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#head)">
    <line x1="780" y1="180" x2="798" y2="180"/>
    <line x1="822" y1="180" x2="840" y2="180"/>
    <line x1="878" y1="180" x2="894" y2="180"/>
    <line x1="780" y1="290" x2="798" y2="290"/>
  </g>
  <text x="872" y="240" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">~4 ms</text>
</svg>
