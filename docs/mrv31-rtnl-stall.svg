<rect width="1200" height="1010" fill="#ffffff"/>
<text x="30" y="38" font-size="24" fill="#1f2328" text-anchor="start" font-weight="bold">MRV-31：卡重启后，EasyTier 为什么会掉线</text>
<text x="30" y="78" font-size="17" fill="#9333ea" text-anchor="start" font-weight="bold">① 两条路都要同一把锁：RTNL（内核里全局的“网络配置锁”，同一时间只能一个人拿）</text>
<rect x="30" y="96" width="210" height="64" rx="8" fill="#1f2328" fill-opacity="0.04" stroke="#1f2328" stroke-width="2"/>
<text x="135" y="123.1" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="normal">tern remote serve</text>
<text x="135" y="144.1" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="normal">mailstream daemon</text>
<line x1="240" y1="128" x2="418" y2="128" stroke="#1f2328" stroke-width="2"  marker-end="url(#a-1f2328)"/>
<text x="329" y="100" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">读 ens1 的速度</text>
<text x="329" y="117" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">/sys/class/net/ens1/speed</text>
<rect x="420" y="96" width="150" height="160" rx="8" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="2"/>
<text x="495" y="160.6" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">RTNL 锁</text>
<text x="495" y="181.6" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">一次只给一个人</text>
<text x="495" y="202.6" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">其他人排队</text>
<line x1="570" y1="128" x2="698" y2="128" stroke="#9333ea" stroke-width="2"  marker-end="url(#a-9333ea)"/>
<text x="634" y="119" font-size="13" fill="#9333ea" text-anchor="middle" font-weight="normal">拿着锁去问驱动</text>
<rect x="700" y="96" width="150" height="64" rx="8" fill="#1f2328" fill-opacity="0.04" stroke="#1f2328" stroke-width="2"/>
<text x="775" y="133.6" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">octeon_ep 驱动</text>
<line x1="850" y1="118" x2="958" y2="118" stroke="#1f2328" stroke-width="2"  marker-end="url(#a-1f2328)"/>
<text x="904" y="109" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">控制邮箱请求</text>
<line x1="958" y1="140" x2="852" y2="140" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-dc2626)"/>
<text x="905" y="158" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="normal">不回复</text>
<rect x="960" y="96" width="210" height="64" rx="8" fill="#64748b" fill-opacity="0.1" stroke="#64748b" stroke-width="2"/>
<text x="1065" y="123.1" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">卡</text>
<text x="1065" y="144.1" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="normal">21:10 重启后不再回复</text>
<text x="775" y="186" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">驱动干等 8 秒才超时，这 8 秒里锁一直被占着</text>
<rect x="30" y="196" width="210" height="60" rx="8" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
<text x="135" y="221.1" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">EasyTier</text>
<text x="135" y="242.1" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">重连前要先列一遍网卡</text>
<line x1="240" y1="226" x2="418" y2="226" stroke="#16a34a" stroke-width="2"  marker-end="url(#a-16a34a)"/>
<text x="329" y="217" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="normal">列网卡（同 ip link）</text>
<text x="590" y="222" font-size="15" fill="#16a34a" text-anchor="start" font-weight="bold">锁被占 → 排队（线程 D 状态，rtnl_dumpit）→ 超过 2 秒连接时限 → 超时、断开</text>
<text x="590" y="246" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">（重连只给 2 秒，排队就用完了）</text>
<text x="30" y="288" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">要这把锁的：ip link / getifaddrs()（列网卡）、读 /sys/class/net/*/speed、ethtool、改地址和路由。不要的：/proc/net/dev（23:00 实测 0.003 s，同时 ip -br link 要 3–7 s）。</text>
<text x="30" y="338" font-size="17" fill="#9333ea" text-anchor="start" font-weight="bold">② 实测时间线 23:06:36–23:07:10：tern 和 mailstream 轮流读 ens1 速度，锁几乎没有空闲</text>
<rect x="150" y="352" width="22" height="14" rx="3" fill="#ea580c" stroke="#ea580c"/>
