<text x="585" y="721.4" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">octeon_ep：卡的心跳已经丢了？</text>
<text x="585" y="740.4" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">是 → 不发邮箱，立刻返回错误</text>
<line x1="720" y1="726" x2="798" y2="726" stroke="#0891b2" stroke-width="2"  marker-end="url(#a-0891b2)"/>
<text x="759" y="717" font-size="13" fill="#0891b2" text-anchor="middle" font-weight="normal">约 0 ms</text>
<rect x="800" y="698" width="370" height="56" rx="8" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
<text x="985" y="721.4" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">锁马上释放</text>
<text x="985" y="740.4" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">EasyTier 照常列网卡、照常连接</text>
<text x="30" y="800" font-size="15" fill="#0891b2" text-anchor="start" font-weight="bold">reload 之后：卡正常，问一次 4–5 ms（23:35 实测，ip -br link 5 ms）</text>
