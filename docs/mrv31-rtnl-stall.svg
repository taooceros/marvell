<rect x="700" y="814" width="170" height="56" rx="8" fill="#64748b" fill-opacity="0.1" stroke="#64748b" stroke-width="2"/>
<text x="785" y="847.25" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">卡（reload 后）</text>
