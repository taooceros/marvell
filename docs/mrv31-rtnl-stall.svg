<text x="1060" y="856.4" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">谁都感觉不到</text>
<text x="30" y="920" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">分工：reload 让卡重新回应，解决这一次；补丁保证以后卡再出问题时，主机不会被拖住。</text>
<text x="30" y="948" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">另外：从 11-01 起每天都有的零星断线，是和家里几个节点之间的连接，在 octeon_ep 加载（11-10）之前就有，和这件事无关。</text>
