   <g id="text_5">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #7f1d1d" transform="translate(81.288908 54.63871)">Large Host Ring / Ideal LIFO</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #7f1d1d" transform="translate(90.692876 62.941819)">(128 MiB in host RAM)</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #7f1d1d" transform="translate(82.713064 70.74271)">Leaky DMA: 91% LLC miss;</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #7f1d1d" transform="translate(84.239829 78.79471)">KV p99 degrades 3.7-6.3x</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #78350f" transform="translate(86.697829 134.268743)">Host-Capped Fixed Rings</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #78350f" transform="translate(70.50115 142.198743)">(ShRing, rxBisect, Passive 256 KiB)</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #78350f" transform="translate(73.112322 150.758431)">Host RAM bound: 75-99.8% burst</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #78350f" transform="translate(75.492439 158.058743)">drops or frequent CCA cutbacks</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(91.386392 198.766771)">Reactive Rate Control</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(101.007439 206.426896)">(HostCC, RHCC)</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(72.105111 214.611412)">Reacts after LLC/IIO misses occur</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1e3a8a" transform="translate(244.267758 168.15597)">Dual-Path On-NIC Buffering (CEIO)</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1e3a8a" transform="translate(235.107258 175.96397)">Proactive credits + NIC DRAM slow path</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1e3a8a" transform="translate(249.281258 183.77197)">Fast/slow split, RMT rule churn,</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1e3a8a" transform="translate(231.734258 191.57997)">phase-exclusivity pause, 2P1C SW merge,</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1e3a8a" transform="translate(240.925258 199.29897)">host async_recv() pull, &gt;1K-flow cliff</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.15px; font-family: 'DejaVu Sans'; fill: #134e4a" transform="translate(259.521907 63.407291)">CreditRing (This Work)</text>
    <text style="font-weight: 700; font-size: 6.15px; font-family: 'DejaVu Sans'; fill: #134e4a" transform="translate(233.026938 70.910291)">Single Unified Credit-Gated Push Path</text>
    <text style="font-weight: 700; font-size: 6.15px; font-family: 'DejaVu Sans'; fill: #134e4a" transform="translate(230.05716 78.413291)">256 KiB L3 hot ring + NIC L3/DDR5 FIFO</text>
    <text style="font-weight: 700; font-size: 6.15px; font-family: 'DejaVu Sans'; fill: #134e4a" transform="translate(230.214754 85.940314)">0% drops, 100% DDIO, O(1) credit state</text>
    <text style="font-weight: 700; font-size: 6.15px; font-family: 'DejaVu Sans'; fill: #134e4a" transform="translate(223.984516 93.419291)">No steering, no phase pause, no SW merge</text>
   </g>
