# The shipped octep_cp_agent (SDK12.25.x) is the VFIO build: it reaches PEM0
# through vfio-pci and expects firmware's host BAR4 map. pcie_marvell_cnxk_ep
# rewrites PEM0 BAR4_INDEX 7..14 at probe, so the host reads the control
# mailbox from the wrong memory ("octep_ctrl_mbox : Invalid magic number 0").
# Marvell: DAO doc/guides/gsg/kernel.rst ("modprobe.blacklist=pcie_marvell_cnxk_ep
# is required only on cn10k platforms"), DAO commit f5ee09e.
blacklist pcie_marvell_cnxk_ep
